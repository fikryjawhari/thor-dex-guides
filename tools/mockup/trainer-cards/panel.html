<fieldset><legend>Search bar and spacing</legend>
 <label class="sl">Height <input type="range" id="v-sbh" min="22" max="44" step="1"> <b id="o-sbh"></b> px</label>
 <label class="sl">Font <input type="range" id="v-sbf" min="10" max="17" step="0.5"> <b id="o-sbf"></b> px</label>
 <label class="sl">Gap (edges and between boxes) <input type="range" id="v-g" min="2" max="12" step="1"> <b id="o-g"></b> px</label>
 <p class="hint">The bar shows only while a query is set (on every page, Trainers included). The gap is one value: page edge, between boxes, header padding. Pokémon rows keep their own 4 px.</p>
 <style>.sl{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.sl input{flex:1;min-width:80px}</style>
 <script>
 (function(){const V=()=>thorFrame().getVars?thorFrame().getVars():{sbh:30,sbf:13,g:6};
  const sync=()=>{const v=V();for(const k of ['sbh','sbf','g']){const i=document.getElementById('v-'+k);if(document.activeElement!==i)i.value=v[k];document.getElementById('o-'+k).textContent=v[k];}};
  for(const k of ['sbh','sbf','g'])document.getElementById('v-'+k).oninput=e=>{thorFrame().setVar(k,e.target.value);sync();};
  sync();setInterval(sync,1000);})();
 </script>
</fieldset>
