<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light">
<title>Unbound missions</title>
<style>
:root{--bg:#121417;--panel:#1b1e23;--panel2:#23272e;--line:#2e333b;--fg:#e8eaed;--mut:#9aa0a8;--acc:#f0b429;--link:#8ab4f8;--rail:#181a1e;--railon:rgba(240,180,41,.14);--key:#2b3038}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f7;--panel:#fff;--panel2:#eef0f3;--line:#d9dce1;--fg:#1d2126;--mut:#5f6670;--acc:#b7791f;--link:#1a56db;--rail:#e7e9ed;--railon:rgba(183,121,31,.14);--key:#fff}}
*{box-sizing:border-box;overflow-anchor:none}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit;color:inherit}button,summary,label{touch-action:manipulation}button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;min-height:44px}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}summary{cursor:pointer;list-style:none;min-height:44px}summary::-webkit-details-marker{display:none}summary::after{content:'▸';color:var(--mut);flex:none}details[open]>summary::after{content:'▾'}a{color:var(--link)}.mut{color:var(--mut)}.small{font-size:12px}.tag{display:inline-block;white-space:nowrap;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--mut)}.tag.got{color:var(--acc);border-color:var(--acc)}
#rail{position:fixed;inset:0 auto 0 0;width:44px;background:var(--rail);display:flex;flex-direction:column;z-index:5}#rail button{width:44px;min-height:44px;border:0;border-radius:0;background:transparent;padding:10px}#rail svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}#rail .on{color:var(--acc);background:var(--railon);box-shadow:inset 3px 0 var(--acc)}#app{margin-left:44px;padding:4px;min-width:0}.wtool{display:grid;gap:4px}.resume{display:block;text-align:left;width:100%;padding:8px;font-size:13px;overflow-wrap:anywhere}.resume b,.resume span{display:block}.resume b{color:var(--acc)}.bar{display:flex;gap:4px}.bar button{flex:1;min-width:0;font-size:12px}.split{margin:6px 0}.split>summary{display:flex;gap:5px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:6px;font-weight:700}.split>summary .name{flex:1;min-width:0}.body{padding:0 2px}details.stopd{margin:10px 0}.stoph{display:flex;align-items:center;gap:6px;border-left:3px solid var(--acc);padding:4px 0 4px 10px;font-weight:700;font-size:15px}.stoph .pn{flex:1;min-width:0;overflow-wrap:anywhere}.stop{padding-left:10px;border-left:3px solid var(--line)}details.stopd[open]>summary{position:sticky;top:0;background:var(--bg);z-index:3}details.sec>summary{display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--line);padding:4px 0;font-size:14px}details.sec>summary .sn{font-weight:700;color:var(--acc);flex:1}details.sec[open]>summary{position:sticky;top:var(--stop-height,44px);background:var(--bg);z-index:2}.secb{padding:2px 0 4px}.wstep{display:flex;gap:8px;align-items:flex-start;padding:10px 0;min-height:44px;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}.wstep input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--acc)}.wstep>span{min-width:0;flex:1}.wstep.done>span{opacity:.5;text-decoration:line-through}.mission{margin:4px 0}.mission>summary{display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--line);padding:6px 2px;font-size:14px}.mission>summary .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}.mission-meta{font-size:12px;color:var(--mut);margin:6px 0;overflow-wrap:anywhere}.mission-meta b{color:var(--fg)}body[data-style=card] .mission{border:1px solid var(--line);border-radius:6px;background:var(--panel)}body[data-style=card] .mission>summary{padding:6px}body[data-style=card] .mission>.secb{padding:0 6px 4px}.collapse{width:100%;font-size:12px;margin:4px 0}.flash{animation:flash 1.4s ease-out}@keyframes flash{from{box-shadow:inset 0 0 0 2px var(--acc);background:var(--railon)}to{box-shadow:inset 0 0 transparent}}footer{font-size:11px;color:var(--mut);padding:15px 2px;overflow-wrap:anywhere}
#search{display:none;position:fixed;inset:0;z-index:19;background:var(--bg);flex-direction:column}#search.open{display:flex}.searchbar{display:flex;gap:2px;padding:2px;flex:none}.searchbar button{min-width:40px}.searchbar input,.searchbar .query{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);padding:4px;overflow-wrap:anywhere}.query{text-align:left}#query-slot{display:flex;flex:1;min-width:0}#results{flex:1;overflow:auto;padding:4px}.hit{display:block;width:100%;text-align:left;padding:8px;margin-bottom:4px;font-size:14px;overflow-wrap:anywhere}.hit small{display:block;color:var(--mut)}#keyboard{display:none;padding:3px;background:var(--panel);flex:none}#keyboard.show{display:block}.keyrow{display:flex;gap:2px;margin:2px 0}.keyrow button{flex:1;min-width:0;min-height:34px;padding:0;font-size:13px;background:var(--key)}.keyrow .space{flex:4}.keyrow .done{flex:2}@media(min-height:360px){.keyrow button{min-height:42px}}
</style></head><body data-style="line">
<nav id="rail" aria-label="Walkthrough tools">
<button id="search-open" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></button>
<button id="walk-tab" class="on" aria-label="Walkthrough"><svg viewBox="0 0 24 24"><path d="M12 5C8 2 4 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-4-2-7-1-10 1v15"/></svg></button>
<button id="jump-up" aria-label="Top">↑</button><button id="jump-down" aria-label="Bottom">↓</button></nav>
<main id="app"></main>
<section id="search" aria-label="Search walkthrough" role="dialog" aria-modal="true"><div class="searchbar"><button id="search-back" aria-label="Back">‹</button><span id="query-slot"></span><button id="search-clear" aria-label="Clear search">×</button><button id="keyboard-toggle" aria-label="Hide keyboard">⌄</button></div><div id="results"></div><div id="keyboard"></div></section>
<script>
'use strict';
const STOPS=[
 {k:'icicle-cave',n:'Icicle Cave',s:[
  {k:'follow-sandslash',t:'Follow the Sandslash from Bellin Town into the west cavern.',n:'Start The Food Thief at the northeast house in Bellin Town.'},
  {m:'mission-007',n:'Am I Blind?',u:'After starting The Food Thief; inspect the tablet in Icicle Cave’s west cavern.',r:'5 Wishing Pieces',note:'Accept now; completing every puzzle needs Champion status and the ADM.',s:[
   {k:'accept',t:'Inspect the tablet and accept the Ruin Maniac’s mission.',n:'Receive the Braille Converter.'},
   {k:'icicle',t:'Solve the Icicle Cave tablet.',n:'Strength and Rock Climb: push the boulder onto the switch.'},
   {k:'cinder',t:'Solve the Cinder Volcano tablet.',n:'Strength: push the boulder north and east onto the switch.'},
   {k:'valley',t:'Solve the Valley Cave tablet.'},{k:'frost',t:'Solve the Frost Mountain tablet.'},
   {k:'thundercap',t:'Solve the Thundercap Mountain tablet.'},{k:'void',t:'Solve the Ruins of Void tablet.'},
   {k:'crystal',t:'Solve the Crystal Peak tablet.'},{k:'victory',t:'Solve the Victory Road tablet.'},
   {k:'underwater',t:'Solve the underwater Ruins of Void tablet.'},{k:'reward',t:'Return to the Ruin Maniac for 5 Wishing Pieces.'}]},
  {k:'route-two',t:'Leave Icicle Cave toward Route 2.'}]},
 {k:'antisis-city',n:'Antisis City',s:[
  {k:'hq',t:'Visit the Black Emboar HQ beside the Poké Mart.'},
  {m:'mission-003',n:'A Minor Scrap',u:'Reach Antisis City; complete The Black Emboar and The Terror Granbull.',r:'Power Bracer',s:[
   {k:'accept',t:'Talk to the upstairs goon nearest the staircase.',n:'He takes you straight to the east bridge.'},
   {k:'battle',t:'Win the street battle, then the Double Battle against Rory and Chad.'},
   {k:'reward',t:'Collect the Power Bracer when you return to HQ.'}]},
  {k:'port',t:'Continue to Antisis Port.'}]},
 {k:'seaport-city',n:'Seaport City',s:[
  {k:'arrive',t:'Cross Route 17 and enter Seaport City.'},
  {m:'mission-009',n:'Armoured Body',u:'Complete Flaming Body at the Breeder’s School; Armoured Body starts automatically.',r:'Perfect-IV Ditto',s:[
   {k:'hatch',t:'Hatch 50 Pokémon Eggs.',n:'Check the in-game Mission Log for your total.'},
   {k:'reward',t:'Return to the southeast Breeder at the Breeder’s School for Ditto.'}]},
  {k:'rod',t:'Obtain the Super Rod in Seaport City.'}]}
];
const STORAGE='unbound-missions-mock-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch{}
const map=value=>value&&typeof value==='object'&&!Array.isArray(value)?value:{};
const state={ticks:map(saved.ticks),missions:map(saved.missions),stops:map(saved.stops),sections:map(saved.sections),split:saved.split===true,style:saved.style==='card'?'card':'line',auto:saved.auto===true,query:typeof saved.query==='string'?saved.query:''};
const INV=/\.appassets\.androidplatform\.net$/.test(location.hostname)||(()=>{try{return localStorage.getItem('dvkb')==='1'}catch{return false}})();
const app=document.getElementById('app'),search=document.getElementById('search');
const esc=text=>String(text??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
const norm=text=>String(text).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}};
const all=STOPS.flatMap(stop=>stop.s.flatMap(entry=>entry.m?entry.s.map(step=>({stop,mission:entry,step,id:JSON.stringify(['mission',entry.m,step.k])})):[{stop,step:entry,id:JSON.stringify(['stop',stop.k,entry.k])}]));
const nextStep=()=>all.find(entry=>!state.ticks[entry.id]);
const totalFor=key=>key==='all'?all:all.filter(entry=>entry.stop.k===key||entry.mission?.m===key);
const progress=key=>{const group=totalFor(key);return [group.filter(entry=>state.ticks[entry.id]).length,group.length]};
const badge=key=>{const [done,total]=progress(key);return `<span class="tag ${done===total&&total?'got':''}" data-count="${esc(key)}" aria-label="${done} of ${total} steps complete">${done} / ${total}</span>`};
function stepHTML(stop,step,mission){const entry=all.find(item=>item.stop===stop&&item.step===step&&item.mission===mission);return `<label class="wstep ${state.ticks[entry.id]?'done':''}" data-id="${esc(entry.id)}"><input type="checkbox" aria-label="${esc(step.t)}" ${state.ticks[entry.id]?'checked':''}><span>${esc(step.t)}${step.n?`<div class="mut small">${esc(step.n)}</div>`:''}</span></label>`}
function missionHTML(stop,mission){return `<details class="mission" data-m="${mission.m}" ${state.missions[mission.m]?'open':''}><summary><span class="name">${esc(mission.n)}</span>${badge(mission.m)}</summary><div class="secb"><div class="mission-meta"><b>Unlock:</b> ${esc(mission.u)}</div><div class="mission-meta"><b>Reward:</b> ${esc(mission.r)}</div>${mission.note?`<div class="mission-meta">${esc(mission.note)}</div>`:''}${mission.s.map(step=>stepHTML(stop,step,mission)).join('')}<button class="collapse" data-collapse="${mission.m}">Collapse ${esc(mission.n)}</button></div></details>`}
function nextHTML(){const entry=nextStep();return entry?`<b>Next step</b><span>${esc(entry.stop.n)}${entry.mission?' · '+esc(entry.mission.n):''} · ${esc(entry.step.t)}</span>`:'<b>Checklist done</b>'}
function render(){document.body.dataset.style=state.style;app.innerHTML=`<div class="wtool"><details><summary class="stoph"><span class="pn">Guide info</span></summary><button id="reset">Reset checklist</button></details><button class="resume wk-next" ${nextStep()?'':'disabled'}>${nextHTML()}</button><div class="bar"><button id="expand">Expand all</button><button id="collapse">Collapse all</button></div></div><details class="split" ${state.split?'open':''}><summary><span class="name">Borrius</span>${badge('all')}</summary><div class="body">${STOPS.map(stop=>`<details class="stopd" data-stop="${stop.k}" ${state.stops[stop.k]===false?'':'open'}><summary class="stoph"><span class="pn">${esc(stop.n)}</span></summary><div class="stop"><details class="sec" data-section="${stop.k}" ${state.sections[stop.k]?'open':''}><summary><span class="sn">Checklist</span>${badge(stop.k)}</summary><div class="secb">${stop.s.map(entry=>entry.m?missionHTML(stop,entry):stepHTML(stop,entry)).join('')}</div></details></div></details>`).join('')}</div></details><footer>Mission and place summaries: Unbound Wiki (missions 007, 003, 009; walkthrough parts 1, 2, 27, 31). Design mockup.</footer>`;
 app.querySelector('.wk-next').onclick=()=>{const entry=nextStep();if(entry)land(entry)};
 app.querySelector('#expand').onclick=()=>{app.querySelector('.split').open=true};app.querySelector('#collapse').onclick=()=>{app.querySelector('.split').open=false};
 app.querySelector('#reset').onclick=()=>{if(confirm('Clear every walkthrough checkbox?')){state.ticks={};save();render()}};
 app.querySelectorAll('details').forEach(details=>details.addEventListener('toggle',()=>{if(!details.isConnected)return;if(details.matches('.split'))state.split=details.open;if(details.dataset.stop)state.stops[details.dataset.stop]=details.open;if(details.dataset.section)state.sections[details.dataset.section]=details.open;if(details.dataset.m)state.missions[details.dataset.m]=details.open;save();measure()}));
 app.querySelectorAll('.wstep input').forEach(input=>input.onchange=()=>{const row=input.closest('.wstep'),entry=all.find(item=>item.id===row.dataset.id);if(input.checked)state.ticks[entry.id]=true;else delete state.ticks[entry.id];row.classList.toggle('done',input.checked);updateCounts();save();if(state.auto&&entry.mission&&progress(entry.mission.m)[0]===entry.mission.s.length)collapseMission(row.closest('.mission'))});
 app.querySelectorAll('[data-collapse]').forEach(button=>button.onclick=()=>collapseMission(button.closest('.mission')));measure()}
function reveal(row){const stop=row.closest('.stopd'),section=row.closest('.sec');const pinned=stop.querySelector('summary').offsetHeight+section.querySelector('summary').offsetHeight;scrollBy(0,row.getBoundingClientRect().top-pinned-4);row.classList.remove('flash');void row.offsetWidth;row.classList.add('flash');(row.querySelector('input')||row).focus({preventScroll:true})}
function collapseMission(mission){mission.open=false;requestAnimationFrame(()=>reveal(mission.querySelector('summary')))}
function updateCounts(){app.querySelectorAll('[data-count]').forEach(tag=>{const [done,total]=progress(tag.dataset.count);tag.textContent=done+' / '+total;tag.classList.toggle('got',done===total&&total>0);tag.setAttribute('aria-label',`${done} of ${total} steps complete`)});const button=app.querySelector('.wk-next');button.innerHTML=nextHTML();button.disabled=!nextStep()}
function measure(){app.querySelectorAll('.stopd').forEach(stop=>stop.style.setProperty('--stop-height',stop.querySelector('summary').offsetHeight+'px'))}
function land(entry){state.split=true;state.stops[entry.stop.k]=true;state.sections[entry.stop.k]=true;if(entry.mission)state.missions[entry.mission.m]=true;save();render();closeSearch();requestAnimationFrame(()=>reveal(entry.missionOnly?app.querySelector(`[data-m="${entry.mission.m}"]>summary`):[...app.querySelectorAll('.wstep')].find(item=>item.dataset.id===entry.id)))}
let queryInput,keyboardVisible=INV,digits=false;
function hits(){const query=norm(state.query);if(!query)return [];const found=[];for(const stop of STOPS)for(const entry of stop.s){if(entry.m){const group=all.filter(item=>item.mission===entry);if(norm([entry.n,entry.u,entry.r,entry.note].join(' ')).includes(query))found.push({...group[0],missionOnly:true});else found.push(...group.filter(item=>norm([item.step.t,item.step.n].join(' ')).includes(query)))}else if(norm([stop.n,entry.t,entry.n].join(' ')).includes(query))found.push(all.find(item=>item.step===entry))}return found}
function results(){document.getElementById('results').innerHTML=state.query?(hits().map(entry=>`<button class="hit" data-hit="${esc(entry.id)}">${esc(entry.missionOnly?entry.mission.n:entry.step.t)}<small>${esc(entry.stop.n)}${entry.mission?' · '+esc(entry.mission.n):''}</small></button>`).join('')||'<p class="mut">No results</p>'):'';document.querySelectorAll('[data-hit]').forEach(button=>button.onclick=()=>land(hits().find(entry=>entry.id===button.dataset.hit)));if(INV)queryInput.textContent=state.query||'Search walkthrough';save()}
function setQuery(value){state.query=value;if(!INV)queryInput.value=value;results()}
function closeSearch(){search.classList.remove('open');app.inert=false;document.getElementById('rail').inert=false;document.getElementById('search-open').focus({preventScroll:true})}
function openSearch(){search.classList.add('open');app.inert=true;document.getElementById('rail').inert=true;results();queryInput.focus({preventScroll:true})}
function buildKeyboard(){const keyboard=document.getElementById('keyboard');keyboard.classList.toggle('show',INV&&keyboardVisible);keyboard.innerHTML=[digits?'1234567890':'QWERTYUIOP','ASDFGHJKL',['123',...'ZXCVBNM','⌫'],['Clear','Space','Done']].map(row=>`<div class="keyrow">${[...row].map(key=>`<button data-key="${key}" class="${key==='Space'?'space':key==='Done'?'done':''}" aria-label="${key==='⌫'?'Backspace':key}">${key}</button>`).join('')}</div>`).join('');keyboard.querySelectorAll('[data-key]').forEach(button=>{const press=()=>{const key=button.dataset.key;if(key==='Done'){const hit=hits()[0];if(hit)land(hit);else closeSearch()}else if(key==='123'){digits=!digits;buildKeyboard()}else setQuery(key==='Clear'?'':key==='⌫'?state.query.slice(0,-1):state.query+(key==='Space'?' ':key.toLowerCase()))};button.onclick=press;if(button.dataset.key==='⌫'){let repeat;const clear=()=>clearInterval(repeat);button.onpointerdown=()=>{repeat=setInterval(press,180)};button.onpointerup=clear;button.onpointerleave=clear;button.onpointercancel=clear}})}
document.getElementById('query-slot').innerHTML=INV?'<button class="query" aria-label="Search query"></button>':'<input aria-label="Search query" placeholder="Search walkthrough">';queryInput=document.getElementById('query-slot').firstElementChild;
if(INV)queryInput.onclick=()=>{keyboardVisible=!keyboardVisible;buildKeyboard()};else{queryInput.value=state.query;queryInput.oninput=()=>setQuery(queryInput.value);queryInput.onkeydown=event=>{if(event.key==='Enter'){const hit=hits()[0];if(hit)land(hit);else closeSearch()}}}
document.getElementById('search-open').onclick=openSearch;document.getElementById('search-back').onclick=closeSearch;document.getElementById('search-clear').onclick=()=>setQuery('');document.getElementById('keyboard-toggle').hidden=!INV;document.getElementById('keyboard-toggle').onclick=()=>{keyboardVisible=!keyboardVisible;document.getElementById('keyboard-toggle').setAttribute('aria-label',keyboardVisible?'Hide keyboard':'Show keyboard');buildKeyboard()};
document.getElementById('walk-tab').onclick=()=>{setQuery('');closeSearch();scrollTo(0,0)};document.getElementById('jump-up').onclick=()=>scrollTo(0,0);document.getElementById('jump-down').onclick=()=>scrollTo(0,document.body.scrollHeight);document.addEventListener('keydown',event=>{if(event.key==='Escape'&&search.classList.contains('open'))closeSearch()});
window.setOption=(name,value)=>{if(name==='style')state.style=value==='card'?'card':'line';if(name==='auto')state.auto=value===true||value==='yes';save();const position=scrollY;render();scrollTo(0,position)};
window.demo=kind=>{state.ticks={};state.missions={};state.split=true;STOPS.forEach(stop=>{state.stops[stop.k]=true;state.sections[stop.k]=true});if(kind==='partial')all.filter(entry=>entry.mission?.m==='mission-007').slice(0,2).forEach(entry=>state.ticks[entry.id]=true);if(kind==='missions-only')all.filter(entry=>!entry.mission).forEach(entry=>state.ticks[entry.id]=true);if(kind==='last')all.slice(0,-1).forEach(entry=>state.ticks[entry.id]=true);if(kind==='done')all.forEach(entry=>state.ticks[entry.id]=true);save();render();scrollTo(0,0)};
window.mockup={all,state,nextStep,land,setQuery,openSearch,progress,storage:STORAGE};
new ResizeObserver(measure).observe(app);addEventListener('resize',measure);render();buildKeyboard();
</script></body></html>
