<title>Walkthrough Empty Stops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: controls on top, two Thor-sized frames (Now, Proposed) side by side, review panel under them; dark like the guide */
:root{--bg:#101216;--panel:#181b21;--line:#2a2f38;--fg:#e8eaee;--mut:#8d95a3;--acc:#f0b429;--bad:#e5645a;--good:#5cc08a;--chip:#232830;color-scheme:dark;
 --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:18px;margin:0}
.sub{color:var(--mut);margin:2px 0 0;max-width:62ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.pn button,select{background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer;min-height:36px}
.tabs button[aria-pressed=true]{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pn{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{max-width:100%}
.frames{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.fr{display:flex;flex-direction:column;gap:6px}
.fr h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0}
.scr{width:260px;height:316px;overflow-y:auto;overflow-x:hidden;background:#111;border:2px solid #3a404b;border-radius:6px;font-size:13px}
.sph{position:sticky;top:0;background:#1b1e24;border-bottom:1px solid var(--line);padding:7px 9px;font-weight:600;font-size:13px;z-index:2}
.sph small{color:var(--mut);font-weight:400;display:block}
.stop{border-left:3px solid var(--acc);margin:10px 0 0 6px;padding:2px 8px 4px}
.stop.empty{border-left-color:var(--bad);background:repeating-linear-gradient(135deg,#2a1513 0 6px,#111 6px 12px)}
.stop .nm{font-size:15px;font-weight:700;line-height:1.25}
.stop .nm i{font-style:normal;color:var(--mut);font-weight:400;font-size:11px}
.stop .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.t{background:var(--chip);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--mut)}
.t b{color:var(--acc);font-weight:600}
.er{color:var(--bad);font-size:11px;margin-top:3px}
.cnt{color:var(--mut);font-size:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.box h3{margin:0 0 8px;font-size:14px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 14px}
.list label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer;min-width:0}
.list label span{min-width:0;overflow-wrap:anywhere}
.list input{margin-top:3px;width:16px;height:16px;flex:none}
.list .p{color:var(--mut);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
.sc{overflow-x:auto}
.ch td:nth-child(3){color:var(--good)}
.q{display:flex;flex-direction:column;gap:10px}
.q .it{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.q .it b{display:block}
.q .it.ask{border-left-color:var(--acc)}
.mut{color:var(--mut)}
.sum{font-size:13px}
.sum b{color:var(--acc)}
@media (max-width:600px){.scr{width:100%}.fr{width:100%}}
</style>
<div class="wrap">
 <div><h1>Walkthrough: empty stops</h1>
 <p class="sub">Photonic Sun, real stops from the build. Left is the walkthrough now, right is what the spec would leave. Untick a stop in Review to keep it.</p></div>
 <div class="tabs" id="tabs"></div>
 <div id="v-fr">
  <div class="pn"><button id="pv" aria-label="Previous part">‹</button><select id="ps" aria-label="Part"></select><button id="nx" aria-label="Next part">›</button><span class="sum" id="sum"></span></div>
  <div class="frames" style="margin-top:12px">
   <div class="fr"><h2>Now</h2><div class="scr" id="f0"></div></div>
   <div class="fr"><h2>Proposed</h2><div class="scr" id="f1"></div></div>
  </div>
 </div>
 <div id="v-rv" hidden></div>
 <div id="v-ti" hidden></div>
 <div id="v-is" hidden></div>
</div>
<script>
const SP=/*DATA*/[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isEmpty=s=>!s.x&&!s.a.length&&!s.i&&!s.t&&!s.s&&!s.note;
const keep=new Set();                     // "si.ti" of empty stops the user wants to keep
const lastOf=(a)=>a[a.length-1];
const title=(sp,st)=>{if(!st.length)return '(no stops)';const a=st[0].n,b=lastOf(st).n;return sp.p+'. '+a+(b!==a?' – '+b:'');};
const kept=(si)=>SP[si].st.filter((s,ti)=>!isEmpty(s)||keep.has(si+'.'+ti));
const oldT=si=>title(SP[si],SP[si].st);
const newT=si=>title(SP[si],kept(si));
let cur=0,tab='fr';
const TABS=[['fr','Compare'],['rv','Review the 21'],['ti','Part titles'],['is','Things to check']];
function stopHTML(s,mark){
 const tg=[];
 if(s.a.length)tg.push(`<span class="t"><b>Encounters</b> ${esc(s.a.join(', '))}</span>`);
 if(s.i)tg.push(`<span class="t"><b>Items</b> ${s.i}</span>`);
 if(s.t)tg.push(`<span class="t"><b>Trainers</b> ${s.t}</span>`);
 return `<div class="stop ${mark&&isEmpty(s)?'empty':''}"><div class="nm">${esc(s.n)}${s.x?' <i>(on the way)</i>':''}</div>${tg.length?`<div class="tg">${tg.join('')}</div>`:''}${mark&&isEmpty(s)?'<div class="er">empty: nothing under this heading</div>':''}</div>`;}
function frame(el,si,proposed){
 const st=proposed?kept(si):SP[si].st;
 el.innerHTML=`<div class="sph">${esc(proposed?newT(si):oldT(si))}<small>${st.length} stop${st.length===1?'':'s'}</small></div>`+st.map(s=>stopHTML(s,!proposed)).join('');
}
function renderFr(){
 frame(document.getElementById('f0'),cur,false);frame(document.getElementById('f1'),cur,true);
 const a=SP[cur].st.length,b=kept(cur).length;
 document.getElementById('sum').innerHTML=a===b?'No empty stops in this part.':`<b>${a-b}</b> of ${a} stops dropped.`;
 document.getElementById('ps').value=cur;
}
function renderRv(){
 const rows=[];SP.forEach((sp,si)=>sp.st.forEach((s,ti)=>{if(isEmpty(s))rows.push([si,ti,s]);}));
 document.getElementById('v-rv').innerHTML=`<div class="box"><h3>${rows.length} empty stops</h3><p class="mut" style="margin:0 0 8px">Ticked = dropped. Untick one to keep its heading (it stays empty, so it would need a line of text to be useful). Tap a name to see its part.</p><div class="list">`+
 rows.map(([si,ti,s])=>`<label><input type="checkbox" data-k="${si}.${ti}" ${keep.has(si+'.'+ti)?'':'checked'}><span>${esc(s.n)}<br><a class="p" href="#" data-si="${si}" style="color:inherit">part ${SP[si].p}</a></span></label>`).join('')+`</div></div>`;
 document.querySelectorAll('#v-rv input').forEach(i=>i.onchange=()=>{i.checked?keep.delete(i.dataset.k):keep.add(i.dataset.k);renderFr();renderTi();renderIs();});
 document.querySelectorAll('#v-rv a').forEach(a=>a.onclick=e=>{e.preventDefault();cur=+a.dataset.si;setTab('fr');});
}
function renderTi(){
 const ch=SP.map((sp,si)=>[si,oldT(si),newT(si),sp.st.length,kept(si).length]).filter(r=>r[1]!==r[2]);
 document.getElementById('v-ti').innerHTML=`<div class="box"><h3>${ch.length} of ${SP.length} part titles change</h3><p class="mut" style="margin:0 0 8px">A part is named after its first and last stop, so the title follows the stops that are left.</p><div class="sc"><table class="ch"><tr><th>Now</th><th></th><th>Proposed</th><th>Stops</th></tr>`+
 ch.map(r=>`<tr><td>${esc(r[1])}</td><td>→</td><td>${esc(r[2])}</td><td>${r[3]} → ${r[4]}</td></tr>`).join('')+`</table></div></div>`;
}
function renderIs(){
 // repeat visits after the drop, and stops with a single item and nothing else
 const vis={};SP.forEach((sp,si)=>kept(si).forEach(s=>{if(!s.x)(vis[s.n]??=[]).push(sp.p);}));
 const rep=Object.entries(vis).filter(([n,v])=>v.length>1).sort((a,b)=>b[1].length-a[1].length);
 const thin=[];SP.forEach((sp,si)=>kept(si).forEach(s=>{if(!s.x&&!s.a.length&&!s.t&&!s.s&&s.i===1)thin.push(sp.p+'. '+s.n);}));
 const total=SP.reduce((n,sp)=>n+sp.st.length,0),left=SP.reduce((n,_,si)=>n+kept(si).length,0);
 document.getElementById('v-is').innerHTML=`<div class="q">
 <div class="it"><b>Starter is on Route 1 already</b><span class="mut">Part 1 now starts at "Route 1 (Hau'oli Outskirts)" with the Starter picker inside Encounters. Check in Compare, part 1. Nothing to change.</span></div>
 <div class="it"><b>${total} stops → ${left}</b><span class="mut">Every part keeps at least one stop. Parts with the biggest drop: ${SP.map((sp,si)=>[sp.p,sp.st.length-kept(si).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>'part '+x[0]+' (−'+x[1]+')').join(', ')}.</span></div>
 <div class="it ask"><b>Story beats you lose</b><span class="mut">Megalo Tower, Guardians of Alola, the three Ruins stops, Lake of the Sunne, Professor Kukui's Lab and the Dimensional Research Lab are story moments with nothing to do in them. If you want any as a signpost, untick it in Review.</span></div>
 <div class="it ask"><b>Stops left with a single item and nothing else (${thin.length})</b><span class="mut">Not dropped by the spec. Say if one item is too thin to deserve a heading: ${thin.length?esc(thin.join('; ')):'none'}.</span></div>
 <div class="it ask"><b>Places you visit more than once stay separate (${rep.length})</b><span class="mut">Kept because each visit has its own trainers or items. ${rep.slice(0,10).map(([n,v])=>esc(n)+' ×'+v.length+' (parts '+v.join(', ')+')').join('; ')}${rep.length>10?'…':''}. Say if you want any merged.</span></div>
 <div class="it"><b>Locations "Walk" links</b><span class="mut">A place's visit count follows the stops left: Seaward Cave and Kala'e Bay go from two visits to one.</span></div>
 <div class="it"><b>Saved state</b><span class="mut">Closed stops are saved by position, so after the drop a stop you closed may open again and another may close. Splits you left open stay open. No migration planned.</span></div>
 </div>`;
}
function setTab(t){tab=t;['fr','rv','ti','is'].forEach(k=>document.getElementById('v-'+k).hidden=k!==t);
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));if(t==='fr')renderFr();}
document.getElementById('tabs').innerHTML=TABS.map(([k,n])=>`<button data-t="${k}" aria-pressed="false">${n}</button>`).join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
document.getElementById('ps').innerHTML=SP.map((sp,si)=>`<option value="${si}">${esc(oldT(si))}</option>`).join('');
document.getElementById('ps').onchange=e=>{cur=+e.target.value;renderFr();};
document.getElementById('pv').onclick=()=>{cur=(cur+SP.length-1)%SP.length;renderFr();};
document.getElementById('nx').onclick=()=>{cur=(cur+1)%SP.length;renderFr();};
renderRv();renderTi();renderIs();setTab('fr');
</script>
