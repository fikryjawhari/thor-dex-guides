<title>Trainers Expand Bars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a row of viewer-sized frames (current design far left), each a live copy of the Trainers page top. */
:root{--bg:#f4f5f7;--panel:#fff;--panel2:#eef0f3;--line:#d9dce1;--fg:#1d2126;--mut:#5f6670;--acc:#b7791f;--accfg:#111;
 --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--panel:#1b1e23;--panel2:#23272e;--line:#2e333b;--fg:#e8eaed;--mut:#9aa0a8;--acc:#f0b429;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121417;--panel:#1b1e23;--panel2:#23272e;--line:#2e333b;--fg:#e8eaed;--mut:#9aa0a8;--acc:#f0b429;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
h1{font-size:18px;margin:0 0 4px}
.intro{color:var(--mut);max-width:70ch;margin:0 0 12px}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ctl button{font:inherit;font-size:13px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:100%}
.col h2{font-size:14px;margin:0}.col p{margin:0;color:var(--mut);font-size:12px;max-width:var(--w)}
.frame{width:var(--w);height:var(--h);max-width:100%;overflow-y:auto;overflow-x:hidden;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px 8px;box-sizing:border-box;font-size:15px}
.frame.kb{font-size:13px}
/* guide look (from template/dex.css) */
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.seg button{flex:1;font:inherit;font-weight:700;font-size:14px;background:var(--panel);color:var(--fg);border:0;padding:8px 4px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg.sub button{color:var(--mut);font-weight:600}
details.split{margin:8px 0}
details.split>summary{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:700;list-style:none;display:flex;align-items:center;gap:6px}
details.split>summary::-webkit-details-marker,details.stopd>summary::-webkit-details-marker,details.trd>summary::-webkit-details-marker{display:none}
.sn{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:12px}
.tag{display:inline-block;font-size:11px;background:var(--panel2);color:var(--mut);padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:600}
.tag.capg{background:var(--acc);color:var(--accfg)}
details.stopd{margin:10px 0}
details.stopd>summary{list-style:none;cursor:pointer;border-left:3px solid var(--acc);padding:4px 0 4px 8px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
details.stopd>summary .ar{color:var(--mut);font-size:12px;margin-left:4px}
.stop{border-left:3px solid var(--line);padding:2px 0 2px 8px}
.capl{background:var(--panel2);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--mut);margin:4px 0}
.capl b{color:var(--acc)}
details.trd{border-bottom:1px solid var(--line)}
details.trd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 2px}
details.trd[open]>summary{color:var(--acc)}
.tn{flex:1;min-width:0;font-size:14px}
.sp{display:flex;gap:2px}
.sp i{width:20px;height:20px;border-radius:50%;font-style:normal;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
.card{font-size:12px;color:var(--mut);padding:2px 2px 8px;display:grid;gap:2px}
.card b{color:var(--fg)}
/* design A */
.lab{display:grid;grid-template-columns:auto 1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.lab span{font-size:12px;color:var(--mut);padding:0 8px;display:flex;align-items:center;background:var(--panel2);font-weight:600}
.lab button{font:inherit;font-size:13px;font-weight:600;background:var(--panel);color:var(--fg);border:0;border-left:1px solid var(--line);padding:6px 4px;cursor:pointer}
.lab>*:nth-child(n+4){border-top:1px solid var(--line)}
/* design B */
.depth{display:flex;align-items:center;gap:6px;margin:8px 0;font-size:12px;color:var(--mut)}
.depth .opts{display:flex;flex:1;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.depth button{flex:1;font:inherit;font-size:13px;font-weight:600;background:var(--panel);color:var(--fg);border:0;padding:5px 2px;cursor:pointer}
.depth button+button{border-left:1px solid var(--line)}
.depth button[aria-pressed="true"]{background:var(--acc);color:var(--accfg)}
.ptog{font:inherit;font-size:12px;background:none;border:0;color:var(--acc);cursor:pointer;padding:2px 0;float:right}
/* design C */
.ib{font:inherit;font-size:11px;font-weight:600;background:var(--panel2);color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer;flex:none;white-space:nowrap}
.ib[aria-pressed="true"]{color:var(--acc);border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
</style>

<h1>Trainers page: expand and collapse</h1>
<p class="intro">Sample places and trainers (the real Melemele start, names made up past Hau). Every control works. The cap line now just says "14 battles". Current design on the far left.</p>
<div class="ctl" role="group" aria-label="Viewer size">
 <button id="sz1" data-s="260x316" aria-pressed="true">260 × 316</button>
 <button id="sz2" data-s="538x425" aria-pressed="false">538 × 425 (maximised)</button>
 <button id="kb" aria-pressed="false">dvkb mode</button>
</div>
<div class="row" id="row"></div>

<script>
const BOXES=[
 {n:'Melemele Island',places:[
  {h:'Route 1',cap:[12,'Captain Ilima',"Hau'oli City",14],tr:[
   ['Pokémon Trainer Hau',[['Rowlet','#3b9a4a']],'Rowlet Lv 5 · Tackle, Leafage'],
   ['Youngster Tyler',[['Yungoos','#a57b4a'],['Pikipek','#5a6e8c']],'Yungoos Lv 6 · Tackle, Leer'],
   ['Preschooler Mia',[['Cutiefly','#d8c040']],'Cutiefly Lv 6 · Absorb, Fairy Wind']]},
  {h:'Iki Town Festival',cap:[12,'Captain Ilima',"Hau'oli City",11],tr:[
   ['Pokémon Trainer Hau',[['Pichu','#e3c22e']],'Pichu Lv 6 · Thunder Shock'],
   ['Kahuna Hala',[['Makuhita','#c0844c']],'Makuhita Lv 7 · Fake Out']]},
  {h:"Route 1 (Hau'oli Outskirts)",cap:[12,'Captain Ilima',"Hau'oli City",9],tr:[
   ['Youngster Joey',[['Grubbin','#7a9a3a']],'Grubbin Lv 7 · Bite'],
   ['Lass Ella',[['Wingull','#5a8ccd'],['Bounsweet','#c64b8a']],'Wingull Lv 7 · Water Gun'],
   ['Rising Star Jo',[['Rockruff','#a58a5a']],'Rockruff Lv 8 · Rock Throw']]}]},
 {n:'Akala Island',places:[
  {h:'Heahea City',cap:[28,'Totem Araquanid','Brooklet Hill',25],tr:[
   ['Pokémon Trainer Dexio',[['Mr. Mime','#d06090'],['Espeon','#b07ad0']],'Espeon Lv 21 · Psybeam'],
   ['Ace Trainer Kai',[['Salandit','#7a4a6a']],'Salandit Lv 20 · Ember']]}]}];
const DESIGNS=[
 ['now','Now','Three identical bars: all islands, the island (now opens places too), and each place.'],
 ['a','A · Labelled rows','One bar per island with what it acts on: Places and Trainers, two buttons each. No bar in places.'],
 ['b','B · Show switch','Each island picks how deep to open: Places (closed), Trainers (names), Teams (every card). Places get a small "Open teams" link instead of a bar.'],
 ['c','C · Header buttons','No bars inside islands. Small buttons in the island and place headers: "places" and "teams" toggle open and closed.']];
const st={};
DESIGNS.forEach(([d])=>st[d]={box:{0:1},pl:{},tr:{}});
const K=(b,p,t)=>t==null?b+'.'+p:b+'.'+p+'.'+t;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function topBar(d){return d==='now'?`<div class="seg" data-act="boxes"><button data-a="1">Expand all</button><button data-a="0">Collapse all</button></div>`
 :`<div class="seg" data-act="boxes"><button data-a="1">Open all islands</button><button data-a="0">Close all</button></div>`;}
function depthOf(d,bi){const S=st[d],b=BOXES[bi];const pls=b.places.map((_,pi)=>S.pl[K(bi,pi)]!==0);
 if(!pls.some(Boolean))return 0;const all=b.places.every((p,pi)=>p.tr.every((_,ti)=>S.tr[K(bi,pi,ti)]));return all&&pls.every(Boolean)?2:pls.every(Boolean)&&!b.places.some((p,pi)=>p.tr.some((_,ti)=>S.tr[K(bi,pi,ti)]))?1:-1;}
function anyTeams(d,bi,pi){const S=st[d];return BOXES[bi].places[pi].tr.some((_,ti)=>S.tr[K(bi,pi,ti)]);}
function boxTools(d,bi){
 if(d==='now')return `<div class="seg sub" data-act="box" data-b="${bi}"><button data-a="1">Expand all</button><button data-a="0">Collapse all</button></div>`;
 if(d==='a')return `<div class="lab"><span>Places</span><button data-act="bpl" data-b="${bi}" data-a="1">Expand</button><button data-act="bpl" data-b="${bi}" data-a="0">Collapse</button><span>Trainers</span><button data-act="btr" data-b="${bi}" data-a="1">Expand</button><button data-act="btr" data-b="${bi}" data-a="0">Collapse</button></div>`;
 if(d==='b'){const v=depthOf(d,bi);return `<div class="depth"><span>Show</span><div class="opts" role="group" aria-label="Show">${['Places','Trainers','Teams'].map((x,i)=>`<button data-act="depth" data-b="${bi}" data-a="${i}" aria-pressed="${v===i}">${x}</button>`).join('')}</div></div>`;}
 return '';}
function boxHeadBtns(d,bi){if(d!=='c')return '';const S=st[d],b=BOXES[bi];
 const plo=b.places.some((_,pi)=>S.pl[K(bi,pi)]!==0),tro=b.places.some((_,pi)=>anyTeams(d,bi,pi));
 return `<button class="ib" data-act="cpl" data-b="${bi}" aria-pressed="${plo}">places</button><button class="ib" data-act="ctr" data-b="${bi}" aria-pressed="${tro}">teams</button>`;}
function place(d,bi,pi){const S=st[d],p=BOXES[bi].places[pi],k=K(bi,pi),open=S.pl[k]!==0,c=p.cap;
 const tro=anyTeams(d,bi,pi);
 const head=`<summary><span>${esc(p.h)}</span><span class="tag">${p.tr.length}</span><span class="tag capg">cap ${c[0]}</span><span class="ar">${open?'▾':'▸'}</span>${d==='c'?`<span style="flex:1"></span><button class="ib" data-act="ptr" data-b="${bi}" data-p="${pi}" aria-pressed="${tro}">teams</button>`:''}</summary>`;
 const capl=`<div class="capl">Level cap <b>${c[0]}</b> · ${esc(c[1])}, ${esc(c[2])} · ${c[3]} battles</div>`;
 const bar=d==='now'&&p.tr.length>1?`<div class="seg sub" data-act="pl" data-b="${bi}" data-p="${pi}"><button data-a="1">Expand all</button><button data-a="0">Collapse all</button></div>`:'';
 const lnk=d==='b'&&p.tr.length>1?`<button class="ptog" data-act="ptr" data-b="${bi}" data-p="${pi}">${tro?'Close teams':'Open teams'}</button>`:'';
 const rows=p.tr.map((t,ti)=>{const tk=K(bi,pi,ti);return `<details class="trd" data-k="${tk}" ${S.tr[tk]?'open':''}><summary><span class="tn">${esc(t[0])}</span><span class="sp">${t[1].map(m=>`<i style="background:${m[1]}" title="${m[0]}">${m[0][0]}</i>`).join('')}</span></summary><div class="card"><b>${esc(t[2])}</b><span>Nature, ability, item, moves…</span></div></details>`;}).join('');
 return `<details class="stopd" data-k="${k}" ${open?'open':''}>${head}<div class="stop">${capl}${lnk}${bar}${rows}</div></details>`;}
function render(d){const S=st[d];
 return topBar(d)+BOXES.map((b,bi)=>{const n=b.places.reduce((a,p)=>a+p.tr.length,0);
  return `<details class="split" data-b="${bi}" ${S.box[bi]?'open':''}><summary><span class="sn">${esc(b.n)} <span class="mut small">${n} trainers</span></span>${boxHeadBtns(d,bi)}</summary>${boxTools(d,bi)}${b.places.map((_,pi)=>place(d,bi,pi)).join('')}</details>`;}).join('');}
function setPl(d,bi,v){BOXES[bi].places.forEach((_,pi)=>st[d].pl[K(bi,pi)]=v?1:0);}
function setTr(d,bi,pi,v){BOXES[bi].places[pi].tr.forEach((_,ti)=>st[d].tr[K(bi,pi,ti)]=v?1:0);}
function act(d,el,fr){const a=+el.dataset.a,bi=+el.dataset.b,pi=+el.dataset.p,S=st[d],kind=el.dataset.act||el.parentNode.dataset.act;
 const ctx=el.closest('[data-act]')||el;const k2=ctx.dataset.act,b2=+ctx.dataset.b,p2=+ctx.dataset.p;
 const y=el.getBoundingClientRect().top;
 switch(kind){
  case 'boxes':BOXES.forEach((_,i)=>S.box[i]=a);break;
  case 'box':setPl(d,b2,a);break;
  case 'pl':setTr(d,b2,p2,a);break;
  case 'bpl':setPl(d,bi,a);break;
  case 'btr':BOXES[bi].places.forEach((_,i)=>setTr(d,bi,i,a));if(a)setPl(d,bi,1);break;
  case 'depth':setPl(d,bi,a>0);BOXES[bi].places.forEach((_,i)=>setTr(d,bi,i,a===2));break;
  case 'cpl':{const o=BOXES[bi].places.some((_,i)=>S.pl[K(bi,i)]!==0);setPl(d,bi,!o);break;}
  case 'ctr':{const o=BOXES[bi].places.some((_,i)=>anyTeams(d,bi,i));BOXES[bi].places.forEach((_,i)=>setTr(d,bi,i,!o));if(!o)setPl(d,bi,1);break;}
  case 'ptr':{const o=anyTeams(d,bi,pi);setTr(d,bi,pi,!o);S.pl[K(bi,pi)]=1;break;}}
 draw(d);
 const same=fr.querySelector(`[data-act="${el.dataset.act||''}"][data-b="${isNaN(bi)?'':bi}"]`);
 fr.scrollTop+=0;}
const row=document.getElementById('row');
row.innerHTML=DESIGNS.map(([d,t,p])=>`<div class="col"><h2>${t}</h2><p>${p}</p><div class="frame" id="f-${d}"></div></div>`).join('');
function draw(d){const fr=document.getElementById('f-'+d),top=fr.scrollTop;fr.innerHTML=render(d);fr.scrollTop=top;}
DESIGNS.forEach(([d])=>{const fr=document.getElementById('f-'+d);draw(d);
 fr.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!fr.contains(b))return;e.preventDefault();e.stopPropagation();act(d,b,fr);});
 fr.addEventListener('toggle',e=>{const el=e.target,S=st[d];
  if(el.matches('details.split'))S.box[el.dataset.b]=el.open?1:0;
  else if(el.matches('details.stopd'))S.pl[el.dataset.k]=el.open?1:0;
  else if(el.matches('details.trd'))S.tr[el.dataset.k]=el.open?1:0;else return;
  if(d==='b'||d==='c'||el.matches('details.stopd'))requestAnimationFrame(()=>draw(d));},true);});
function size(s){const [w,h]=s.split('x');document.documentElement.style.setProperty('--w',w+'px');document.documentElement.style.setProperty('--h',h+'px');}
size('260x316');
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x===b));size(b.dataset.s);});
document.getElementById('kb').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('kb',on));};
</script>
