<title>Photonic Sun Locations Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a control strip, then the designs side by side as real guide frames at the viewer's size (current on the left). */
:root{--bg:#f3f1ec;--panel:#fffdf8;--fg:#24211c;--mut:#6c665b;--line:#ddd6c8;--acc:#b07a10;--accbg:#f6e7c4;
 --body:'Atkinson Hyperlegible',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--panel:#211e17;--fg:#ece6d8;--mut:#a59d8c;--line:#3a352a;--acc:#e5b04a;--accbg:#3a2f15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17150f;--panel:#211e17;--fg:#ece6d8;--mut:#a59d8c;--line:#3a352a;--acc:#e5b04a;--accbg:#3a2f15;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--mut);margin:0 0 14px;max-width:70ch}
.tabs,.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{margin-bottom:10px}
.tabs button{font:600 14px var(--body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#1b1608}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:14px}
.ctl label{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:flex;gap:6px;align-items:center}
.ctl select{font:14px var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:60vw}
.ctl button{font:600 13px var(--body);background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:4px 10px;cursor:pointer}
.row{display:flex;gap:18px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.fr{flex:none;display:flex;flex-direction:column;gap:6px}
.fr h2{font:700 14px var(--body);margin:0;display:flex;gap:8px;align-items:baseline}
.fr h2 span{font:500 11px var(--mono);color:var(--acc);letter-spacing:.06em}
.fr p{margin:0;font-size:13px;color:var(--mut);line-height:1.4}
.fr iframe{border:1px solid var(--line);border-radius:4px;background:#000;display:block}
.fr.cur iframe{border-color:var(--mut);border-style:dashed}
.notes{max-width:75ch;margin-top:14px;font-size:14px}
.notes h3{font-size:15px;margin:18px 0 6px}
.notes li{margin:3px 0}
.tw{overflow-x:auto}
table.f{border-collapse:collapse;font-size:13px;margin:6px 0}
table.f th,table.f td{border-bottom:1px solid var(--line);padding:4px 10px 4px 0;text-align:left;vertical-align:top}
table.f td.n{font-variant-numeric:tabular-nums;text-align:right}
code{font:12px var(--mono);background:var(--accbg);padding:1px 4px;border-radius:4px}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

<h1>Photonic Sun: Locations, round 1</h1>
<p class="lede">Each frame is the real guide (this branch's build) at the viewer's size. The left frame is the guide as it is now; the others patch only what they say. Tap around inside any frame. Tracker and open boxes are shared between frames.</p>
<div class="tabs" role="group" aria-label="Page">
 <button data-p="loc" aria-pressed="true">Locations</button><button data-p="mv" aria-pressed="false">Move page width</button><button data-p="ab" aria-pressed="false">Ability page width</button><button data-p="find" aria-pressed="false">Findings</button>
</div>
<div class="ctl" id="ctl">
 <label for="sz">Window <select id="sz"><option value="260x316">260 × 316 (minimum)</option><option value="260x394">260 × 394 (your usual)</option><option value="480x392">480 × 392 (default)</option><option value="537x424">537 × 424 (maximised)</option></select></label>
 <label for="area" id="areaL">Area <select id="area"></select></label>
 <label for="map" id="mapL">Map <select id="map"><option value="img">Doc picture</option><option value="words">Words (Route 1 only)</option><option value="none">None</option></select></label>
 <button id="reload" type="button">Reload frames</button>
</div>
<div class="row" id="row"></div>
<div class="notes" id="notes"></div>

<script>
const MK={guide:/*GUIDE*/"",lt:/*LT*/{},maps:/*MAPS*/{},css:/*CSS*/"",areas:/*AREAS*/[],page:'loc',map:'img',
 words:{'Route 1':{'Grass 1':'On the doc map: the three patches along the east side.','Grass 2':'On the doc map: the patch in the middle-west.','Grass 3':'On the doc map: the far west patch and the one south of the path.'}}};
window.MK=MK;
const D={
 loc:{route:()=>'#/l/'+document.getElementById('area').value,frames:[
  ['cur','Now','Current build: one section per method, day and night apart.'],
  ['A','A','One section per game table; day/night in one row. SOS allies in a drop-down under each caller.'],
  ['B','B','Same sections. SOS allies in their own section at the end; each ally drops down to who calls it.'],
  ['C','C','Same sections. Callers show a plain "SOS →" line, and the SOS section lists allies with their callers. No drop-downs.']],
  notes:`<h3>What every new design changes</h3><ul>
  <li><b>Starter</b> replaces Iki Town: the box holds the starter picker, and picking there or in the tracker bar records the encounter.</li>
  <li><b>One section per game table</b> (a grass patch, cave, building), named from the doc, levels in the header. Copies of a table in other patches merge; a species only some patches have says so (Route 1 Grass 3: Scatterbug at night).</li>
  <li><b>Day and night share a row.</b> A plain rate is the same all day; a <b>sun</b> or <b>moon</b> rate only applies then, and two lines mean it changes.</li>
  <li><b>Water</b> holds Fishing and Surfing; the bubbling spot is a second rate with the bubble icon. Brooklet Hill keeps its Trial Site and Totem's Den water apart.</li>
  <li><b>Other</b> collects berry piles, ambush encounters, dust clouds, shadows and splashes, each under its own label. <b>Special</b> keeps Island Scan, gifts, trades and statics.</li>
  <li>Rows are by rate, highest first. No section has more than 12 rows (Route 1 water and Brooklet Hill), so no alphabetical sort yet.</li>
  <li><b>Map:</b> the doc has numbered maps for 7 areas (Route 1, Hau'oli City, Routes 2, 3, 5, 6, Mount Hokulani). "Doc picture" shows its map in a closed drop-down; "Words" writes where each patch is instead (only Route 1 is written for this mockup). The pictures are the hack author's, so shipping them means committing small crops of the doc to this public repo, with credit.</li></ul>
  <h3>To try</h3><ul><li>Route 1, Hau'oli City (Mime Jr., Tyrogue's three Hitmon allies), Route 2, Brooklet Hill, Lush Jungle (weather allies), Haina Desert (Claydol and Golurk answer anyone), Vast Poni Canyon.</li>
  <li>Mark a Pokémon as caught in the tracker: its family greys out and the other rates rescale, separately for day, night and bubbling.</li></ul>`},
 mv:{route:()=>'#/m/'+MK.mvId,frames:[
  ['cur','Now','"Never misses" can\'t wrap: 277 px wide at 260 (242 move pages).'],
  ['A','A','Let that table wrap: "Never misses" goes onto two lines.'],
  ['B','B','Shorter text: "Sure hit".'],
  ['C','C','Four small stat boxes that wrap two by two when narrow.']],
  notes:`<p>The four-column table has no room for "Never misses" at 260. Any of these fixes it on every guide; A changes the least.</p>`},
 ab:{route:()=>'#/a/'+MK.abId,frames:[
  ['cur','Now','"Crabominable" and its "evo/breed" tag can\'t break apart: 267 px (Iron Fist, Anger Point).'],
  ['A','A','Shorter third column: "HA" for a hidden ability.'],
  ['B','B','No third column: "Hidden ability" becomes a tag after the name.']],
  notes:`<p>The tag is written straight after the name with no space, so it can't wrap under it. Adding the space alone isn't enough: "Crabominable" plus the "Hidden" column is still 267 px. The fix is to make the third column narrower (A) or drop it (B). The space goes in either way, so tags can wrap in other lists too.</p>`},
};
const $=s=>document.querySelector(s);
const areaSel=$('#area');
MK.areas.forEach(([li,n])=>areaSel.insertAdjacentHTML('beforeend',`<option value="${li}">${n}</option>`));
areaSel.value=MK.areas.find(a=>a[1]==='Route 1')[0];
function build(){const p=MK.page,row=$('#row');
 $('#ctl').hidden=p==='find';$('#areaL').hidden=$('#mapL').hidden=p!=='loc';
 if(p==='find'){row.innerHTML='';$('#notes').innerHTML=document.getElementById('findings').innerHTML;return;}
 const [w,h]=$('#sz').value.split('x').map(Number);const d=D[p];
 row.innerHTML=d.frames.map(([k,t,desc])=>`<div class="fr ${k==='cur'?'cur':''}" style="width:${w}px"><h2><span>${t}</span>${k==='cur'?'Current':'Design '+t}</h2><p>${desc}</p><iframe title="${k==='cur'?'Current guide':'Design '+t}" width="${w}" height="${h}" data-d="${k}" data-r="${d.route()}"></iframe></div>`).join('');
 row.querySelectorAll('iframe').forEach(f=>f.srcdoc=MK.guide);
 $('#notes').innerHTML=d.notes;}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));MK.page=b.dataset.p;build();});
$('#sz').onchange=build;$('#reload').onclick=build;
$('#map').onchange=e=>{MK.map=e.target.value;build();};
areaSel.onchange=()=>document.querySelectorAll('#row iframe').forEach(f=>{f.dataset.r=D.loc.route();try{f.contentWindow.location.hash=f.dataset.r.slice(1);}catch(e){}});
build();
</script>
<template id="findings">/*FINDINGS*/</template>
