<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Calc retest mockup</title>
<style>
:root{--bg:#111517;--panel:#1c2025;--panel2:#242930;--line:#303740;--fg:#e6edf4;--mut:#9aa8b6;--acc:#ffc31c;--red:#ff7b6b;--green:#73d3a1;--g:4px;font:12px system-ui;color:var(--fg);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:5px;min-width:0}button{cursor:pointer;touch-action:manipulation;padding:2px 4px}button[aria-pressed=true]{color:var(--acc);border-color:var(--acc);background:#584818}input{width:100%;padding:3px}select{width:100%;padding:2px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc)}small,.mut{color:var(--mut)}.loss{color:var(--red)!important}.gain{color:var(--green)!important}.berry{color:var(--fg)}
#rail{position:fixed;left:0;top:0;bottom:0;width:44px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;background:#191d21;padding-top:4px}#rail span{display:grid;place-items:center;width:40px;height:31px;font-size:21px;color:var(--mut)}#rail .on{color:var(--acc);background:#3a3318;border-left:3px solid var(--acc)}main{margin-left:44px;padding:3px 4px 12px;display:grid;gap:4px;min-width:0}.top,.match{display:grid;gap:4px;min-width:0}.box,.trainer,.cc,.move,.field,.fight{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:3px;min-width:0}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-bottom:3px}.tools button{font-size:10px;min-height:26px}.sprite-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.sprite-grid button{height:29px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-size:8px;line-height:8px}.sprite{display:block;width:22px;height:20px;background-position:center;background-repeat:no-repeat;background-size:contain;image-rendering:pixelated}.trainerbar{display:flex;gap:3px;align-items:center;margin-bottom:3px;font-size:11px}.trainerbar b{flex:1}.trainerbar button{height:25px;width:24px;font-size:17px}.trainerbar input{width:29px;height:25px;text-align:center}.trainer-stack{display:grid;gap:4px;min-width:0}.fight{display:grid;grid-template-columns:1fr 1fr 1fr 24px;gap:3px;padding:4px}.fight button,.fight select{font-size:10px;height:27px;padding:0 2px}.fight .format{font-size:9px}.fighter{display:contents}.cc{padding:2px 4px}.cc.active{border-color:var(--acc)}.l1{display:flex;align-items:center;gap:3px;min-height:20px}.l1 b{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l1 small{font-size:9px;white-space:nowrap}.l1 button{font-size:9px;padding:0 3px;height:17px}.hp-line{display:flex;align-items:center;gap:2px;white-space:nowrap;min-height:25px;font-size:9px;font-variant-numeric:tabular-nums}.hp-line input{appearance:textfield;text-align:center;height:23px;padding:0;font-size:11px}.hp-line input::-webkit-inner-spin-button{appearance:none}.level{max-width:24px}.hp{max-width:30px}.hp-line button{height:23px;font-size:10px;padding:0 3px;flex:none}.hp-line .reset-hp{padding:0 2px;font-size:13px}.hp-line .max{font-size:10px}.hp-line .end{margin-left:auto;display:flex;gap:2px;align-items:center}.hp-line .toxic{max-width:16px;font-size:9px}.hpbar{height:2px;background:#333b45;border-radius:2px;overflow:hidden}.hpbar span{display:block;height:100%;background:var(--green)}.edit{border-top:1px solid var(--line);padding-top:4px;margin-top:3px}.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.edit label{font-size:9px;color:var(--mut);min-width:0}.edit label>*{display:block;height:29px;margin-top:2px;font-size:11px;color:var(--fg)}.edit .wide{grid-column:1/-1}.combo{width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.parts{display:flex;gap:4px;margin-top:5px}.parts button{flex:1;font-size:10px;min-height:28px}.stat-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;margin-top:5px;font-size:9px;text-align:center}.stat-grid button{height:25px}.moves{display:grid;gap:3px;min-width:0}.move{padding:2px 5px;border-radius:8px}.r1,.r2{display:flex;align-items:center;gap:3px;min-width:0}.r1 .move-name{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:19px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9c9b7d;margin-right:4px}.damage{display:flex;gap:1px;align-items:center;white-space:nowrap}.damage button{font-size:12px;font-weight:700;padding:0 3px;min-height:21px;color:var(--acc)}.r2{font-size:9px;color:var(--mut);justify-content:space-between;min-height:14px}.chip{font-weight:700;font-size:9px}.crit{width:22px;font-size:9px;min-height:22px;margin-left:1px}.move-toggle{font-size:10px;min-height:24px;min-width:30px}.move-details{border-top:1px solid var(--line);padding:4px 0 2px;margin-top:3px;font-size:10px;color:var(--mut)}.move-details .controls{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px}.controls select{height:28px;font-size:11px}.rolls{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;margin:4px 0}.rolls button{font-size:10px;padding:0;min-height:25px}.custom{display:flex;gap:4px;align-items:center}.custom input{width:46px;height:28px}.custom button{height:28px}.move .hits{width:41px;font-size:10px;height:23px}.field{padding:0}.field>summary{padding:7px;font-weight:700;cursor:pointer}.field-body{padding:0 5px 6px}.field-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.field-grid button{min-height:35px;font-size:10px;overflow-wrap:anywhere}.side-tabs{display:flex;gap:4px;margin:5px 0}.side-tabs button{flex:1;min-height:28px}.state-row{min-height:26px;display:flex;align-items:center;gap:4px;font-size:10px}.state-row select{width:auto;flex:1}.note{font-size:10px;color:var(--mut);padding:4px 0}.field-body>.global-grid{margin-bottom:5px}#log{position:fixed;z-index:40;left:48px;right:4px;bottom:4px;padding:6px;border:1px solid var(--acc);background:var(--panel);border-radius:7px;font-size:10px;pointer-events:none;box-shadow:0 2px 8px #0009}#log:empty{display:none}
#picker{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}#picker[hidden]{display:none}.picker-head{display:flex;align-items:center;gap:4px;padding:4px}.picker-head button{min-height:33px}.picker-head input{height:33px;flex:1;font-size:14px}.picker-title{padding:0 6px 4px;font-size:11px;color:var(--mut)}#suggestions{flex:1;min-height:0;overflow:auto;padding:0 5px}#suggestions button{display:block;width:100%;text-align:left;min-height:34px;margin-bottom:3px}#keys{flex:none;border-top:1px solid var(--line);padding:3px;background:var(--panel)}.key-row{display:flex;gap:2px;margin:2px 0}.key-row button{flex:1;min-width:0;padding:0;min-height:29px;font-size:12px}.key-row .done{flex:2;color:var(--acc)}.edit-pair{display:flex;gap:2px}.edit-pair button:first-child{flex:1}.edit-pair button{height:29px}.dvkb input{cursor:pointer}.field summary small{font-weight:400}
.cc{order:0}.moves{order:1}
@media(min-width:480px){.top,.match{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.fighter{display:flex;flex-direction:column;gap:4px;min-width:0}.box{grid-column:1}.trainer-stack{grid-column:2}.fight{margin-top:3px;grid-template-columns:1fr 1fr 25px}.fight .format{grid-column:1/3}.fight .reset-fight{grid-column:3;grid-row:1/3;height:57px}.field{grid-column:1/-1}}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--panel:#fff;--panel2:#edf0f4;--line:#c8ced7;--fg:#202a35;--mut:#586675;--acc:#987000;--red:#b63528;--green:#187b47}#rail{background:#e9edf1}button[aria-pressed=true]{background:#fff1bc}.hpbar{background:#d2d9df}}
</style></head><body>
<nav id="rail" aria-label="Guide sections"><span>⌕</span><span>⊙</span><span>♧</span><span>♙</span><span>♧</span><span>▣</span><span class="on">▦</span><span>↑</span><span>↓</span></nav>
<main><div class="top"><section class="box"><div class="tools"><button>↻ Import</button><button>+ New</button><button>⌕ Find</button></div><div class="sprite-grid" id="box"></div></section><div class="trainer-stack"><section class="trainer"><div class="trainerbar"><button aria-label="Previous trainer">‹</button><b>Candice</b><button aria-label="Next trainer">›</button><small>Cap</small><input type="number" value="50" aria-label="Level cap"></div><div class="sprite-grid" id="team"></div></section><div class="fight" id="fight"></div></div></div><div class="match" id="match"></div><details class="field" id="field"><summary>Field ▸ <small id="field-summary"></small></summary><div class="field-body" id="field-body"></div></details></main>
<div id="log" role="status" aria-live="polite"></div><section id="picker" hidden aria-label="Edit value"><div class="picker-head"><button id="picker-back" aria-label="Back">‹</button><input id="query" autocomplete="off"><button id="picker-clear" aria-label="Clear">×</button></div><div class="picker-title" id="picker-title"></div><div id="suggestions" role="listbox"></div><div id="keys"></div></section>
<script>
const DATA=/*DATA*/{};
const INV=localStorage.getItem('dvkb')==='1';document.body.classList.toggle('dvkb',INV);
const $=selector=>document.querySelector(selector),esc=value=>String(value).replace(/[&<>"']/g,letter=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[letter]));
let field={},fieldSide='atk',picker=null,logTimer;
let mons=[];
const MOVES=[{n:'Take Down',min:73,max:86,recoil:.25,helmet:true},{n:'Drain Punch',min:50,max:60,drain:.5},{n:'Bullet Seed',min:12,max:16,hits:3},{n:'Trick Room',key:'trickRoom',scope:'global'},{n:'Reflect',key:'Reflect',scope:'self'},{n:'Stealth Rock',key:'StealthRock',scope:'opponent'},{n:'Spikes',key:'Spikes',scope:'opponent',max:3},{n:'Toxic Spikes',key:'ToxicSpikes',scope:'opponent',max:2},{n:'Sticky Web',key:'StickyWeb',scope:'opponent'},{n:'Rain Dance',key:'weather',value:'Rain',scope:'global'},{n:'Grassy Terrain',key:'terrain',value:'Grassy',scope:'global'},{n:'Dig',key:'vol',value:'dig',scope:'self'},{n:'Light Screen',key:'LightScreen',scope:'self'},{n:'Aurora Veil',key:'AuroraVeil',scope:'self'},{n:'Tailwind',key:'Tailwind',scope:'self'},{n:'Gravity',key:'gravity',scope:'global'},{n:'Wonder Room',key:'wonderRoom',scope:'global'},{n:'Magic Room',key:'magicRoom',scope:'global'},{n:'Fly',key:'vol',value:'fly',scope:'self'},{n:'Dive',key:'vol',value:'dive',scope:'self'},{n:'Minimize',key:'vol',value:'min',scope:'self'}];
const natures=['Hardy','Lonely','Brave','Adamant','Naughty','Bold','Docile','Relaxed','Impish','Lax','Timid','Hasty','Serious','Jolly','Naive','Modest','Mild','Quiet','Bashful','Rash','Calm','Gentle','Sassy','Careful','Quirky'];
function resetFight(){field={gameType:'Singles',weather:'Snow',terrain:''};mons=[{species:0,hp:158,max:235,lv:50,status:'tox',toxic:1,berry:true,edit:false,item:'Sitrus Berry',ability:'Sand Veil',nature:'Jolly',vol:'',open:-1,hit:3},{species:1,hp:180,max:235,lv:50,status:'',toxic:1,berry:false,edit:false,item:'Rocky Helmet',ability:'Snow Warning',nature:'Rash',vol:'',open:-1,hit:3}];render();}
function say(text){$('#log').textContent=text;clearTimeout(logTimer);logTimer=setTimeout(()=>$('#log').textContent='',4200);}
function options(choices,value){return choices.map(choice=>{const pair=Array.isArray(choice)?choice:[choice,choice];return `<option value="${esc(pair[0])}" ${String(pair[0])===String(value)?'selected':''}>${esc(pair[1])}</option>`}).join('');}
function spriteGrid(target,offset,count){$(target).innerHTML=Array.from({length:count},(_,index)=>{const position=(index+offset)%DATA.species.length,species=DATA.species[position];return `<button data-pick="${position}" data-side="${target==='#box'?0:1}" aria-label="${esc(species.n)}" aria-pressed="${mons[target==='#box'?0:1].species===position}"><span class="sprite" style="background-image:url('${species.sprite}')"></span><span>50</span></button>`}).join('');}
function numeric(side,key,value,cls,label){return `<input class="${cls}" type="number" min="0" value="${value}" data-side="${side}" data-num="${key}" aria-label="${label}" ${INV?'readonly':''}>`;}
function card(side){const mon=mons[side],species=DATA.species[mon.species];return `<section class="cc ${side===0?'active':''}" id="card-${side}"><div class="l1"><b>${esc(species.n)}</b><button data-mega="${side}" aria-pressed="${!!mon.mega}">M</button><button data-edit="${side}">Edit ${mon.edit?'▴':'▾'}</button><small>Spe <strong>${side?79:84}</strong></small></div><div class="hp-line"><span>Lv</span>${numeric(side,'lv',mon.lv,'level','Level')}<button class="reset-hp" data-reset="${side}" aria-label="Reset HP" title="Reset HP">↻</button>${numeric(side,'hp',mon.hp,'hp','HP')}<span class="max">/${mon.max}</span><span class="end">${mon.status==='tox'?`<span>T</span>${numeric(side,'toxic',mon.toxic,'toxic','Toxic counter')}`:''}<button class="${side?'gain':'loss'}" data-residual="${side}" title="Apply turn-end total">${side?14:Math.max(1,Math.floor(mon.max/16))*mon.toxic-14}</button>${mon.berry?`<button class="berry" data-berry="${side}" title="Apply ready berry">+60</button>`:''}</span></div><div class="hpbar"><span style="width:${100*mon.hp/mon.max}%"></span></div>${mon.edit?edit(side):''}</section>`;}
function combo(side,key,label){return `<label>${label}<button class="combo" data-combo="${key}" data-side="${side}">${esc(mons[side][key])} ⌕</button></label>`;}
function edit(side){const mon=mons[side],abilities=DATA.species[mon.species].abilities;return `<div class="edit"><div class="edit-grid">${combo(side,'nature','Nature')}<label>Ability${mon.other?`<span class="edit-pair"><button class="combo" data-combo="ability" data-side="${side}">${esc(mon.ability)} ⌕</button><button data-other-clear="${side}" aria-label="Use species abilities">×</button></span>`:`<select data-ability="${side}" aria-label="Ability">${options([...abilities,'Other…'],mon.ability)}</select>`}</label>${combo(side,'item','Item')}<label>Status<select data-status="${side}" aria-label="Status">${options(DATA.status,mon.status)}</select></label><label class="wide">Battle state<select data-vol="${side}" aria-label="Battle state">${options([['','No battle state'],['dig','Dig'],['fly','Fly / Bounce'],['dive','Dive'],['min','Minimized'],['switch','Switching out']],mon.vol)}</select></label></div><div class="parts"><button class="gain" data-part="14" data-side="${side}">Leftovers +14</button>${mon.status==='tox'?`<button class="loss" data-part="${-Math.floor(mon.max/16)*mon.toxic}" data-side="${side}">Toxic ${Math.floor(mon.max/16)*mon.toxic}</button>`:''}</div><div class="stat-grid">${['HP','Atk','Def','SpA','SpD','Spe'].map(label=>`<span>${label}<button data-stage="${side}" aria-label="${label} stage">0</button></span>`).join('')}</div></div>`;}
function moveKey(move,side){return move.scope==='global'?move.key:(move.scope==='opponent'?(side?'atk':'def'):(side?'def':'atk'))+move.key;}
function moveValue(move,side){return move.key==='vol'?mons[side].vol:field[moveKey(move,side)];}
function enabled(move,side){return move.value?moveValue(move,side)===move.value:!!moveValue(move,side);}
function totals(move,side){const hits=move.hits?mons[side].hit:1;return [move.min*hits,move.max*hits];}
function moves(side){return MOVES.map((move,index)=>{const open=mons[side].open===index;if(!move.min){const exists=move.key==='vol'||DATA.field.some(entry=>entry.k===moveKey(move,side));if(!exists)return '';return `<div class="move status"><div class="r1"><button class="move-name" data-toggle-move="${index}" data-side="${side}"><span class="dot" style="background:#9173c0"></span>${move.n}</button><button class="move-toggle" data-toggle-move="${index}" data-side="${side}" aria-label="${move.n}" aria-pressed="${enabled(move,side)}">${move.max?(moveValue(move,side)||0):enabled(move,side)?'On':'Off'}</button></div></div>`;}const [minimum,maximum]=totals(move,side);const rollList=Array.from({length:16},(_,roll)=>Math.floor(minimum+(maximum-minimum)*roll/15));return `<article class="move" id="move-${side}-${index}"><div class="r1"><button class="move-name" data-open="${index}" data-side="${side}"><span class="dot" style="background:${index===1?'#bb7554':index===2?'#72a34c':'#9c9b7d'}"></span>${move.n}</button><span class="damage"><button data-damage="${minimum}" data-side="${side}" data-move="${index}" aria-label="Apply ${minimum} damage">${minimum}</button><span>–</span><button data-damage="${maximum}" data-side="${side}" data-move="${index}" aria-label="Apply ${maximum} damage">${maximum}</button></span><button class="crit" data-crit="${side}-${index}" aria-pressed="false">C</button></div><div class="r2"><span>${move.recoil?`<span class="chip loss" title="Recoil, automatically applied">${Math.floor(minimum*move.recoil)}–${Math.floor(maximum*move.recoil)}</span> · `:''}${move.drain?`<span class="chip gain" title="Drain, automatically applied">${Math.floor(minimum*move.drain)}–${Math.floor(maximum*move.drain)}</span> · `:''}${Math.round(minimum/2.35)}–${Math.round(maximum/2.35)}%</span>${move.hits?`<select class="hits" data-hits="${side}" aria-label="Hit count">${options([2,3,4,5].map(value=>[value,value+'×']),mons[side].hit)}</select>`:'<span>2HKO</span>'}</div>${open?`<div class="move-details"><div class="controls"><span>Type<select aria-label="Move type">${options(['Normal','Fighting','Grass'],index===1?'Fighting':index===2?'Grass':'Normal')}</select></span><span>Power<input type="number" aria-label="Power" value="${index===2?25:90}" ${INV?'readonly':''}></span></div><div>Physical · vs ${mons[1-side].hp}/${mons[1-side].max} HP</div><div class="rolls">${rollList.map(roll=>`<button data-roll="${roll}" data-side="${side}" data-move="${index}">${roll}</button>`).join('')}</div><div class="custom"><label for="amount-${side}-${index}">Damage</label><input type="number" min="0" value="${minimum}" id="amount-${side}-${index}" aria-label="Custom damage" ${INV?'readonly':''}><button data-apply="${index}" data-side="${side}">Apply</button></div></div>`:''}</article>`;}).join('');}
function renderFight(){const selects=['weather','terrain'].map(key=>{const entry=DATA.field.find(item=>item.k===key);return `<select data-fight="${key}" aria-label="${entry.l}">${options([['','No '+key],...entry.o.filter(pair=>pair[0])],field[key])}</select>`;});$('#fight').innerHTML=`<button class="format" data-format aria-label="Battle format">${field.gameType} ▾</button>${selects.join('')}<button class="reset-fight" data-reset-fight aria-label="Reset fight" title="Reset fight">↻</button>`;}
function fieldToggle(entry){return `<button data-field="${entry.k}" aria-pressed="${!!field[entry.k]}" title="${esc(entry.l)}">${esc(entry.l.replace(/^(Attacker|Defender|Player|Foe) /,''))}${entry.max?' '+(field[entry.k]||0):''}</button>`;}
function renderField(){const entries=DATA.field.filter(entry=>entry.type!=='select'&&(!entry.doubles||field.gameType==='Doubles'));$('#field-summary').textContent=[field.weather,field.terrain].filter(Boolean).join(' · ');$('#field-body').innerHTML=`<div class="field-grid global-grid">${entries.filter(entry=>entry.side==='field').map(fieldToggle).join('')}</div><div class="side-tabs">${['atk','def'].map((side,index)=>`<button data-field-side="${side}" aria-pressed="${fieldSide===side}">${index?'Foe':'Player'}</button>`).join('')}</div><div class="field-grid">${entries.filter(entry=>entry.side===fieldSide).map(fieldToggle).join('')}</div><div class="note">${fieldSide==='atk'?'Player':'Foe'} entry hazards</div><button data-hazards="${fieldSide==='atk'?0:1}">Apply hazards</button>`;}
function render(){spriteGrid('#box',0,18);spriteGrid('#team',1,6);renderFight();$('#match').innerHTML=[0,1].map(side=>`<div class="fighter" data-fighter="${side}">${card(side)}<div class="moves" id="moves-${side}">${moves(side)}</div></div>`).join('');renderField();if(INV)document.querySelectorAll('input:not(#query)').forEach(input=>input.readOnly=true);}
function changeHP(side,delta){mons[side].hp=Math.max(0,Math.min(mons[side].max,mons[side].hp+delta));}
function applyDamage(side,amount,index){amount=Math.max(0,Math.floor(Number(amount)||0));const move=MOVES[index],target=1-side,actual=Math.min(amount,mons[target].hp),events=[`${DATA.species[mons[target].species].n} ${mons[target].hp} → ${Math.max(0,mons[target].hp-amount)}`];changeHP(target,-amount);if(move.recoil){const recoil=Math.floor(actual*move.recoil);changeHP(side,-recoil);events.push('recoil '+recoil);}if(move.helmet&&mons[target].item==='Rocky Helmet'){changeHP(side,-39);events.push('Helmet 39');}if(move.drain){const drain=Math.floor(actual*move.drain);changeHP(side,drain);events.push('drain '+drain);}if(mons[side].item==='Life Orb'){changeHP(side,-23);events.push('Life Orb 23');}if(mons[target].berry&&mons[target].hp>0&&mons[target].hp<=mons[target].max/2){changeHP(target,60);mons[target].berry=false;events.push('berry +60');}render();say(events.join(' · '));}
function toggleMove(index,side){const move=MOVES[index];if(move.key==='vol')mons[side].vol=enabled(move,side)?'':move.value;else{const key=moveKey(move,side);field[key]=move.value?(enabled(move,side)?'':move.value):move.max?((field[key]||0)+1)%(move.max+1):!field[key];}render();}
function openPicker({label,choices=[],value='',apply,numeric=false}){picker={label,choices,value:String(value),apply,numeric};$('#picker').hidden=false;$('#query').value=picker.value;$('#query').readOnly=INV;$('#query').setAttribute('aria-label',label);$('#picker-title').textContent=label;paintPicker();if(!INV)$('#query').focus();}
function paintPicker(){const query=$('#query').value.toLowerCase(),matches=picker.choices.filter(value=>value.toLowerCase().includes(query));$('#suggestions').innerHTML=picker.numeric?'<p class="note">Enter an exact value, then Done.</p>':matches.slice(0,45).map(value=>`<button role="option" data-choice="${esc(value)}">${esc(value)}</button>`).join('')+(matches.length>45?'<p class="note">Keep typing to narrow results</p>':'')+(!matches.length?'<p class="note">No matches</p>':'');const rows=picker.numeric?['1234567890']:['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];$('#keys').innerHTML=(INV?rows.map(row=>`<div class="key-row">${[...row].map(letter=>`<button data-key="${letter}">${letter}</button>`).join('')}</div>`).join(''):'')+`<div class="key-row">${INV&&!picker.numeric?'<button data-key=" ">Space</button>':''}<button data-clear-query>Clear</button><button data-backspace>⌫</button><button class="done" data-done>Done</button></div>`;}
function closePicker(commit=false){if(commit)picker.apply($('#query').value);picker=null;$('#picker').hidden=true;}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const attr=button.dataset,side=Number(attr.side);if('pick'in attr){mons[side].species=Number(attr.pick);mons[side].ability=DATA.species[mons[side].species].abilities[0];render();}else if('edit'in attr){mons[Number(attr.edit)].edit=!mons[Number(attr.edit)].edit;render();}else if('mega'in attr){mons[Number(attr.mega)].mega=!mons[Number(attr.mega)].mega;render();}else if('reset'in attr){mons[Number(attr.reset)].hp=235;render();}else if('residual'in attr){const owner=Number(attr.residual);changeHP(owner,owner?14:14-Math.floor(235/16)*mons[owner].toxic);if(mons[owner].status==='tox')mons[owner].toxic++;render();say('Turn-end total applied');}else if('berry'in attr){changeHP(Number(attr.berry),60);mons[Number(attr.berry)].berry=false;render();say('Berry +60');}else if('part'in attr){changeHP(side,Number(attr.part));if(Number(attr.part)<0)mons[side].toxic++;render();say(button.textContent+' applied');}else if('open'in attr){mons[side].open=mons[side].open===Number(attr.open)?-1:Number(attr.open);render();}else if('damage'in attr)applyDamage(side,attr.damage,Number(attr.move));else if('roll'in attr){$(`#amount-${side}-${attr.move}`).value=attr.roll;}else if('apply'in attr)applyDamage(side,$(`#amount-${side}-${attr.apply}`).value,Number(attr.apply));else if('crit'in attr){button.setAttribute('aria-pressed',button.getAttribute('aria-pressed')!=='true');}else if('toggleMove'in attr)toggleMove(Number(attr.toggleMove),side);else if('format'in attr){field.gameType=field.gameType==='Singles'?'Doubles':'Singles';render();}else if('resetFight'in attr)resetFight();else if('field'in attr){const entry=DATA.field.find(item=>item.k===attr.field);field[attr.field]=entry.max?((field[attr.field]||0)+1)%(entry.max+1):!field[attr.field];render();}else if('fieldSide'in attr){fieldSide=attr.fieldSide;renderField();}else if('hazards'in attr){changeHP(Number(attr.hazards),-29);render();say('Entry hazards: 29 HP (mock)');}else if('combo'in attr){const key=attr.combo;openPicker({label:key==='ability'?'Other ability · all abilities':key==='item'?'Item · all items':'Nature',choices:key==='item'?DATA.items:key==='nature'?natures:DATA.abilities,value:'',apply:value=>{if(value)mons[side][key]=value;render();}});}else if('otherClear'in attr){mons[Number(attr.otherClear)].other=false;mons[Number(attr.otherClear)].ability=DATA.species[mons[Number(attr.otherClear)].species].abilities[0];render();}else if('choice'in attr){picker.apply(attr.choice);closePicker();}else if('key'in attr){$('#query').value+=attr.key;paintPicker();}else if('clearQuery'in attr){$('#query').value='';paintPicker();}else if('backspace'in attr){$('#query').value=$('#query').value.slice(0,-1);paintPicker();}else if('done'in attr)closePicker(true);else if('stage'in attr){button.textContent=String((Number(button.textContent)+1)%7);}});
document.addEventListener('change',event=>{const input=event.target,attr=input.dataset;if('num'in attr){const mon=mons[Number(attr.side)],maximum=attr.num==='hp'?mon.max:attr.num==='toxic'?15:100;mon[attr.num]=Math.min(maximum,Math.max(attr.num==='hp'?0:1,Number(input.value)||0));render();}else if('ability'in attr){const side=Number(attr.ability);if(input.value==='Other…'){mons[side].other=true;render();openPicker({label:'Other ability · all abilities',choices:DATA.abilities,apply:value=>{if(value)mons[side].ability=value;render();}});}else mons[side].ability=input.value;}else if('status'in attr){mons[Number(attr.status)].status=input.value;render();}else if('vol'in attr){mons[Number(attr.vol)].vol=input.value;render();}else if('hits'in attr){mons[Number(attr.hits)].hit=Number(input.value);render();}else if('fight'in attr){field[attr.fight]=input.value;render();}});
document.addEventListener('click',event=>{const input=event.target.closest('input');if(!INV||!input||input.id==='query')return;const identifier=input.id,attr={...input.dataset};openPicker({label:input.getAttribute('aria-label')||'Number',value:input.value,numeric:true,apply:value=>{const current=identifier?document.getElementById(identifier):attr.num?document.querySelector(`[data-num="${attr.num}"][data-side="${attr.side}"]`):input;if(current){current.value=value;current.dispatchEvent(new Event('change',{bubbles:true}));}}});});
$('#query').addEventListener('input',paintPicker);$('#query').addEventListener('keydown',event=>{if(event.key==='Escape')closePicker();if(event.key==='Enter')closePicker(true);});$('#picker-back').onclick=()=>closePicker();$('#picker-clear').onclick=()=>{$('#query').value='';paintPicker();};
window.demo=mode=>{closePicker();if(mode==='edit')mons[0].edit=true;if(mode==='move')mons[0].open=0;if(mode==='field')$('#field').open=true;render();const selector=mode==='field'?'#field':mode==='effects'?'#move-0-2':mode==='move'?'#move-0-0':'#card-0';$(selector).scrollIntoView({block:'start'});};
resetFight();
</script></body></html>
