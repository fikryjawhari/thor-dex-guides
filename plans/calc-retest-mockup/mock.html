function spriteGrid(target,offset,count){$(target).innerHTML=Array.from({length:count},(_,index)=>{const position=(index+offset)%DATA.species.length,species=DATA.species[position];return `<button data-pick="${position}" data-side="${target==='#box'?0:1}" aria-label="${esc(species.n)}" aria-pressed="${mons[target==='#box'?0:1].species===position}"><span class="sprite" style="background-image:url('${species.sprite}')"></span><span>50</span></button>`}).join('');}
function numeric(side,key,value,cls,label){return `<input class="${cls}" type="number" min="0" value="${value}" data-side="${side}" data-num="${key}" aria-label="${label}" ${INV?'readonly':''}>`;}
function card(side){const mon=mons[side],species=DATA.species[mon.species];return `<section class="cc ${side===0?'active':''}" id="card-${side}"><div class="l1"><b>${esc(species.n)}</b><button data-mega="${side}" aria-pressed="${!!mon.mega}">M</button><button data-edit="${side}">Edit ${mon.edit?'▴':'▾'}</button><small>Spe <strong>${side?79:84}</strong></small></div><div class="hp-line"><span>Lv</span>${numeric(side,'lv',mon.lv,'level','Level')}<button class="reset-hp" data-reset="${side}" aria-label="Reset HP" title="Reset HP">↻</button>${numeric(side,'hp',mon.hp,'hp','HP')}<span class="max">/${mon.max}</span><span class="end">${mon.status==='tox'?`<span>T</span>${numeric(side,'toxic',mon.toxic,'toxic','Toxic counter')}`:''}<button class="${turnDelta(side)>=0?'gain':'loss'}" data-residual="${side}" title="Apply turn-end total">${side?14:Math.abs(turnDelta(side))}</button>${mon.berry?`<button class="berry" data-berry="${side}" title="Apply ready berry">+60</button>`:''}</span></div><div class="hpbar"><span style="width:${100*mon.hp/mon.max}%"></span></div>${mon.edit?edit(side):''}</section>`;}
function combo(side,key,label){return `<label>${label}<button class="combo" data-combo="${key}" data-side="${side}">${esc(mons[side][key])} ⌕</button></label>`;}
function edit(side){const mon=mons[side],abilities=DATA.species[mon.species].abilities;return `<div class="edit"><div class="edit-grid">${combo(side,'nature','Nature')}<label>Ability${mon.other?`<span class="edit-pair"><button class="combo" data-combo="ability" data-side="${side}">${esc(mon.ability)} ⌕</button><button data-other-clear="${side}" aria-label="Use species abilities">×</button></span>`:`<select data-ability="${side}" aria-label="Ability">${options([...abilities,'Other…'],mon.ability)}</select>`}</label>${combo(side,'item','Item')}<label>Status<select data-status="${side}" aria-label="Status">${options(DATA.status,mon.status)}</select></label><label class="wide">Battle state<select data-vol="${side}" aria-label="Battle state">${options([['','No battle state'],['dig','Dig'],['fly','Fly / Bounce'],['dive','Dive'],['min','Minimized'],['switch','Switching out']],mon.vol)}</select></label></div><div class="parts"><button class="gain" data-part="14" data-side="${side}">Leftovers +14</button>${mon.status==='tox'?`<button class="loss" data-part="${-28*mon.toxic}" data-side="${side}">Toxic ${28*mon.toxic}</button>`:''}</div><div class="stat-grid">${['HP','Atk','Def','SpA','SpD','Spe'].map(label=>`<span>${label}<button data-stage="${side}" aria-label="${label} stage">0</button></span>`).join('')}</div></div>`;}
function moveKey(move,side){return move.scope==='global'?move.key:(move.scope==='opponent'?(side?'atk':'def'):(side?'def':'atk'))+move.key;}
function moveValue(move,side){return move.key==='vol'?mons[side].vol:field[moveKey(move,side)];}
function enabled(move,side){return move.value?moveValue(move,side)===move.value:!!moveValue(move,side);}
function totals(move,side){const hits=move.hits?mons[side].hit:1;return [move.min*hits,move.max*hits];}
function moves(side){return MOVES.map((move,index)=>{const open=mons[side].open===index;if(!move.min){const exists=move.key==='vol'||DATA.field.some(entry=>entry.k===moveKey(move,side));if(!exists)return '';return `<div class="move status"><div class="r1"><button class="move-name" data-toggle-move="${index}" data-side="${side}"><span class="dot" style="background:#9173c0"></span>${move.n}</button><button class="move-toggle" data-toggle-move="${index}" data-side="${side}" aria-label="${move.n}" aria-pressed="${enabled(move,side)}">${move.max?(moveValue(move,side)||0):enabled(move,side)?'On':'Off'}</button></div></div>`;}const [minimum,maximum]=totals(move,side);const rollList=Array.from({length:16},(_,roll)=>Math.floor(minimum+(maximum-minimum)*roll/15));return `<article class="move" id="move-${side}-${index}"><div class="r1"><button class="move-name" data-open="${index}" data-side="${side}"><span class="dot" style="background:${index===1?'#bb7554':index===2?'#72a34c':'#9c9b7d'}"></span>${move.n}</button><span class="damage"><button data-damage="${minimum}" data-side="${side}" data-move="${index}" aria-label="Apply ${minimum} damage">${minimum}</button><span>–</span><button data-damage="${maximum}" data-side="${side}" data-move="${index}" aria-label="Apply ${maximum} damage">${maximum}</button></span><button class="crit" data-crit="${side}-${index}" aria-pressed="false">C</button>${move.key?`<button class="move-toggle" data-toggle-move="${index}" data-side="${side}" aria-label="${move.n} state" aria-pressed="${enabled(move,side)}">${move.maxLayers?(moveValue(move,side)||0):enabled(move,side)?'On':'Off'}</button>`:''}</div><div class="r2"><span>${move.recoil?`<span class="chip loss" title="Recoil, automatically applied">${Math.floor(minimum*move.recoil)}–${Math.floor(maximum*move.recoil)}</span> · `:''}${move.drain?`<span class="chip gain" title="Drain, automatically applied">${Math.floor(minimum*move.drain)}–${Math.floor(maximum*move.drain)}</span> · `:''}${Math.round(minimum/2.35)}–${Math.round(maximum/2.35)}%</span>${move.hits?`<select class="hits" data-hits="${side}" aria-label="Hit count">${options([2,3,4,5].map(value=>[value,value+'×']),mons[side].hit)}</select>`:'<span>2HKO</span>'}</div>${open?`<div class="move-details"><div class="controls"><span>Type<select aria-label="Move type">${options(['Normal','Fighting','Grass'],index===1?'Fighting':index===2?'Grass':'Normal')}</select></span><span>Power<input type="number" aria-label="Power" value="${index===2?25:90}" ${INV?'readonly':''}></span></div><div>Physical · vs ${mons[1-side].hp}/${mons[1-side].max} HP</div><div class="rolls">${rollList.map(roll=>`<button data-roll="${roll}" data-side="${side}" data-move="${index}">${roll}</button>`).join('')}</div><div class="custom"><label for="amount-${side}-${index}">Damage</label><input type="number" min="0" value="${minimum}" id="amount-${side}-${index}" aria-label="Custom damage" ${INV?'readonly':''}><button data-apply="${index}" data-side="${side}">Apply</button></div></div>`:''}</article>`;}).join('');}
function renderFight(){const selects=['weather','terrain'].map(key=>{const entry=DATA.field.find(item=>item.k===key);return `<select data-fight="${key}" aria-label="${entry.l}">${options([['','No '+key],...entry.o.filter(pair=>pair[0])],field[key])}</select>`;});$('#fight').innerHTML=`<button class="format" data-format aria-label="Battle format">${field.gameType} ▾</button>${selects.join('')}<button class="reset-fight" data-reset-fight aria-label="Reset fight" title="Reset fight">↻</button>`;}
function fieldToggle(entry){return `<button data-field="${entry.k}" aria-pressed="${!!field[entry.k]}" title="${esc(entry.l)}">${esc(entry.l.replace(/^(Attacker|Defender|Player|Foe) /,''))}${entry.max?' '+(field[entry.k]||0):''}</button>`;}
function renderField(){const entries=DATA.field.filter(entry=>entry.type!=='select'&&(!entry.doubles||field.gameType==='Doubles'));$('#field-summary').textContent=[field.weather,field.terrain].filter(Boolean).join(' · ');$('#field-body').innerHTML=`<div class="field-grid global-grid">${entries.filter(entry=>entry.side==='field').map(fieldToggle).join('')}</div><div class="side-tabs">${['atk','def'].map((side,index)=>`<button data-field-side="${side}" aria-pressed="${fieldSide===side}">${index?'Foe':'Player'}</button>`).join('')}</div><div class="field-grid">${entries.filter(entry=>entry.side===fieldSide).map(fieldToggle).join('')}</div><div class="note">${fieldSide==='atk'?'Player':'Foe'} entry hazards</div><button data-hazards="${fieldSide==='atk'?0:1}">Apply hazards</button>`;}
function render(){spriteGrid('#box',0,18);spriteGrid('#team',1,6);renderFight();$('#match').innerHTML=[0,1].map(side=>`<div class="fighter" data-fighter="${side}">${card(side)}<div class="moves" id="moves-${side}">${moves(side)}</div></div>`).join('');renderField();if(INV)document.querySelectorAll('input:not(#query)').forEach(input=>input.readOnly=true);}
function changeHP(side,delta){mons[side].hp=Math.max(0,Math.min(mons[side].max,mons[side].hp+delta));}
function turnDelta(side){return mons[side].status==='tox'?14-28*mons[side].toxic:14;}
function applyDamage(side,amount,index){amount=Math.max(0,Math.floor(Number(amount)||0));const move=MOVES[index],target=1-side,saved=mons[target].hp===mons[target].max&&amount>=mons[target].hp&&(mons[target].item==='Focus Sash'||mons[target].ability==='Sturdy'),actual=Math.min(amount,mons[target].hp-(saved?1:0)),events=[`${DATA.species[mons[target].species].n} ${mons[target].hp} → ${Math.max(0,mons[target].hp-actual)}`];changeHP(target,-actual);if(saved){events.push(mons[target].item==='Focus Sash'?'Focus Sash: 1 HP':'Sturdy: 1 HP');if(mons[target].item==='Focus Sash')mons[target].item='No item';}if(move.recoil){const recoil=Math.floor(actual*move.recoil);changeHP(side,-recoil);events.push('recoil '+recoil);}if(move.helmet&&mons[target].item==='Rocky Helmet'){changeHP(side,-39);events.push('Helmet 39');}if(move.drain){const drain=Math.floor(actual*move.drain);changeHP(side,drain);events.push('drain '+drain);}if(mons[side].item==='Life Orb'){changeHP(side,-23);events.push('Life Orb 23');}if(mons[target].berry&&mons[target].hp>0&&mons[target].hp<=mons[target].max/2){changeHP(target,60);mons[target].berry=false;events.push('berry +60');}render();say(events.join(' · '));}
function toggleMove(index,side){const move=MOVES[index],maximum=move.maxLayers||(!move.min&&move.max);if(move.key==='vol')mons[side].vol=enabled(move,side)?'':move.value;else{const key=moveKey(move,side);field[key]=move.value?(enabled(move,side)?'':move.value):maximum?((field[key]||0)+1)%(maximum+1):!field[key];}render();}
function openPicker({label,choices=[],value='',apply,numeric=false}){picker={label,choices,value:String(value),apply,numeric};$('#picker').hidden=false;$('#query').value=picker.value;$('#query').readOnly=INV;$('#query').setAttribute('aria-label',label);$('#picker-title').textContent=label;paintPicker();if(!INV)$('#query').focus();}
function paintPicker(){const query=$('#query').value.toLowerCase(),matches=picker.choices.filter(value=>value.toLowerCase().includes(query));$('#suggestions').innerHTML=picker.numeric?'<p class="note">Enter an exact value, then Done.</p>':matches.slice(0,45).map(value=>`<button role="option" data-choice="${esc(value)}">${esc(value)}</button>`).join('')+(matches.length>45?'<p class="note">Keep typing to narrow results</p>':'')+(!matches.length?'<p class="note">No matches</p>':'');const rows=picker.numeric?['1234567890']:['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];$('#keys').innerHTML=(INV?rows.map(row=>`<div class="key-row">${[...row].map(letter=>`<button data-key="${letter}">${letter}</button>`).join('')}</div>`).join(''):'')+`<div class="key-row">${INV&&!picker.numeric?'<button data-key=" ">Space</button>':''}<button data-clear-query>Clear</button><button data-backspace>⌫</button><button class="done" data-done>Done</button></div>`;}
function closePicker(commit=false){const pending=picker,value=$('#query').value;picker=null;$('#picker').hidden=true;if(commit&&pending)pending.apply(value);}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const attr=button.dataset,side=Number(attr.side);if('pick'in attr){mons[side].species=Number(attr.pick);mons[side].ability=DATA.species[mons[side].species].abilities[0];render();}else if('edit'in attr){mons[Number(attr.edit)].edit=!mons[Number(attr.edit)].edit;render();}else if('mega'in attr){mons[Number(attr.mega)].mega=!mons[Number(attr.mega)].mega;render();}else if('reset'in attr){mons[Number(attr.reset)].hp=235;render();}else if('residual'in attr){const owner=Number(attr.residual);changeHP(owner,owner?14:turnDelta(owner));if(mons[owner].status==='tox')mons[owner].toxic++;render();say('Turn-end total applied');}else if('berry'in attr){changeHP(Number(attr.berry),60);mons[Number(attr.berry)].berry=false;render();say('Berry +60');}else if('part'in attr){changeHP(side,Number(attr.part));if(Number(attr.part)<0)mons[side].toxic++;render();say(button.textContent+' applied');}else if('open'in attr){mons[side].open=mons[side].open===Number(attr.open)?-1:Number(attr.open);render();}else if('damage'in attr)applyDamage(side,attr.damage,Number(attr.move));else if('roll'in attr){$(`#amount-${side}-${attr.move}`).value=attr.roll;}else if('apply'in attr)applyDamage(side,$(`#amount-${side}-${attr.apply}`).value,Number(attr.apply));else if('crit'in attr){button.setAttribute('aria-pressed',button.getAttribute('aria-pressed')!=='true');}else if('toggleMove'in attr)toggleMove(Number(attr.toggleMove),side);else if('format'in attr){field.gameType=field.gameType==='Singles'?'Doubles':'Singles';render();}else if('resetFight'in attr)resetFight();else if('field'in attr){const entry=DATA.field.find(item=>item.k===attr.field);field[attr.field]=entry.max?((field[attr.field]||0)+1)%(entry.max+1):!field[attr.field];render();}else if('fieldSide'in attr){fieldSide=attr.fieldSide;renderField();}else if('hazards'in attr){changeHP(Number(attr.hazards),-29);render();say('Entry hazards: 29 HP (mock)');}else if('combo'in attr){const key=attr.combo;openPicker({label:key==='ability'?'Other ability · all abilities':key==='item'?'Item · all items':'Nature',choices:key==='item'?DATA.items:key==='nature'?natures:DATA.abilities,value:'',apply:value=>{if(value)mons[side][key]=value;render();}});}else if('otherClear'in attr){mons[Number(attr.otherClear)].other=false;mons[Number(attr.otherClear)].ability=DATA.species[mons[Number(attr.otherClear)].species].abilities[0];render();}else if('choice'in attr){const apply=picker.apply;closePicker();apply(attr.choice);}else if('key'in attr){$('#query').value+=attr.key;paintPicker();}else if('clearQuery'in attr){$('#query').value='';paintPicker();}else if('backspace'in attr){$('#query').value=$('#query').value.slice(0,-1);paintPicker();}else if('done'in attr)closePicker(true);else if('stage'in attr){button.textContent=String((Number(button.textContent)+1)%7);}});
document.addEventListener('change',event=>{const input=event.target,attr=input.dataset;if('num'in attr){const mon=mons[Number(attr.side)],maximum=attr.num==='hp'?mon.max:attr.num==='toxic'?15:100;mon[attr.num]=Math.min(maximum,Math.max(attr.num==='hp'?0:1,Number(input.value)||0));render();}else if('ability'in attr){const side=Number(attr.ability);if(input.value==='Other…'){mons[side].other=true;render();openPicker({label:'Other ability · all abilities',choices:DATA.abilities,apply:value=>{if(value)mons[side].ability=value;render();}});}else mons[side].ability=input.value;}else if('status'in attr){mons[Number(attr.status)].status=input.value;render();}else if('vol'in attr){mons[Number(attr.vol)].vol=input.value;render();}else if('hits'in attr){mons[Number(attr.hits)].hit=Number(input.value);render();}else if('fight'in attr){field[attr.fight]=input.value;render();}});
document.addEventListener('click',event=>{const input=event.target.closest('input');if(!INV||!input||input.id==='query')return;const identifier=input.id,attr={...input.dataset};openPicker({label:input.getAttribute('aria-label')||'Number',value:input.value,numeric:true,apply:value=>{const current=identifier?document.getElementById(identifier):attr.num?document.querySelector(`[data-num="${attr.num}"][data-side="${attr.side}"]`):input;if(current){current.value=value;current.dispatchEvent(new Event('change',{bubbles:true}));}}});});
document.addEventListener('click',event=>{const select=event.target.closest('select');if(!INV||!select)return;event.preventDefault();const choices=[...select.options];openPicker({label:select.getAttribute('aria-label')||'Choose',choices:choices.map(option=>option.textContent),apply:value=>{const option=choices.find(entry=>entry.textContent===value);if(option){select.value=option.value;select.dispatchEvent(new Event('change',{bubbles:true}));}}});},true);
$('#query').addEventListener('input',paintPicker);$('#query').addEventListener('keydown',event=>{if(event.key==='Escape')closePicker();if(event.key==='Enter')closePicker(true);});$('#picker-back').onclick=()=>closePicker();$('#picker-clear').onclick=()=>{$('#query').value='';paintPicker();};
window.demo=mode=>{closePicker();if(mode==='edit')mons[0].edit=true;if(mode==='move')mons[0].open=0;if(mode==='field')$('#field').open=true;render();const selector=mode==='field'?'#field':mode==='effects'?'#move-0-2':mode==='move'?'#move-0-0':'#card-0';$(selector).scrollIntoView({block:'start'});};
resetFight();
</script></body></html>
