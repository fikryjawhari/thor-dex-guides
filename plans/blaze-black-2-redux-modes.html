<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>BB2R trainer modes</title><style>
:root{--bg:#121417;--panel:#1b1e23;--panel2:#23272e;--line:#2e333b;--fg:#e8eaed;--mut:#9aa0a8;--acc:#f0b429;--link:#8ab4f8;--rail:#181a1e;--railon:rgba(240,180,41,.14);--key:#2b3038}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--panel:#fff;--panel2:#eef0f3;--line:#d9dce1;--fg:#1d2126;--mut:#5f6670;--acc:#b7791f;--link:#1a56db;--rail:#e7e9ed;--railon:rgba(183,121,31,.14);--key:#fff}}

:root{--g:4px;--sbh:26px;--sbf:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--link);text-decoration:none}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,max(160px,calc((100% - 8px)/3))),1fr));gap:4px}

.mon{background:var(--panel2);border-radius:8px;padding:4px 6px;font-size:12px;line-height:1.25;min-width:0}
.mon .mh{display:flex;gap:6px;align-items:center}
.mon .mh .spr{width:30px;height:30px;flex:none}
.mon .mt{min-width:0;flex:1}

.mon .l1{display:flex;gap:4px;white-space:nowrap;font-size:13px}
.mon .l1 .mn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.mon .l1 b{flex:none}
.mon .l2{margin-top:1px}
.mon .l2 .ty{font-size:10px;padding:0 4px;margin:0 2px 0 0}
.mon .l2 .tag{font-size:10px}
.mon .spd{font-size:12px}.mon .spd b{color:var(--acc);font-size:12px}
.mon .nw{white-space:nowrap}
.mon .ab{margin-top:2px;color:var(--mut)}.mon .ab a{color:var(--fg)}
.mon .mv{display:grid;grid-template-columns:1fr 1fr;gap:0 6px;margin-top:2px;font-size:11.5px}
.mon .mv a{line-height:1.2}
.mon .ex{margin-top:1px;font-size:11px}
.mon .dot{width:7px;height:7px;margin-right:3px}

.tpick{display:none}
@media (max-width:499px){
 .tpick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin:0 0 4px}
 .tpick button{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;padding:2px 0 1px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--mut);font:600 10px/1.1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
 .tpick button .spr{width:min(28px,100%);height:auto;aspect-ratio:1;background-size:auto 100%}
 .tpick button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc);background:var(--bg)}
 .team.tB{display:block}
 .team.tB>.mon:not(.sel){display:none}
}
.spr.s28{width:28px;height:28px}
.spr.s32{width:32px;height:32px}

.tag{display:inline-block}
button,summary{touch-action:manipulation;cursor:pointer}button{font:inherit;color:var(--fg)}
body{padding-left:44px}#rail{position:fixed;inset:0 auto 0 0;width:44px;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px;border-right:1px solid var(--line)}#rail span{width:40px;min-height:44px;display:grid;place-items:center;color:var(--mut);font-size:20px}#rail .active{color:var(--acc);background:var(--railon);border-radius:8px}
main{padding:4px;min-width:0}header{padding:4px 0;background:var(--bg)}h1{font-size:16px;margin:0 0 4px}button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.modes{display:grid;grid-template-columns:1.35fr 1fr .8fr;gap:3px;margin-bottom:4px}.modes button{min-width:0;padding:0 3px;min-height:40px;font-size:12px;border:1px solid var(--line);background:var(--panel2);border-radius:6px}.modes button[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.capl{font-size:12px;color:var(--mut);margin:0 0 4px;padding:4px 6px;background:var(--panel2);border-radius:6px}.capl b{color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:4px;min-width:0}.card>summary{min-height:44px;padding:4px 0;font-size:13px;font-weight:600;overflow-wrap:anywhere}.place,.trn2,.note{font-size:12px;color:var(--mut)}.place{display:block;padding-left:12px;font-weight:400}.trn2{margin-bottom:4px}.tag{display:inline-block;border-radius:5px;font-size:11px;padding:1px 5px;background:var(--panel2);color:var(--mut);white-space:nowrap}
.tpick button{min-height:44px}.tpick button img{width:26px;height:26px;object-fit:contain;image-rendering:pixelated}.mon img{width:30px;height:30px;image-rendering:pixelated;flex:none}.ab{font-size:12px;overflow-wrap:anywhere}.mv span{color:var(--link);overflow-wrap:anywhere}.mon .l1{justify-content:space-between}.mon .l1 .mn{white-space:normal;overflow:visible;text-overflow:clip}.mon .ab{margin:3px 0}.normal-line{border-top:1px solid var(--line);margin-top:6px}.normal-line>summary{min-height:40px;display:list-item;align-content:center;font-size:12px;color:var(--link)}.note{margin:5px 0}.unavailable{opacity:.5;padding:6px 8px}.unavailable .place{padding-left:0}.unavailable strong{font-size:13px}.unavailable p{margin:4px 0;font-size:12px}

const modeNames=['challenge','normal','easy'],storageKey='bb2r-modes-mockup-mode';
let mode='challenge';try{const saved=localStorage.getItem(storageKey);if(modeNames.includes(saved))mode=saved;}catch{}
let option='A';const opened={cheren:true},normalOpened={},selected={};
function escapeText(text){return String(text).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));}
function teamFor(trainer,requested){const roster=requested==='challenge'&&trainer.challenge?trainer.challenge:trainer.normal;return(roster||[]).map(pokemon=>({...pokemon,level:pokemon.level+(requested==='easy'?-trainer.shift:requested==='challenge'&&!trainer.challenge?trainer.shift:0)}));}
function teamHTML(trainer,requested){const roster=teamFor(trainer,requested),key=trainer.key+'-'+requested,active=Math.min(selected[key]||0,roster.length-1);return `<div class="roster" data-team="${key}"><div class="tpick">${roster.map((pokemon,index)=>`<button type="button" class="${index===active?'on':''}" data-slot="${index}" aria-pressed="${index===active}" aria-label="${pokemon.name}, level ${pokemon.level}"><img alt="" src="${sprites[pokemon.name]}"><small>${pokemon.level}</small></button>`).join('')}</div><div class="team tB">${roster.map((pokemon,index)=>`<div class="mon${index===active?' sel':''}"><div class="mh"><img alt="" src="${sprites[pokemon.name]}"><div class="mt"><div class="l1"><span class="mn">${pokemon.name}</span><b>Lv ${pokemon.level}</b></div></div></div><div class="small ab">${escapeText(pokemon.ability)}${pokemon.item?' · '+escapeText(pokemon.item):''}</div><div class="mv">${pokemon.moves.map(move=>`<span>${escapeText(move)}</span>`).join('')}</div></div>`).join('')}</div></div>`;}
function render(){const shown=option==='A'?'challenge':mode;
document.getElementById('modes').innerHTML=option==='B'?`<div class="modes" role="group" aria-label="Trainer mode">${modeNames.map(name=>`<button data-mode="${name}" aria-pressed="${mode===name}">${name[0].toUpperCase()+name.slice(1)}</button>`).join('')}</div>`:'';
document.getElementById('cap').innerHTML=`Cheren cap <b>${shown==='challenge'?14:shown==='normal'?13:12}</b>`;
document.getElementById('cards').innerHTML=trainers.map(trainer=>{
if(trainer.exclusive&&shown!=='challenge')return `<article class="card unavailable" aria-disabled="true"><strong>${trainer.name}</strong><span class="place">${trainer.place}</span><p>Challenge only</p></article>`;
const label=trainer.key==='drayden'&&shown==='challenge'?' · Double':'';
const cap=trainer.paired?`<div class="trn2">Level cap <b>${Math.max(...teamFor(trainer,shown).map(pokemon=>pokemon.level))}</b>${label}</div>`:'';
const alternate=option==='A'&&trainer.paired?`<details class="normal-line" data-normal="${trainer.key}" ${normalOpened[trainer.key]?'open':''}><summary>Normal team</summary><div class="trn2">Level cap <b>${Math.max(...trainer.normal.map(pokemon=>pokemon.level))}</b></div>${teamHTML(trainer,'normal')}<p class="note">${trainer.shift?'Easy: same team, levels -'+trainer.shift+'.':'Easy: same team and levels.'}</p></details>`:'';
return `<details class="card trc" data-card="${trainer.key}" ${opened[trainer.key]?'open':''}><summary>${trainer.name}${trainer.exclusive?' <span class="tag">Challenge only</span>':''}<span class="place">${trainer.place}</span></summary>${cap}${teamHTML(trainer,shown)}${alternate}</details>`;
}).join('');
document.querySelectorAll('[data-card]').forEach(details=>details.addEventListener('toggle',()=>opened[details.dataset.card]=details.open));document.querySelectorAll('[data-normal]').forEach(details=>details.addEventListener('toggle',()=>normalOpened[details.dataset.normal]=details.open));}
document.addEventListener('click',event=>{const modeButton=event.target.closest('[data-mode]');if(modeButton){mode=modeButton.dataset.mode;try{localStorage.setItem(storageKey,mode);}catch{}render();return;}const slot=event.target.closest('[data-slot]');if(!slot)return;const roster=slot.closest('.roster');selected[roster.dataset.team]=Number(slot.dataset.slot);roster.querySelectorAll('[data-slot]').forEach(button=>{const active=button===slot;button.classList.toggle('on',active);button.setAttribute('aria-pressed',String(active));});roster.querySelectorAll('.mon').forEach((pokemon,index)=>pokemon.classList.toggle('sel',index===Number(slot.dataset.slot)));});
window.setOption=value=>{if(!['A','B'].includes(value))return;option=value;render();};render();
</script></body></html>
