<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Calc layout choices</title>
<style>

:root{--bg:#121417;--panel:#1b1e23;--panel2:#23272e;--line:#2e333b;--fg:#e8eaed;--mut:#9aa0a8;--acc:#f0b429;--link:#8ab4f8;--rail:#181a1e;--railon:rgba(240,180,41,.14);--key:#2b3038}

@media (prefers-color-scheme:light){:root{--bg:#f4f5f7;--panel:#fff;--panel2:#eef0f3;--line:#d9dce1;--fg:#1d2126;--mut:#5f6670;--acc:#b7791f;--link:#1a56db;--rail:#e7e9ed;--railon:rgba(183,121,31,.14);--key:#fff}
}

/* --g: the one gap (page sides, under the header, between boxes, the header's padding); --sbh / --sbf: the search bar's
   height and font (template/README.md, Page design) */
:root{--g:4px;--sbh:26px;--sbf:14px}

*{box-sizing:border-box}

html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

a{color:var(--link);text-decoration:none}

/* The header holds the search bar only while a query is set (the rail's top button opens search) and the Pokemon page's
   filters; with neither it's hidden (its height, --hh, is then 0). Its line is a shadow, so all four paddings match. */
header{position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:0 1px 0 var(--line);padding:var(--g);display:flex;flex-direction:column;gap:var(--g)}

header>.bar:first-child:not(:has(#q.has)){display:none}

header:has(#filters:empty):not(:has(#q.has)){display:none}

header .bar{margin:0;gap:var(--g)}

header #filters:empty{display:none}

header select{height:var(--sbh);padding:0 6px;font-size:var(--sbf);border-radius:6px}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:960px;margin:0 auto}

input,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:15px}

input[type=search]{flex:1;min-width:140px}

main{padding:var(--g) var(--g) 60px;max-width:960px;margin:0 auto}

/* Boxes on every page are one gap apart (their own margins don't count) */
main#app{display:flex;flex-direction:column;gap:var(--g)}

#app>*{margin:0!important}

.list{display:flex;flex-direction:column;gap:4px}

/* Off-screen rows and bodies skip style and layout (re-rendering the 1275-row list or the open walkthrough took ~1s). Scroll
   restores anchor on an element (keepAnchor), since estimated heights make a raw scrollY land in the wrong place. */
.list>.row{content-visibility:auto;contain-intrinsic-size:auto var(--rowh,50px)}

details.split[open]>.body,details.stopd[open]>.stop,.trd[open]>.trb{content-visibility:auto;contain-intrinsic-size:auto 400px}

.row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px;color:var(--fg)}

.row .nm{flex:1;font-weight:600;min-width:0}

.row .bst{color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px;text-align:right}

.spr{overflow:hidden;flex:none;image-rendering:pixelated;background:no-repeat left/auto 100%}

.spr img{height:100%;width:auto;display:block;image-rendering:pixelated}

a.sprl{display:block;flex:none;width:max-content;line-height:0}

.sprph{border-radius:50%;display:flex;align-items:center;justify-content:center;container-type:size}

.sprph span{font-weight:700;font-size:38cqh;line-height:1;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}

.ty.bt,.sprph.bt span{color:#000;text-shadow:none}

.s40{width:40px;height:40px}
.s112{width:112px;height:112px}

.ty{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;font-weight:700;color:#fff;margin-right:3px;text-shadow:0 1px 1px rgba(0,0,0,.35);white-space:nowrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}

.card h3{margin:0 0 8px;font-size:15px;color:var(--acc)}

.hero{display:flex;gap:14px;align-items:center}

.hero h2{margin:0 0 4px;font-size:22px}

.mut{color:var(--mut)}

.small{font-size:12px}

.stat{display:grid;grid-template-columns:62px 38px 1fr;gap:8px;align-items:center;margin:3px 0;font-size:14px}

.stat .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

.stat .b{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}

.stat .b i{display:block;height:100%;border-radius:5px}

table{border-collapse:collapse;width:100%;font-size:14px}

td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

th{color:var(--mut);font-weight:600;font-size:12px}

td.n{font-variant-numeric:tabular-nums;white-space:nowrap}

.sub{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}

.sub button{background:var(--panel2);color:var(--fg);border:0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}

.sub button.on{background:var(--acc);color:#111}

.back{display:inline-block;margin-bottom:4px;font-weight:600}

.tag{font-size:11px;background:var(--panel2);color:var(--mut);padding:1px 6px;border-radius:6px;margin-left:4px;font-weight:600}

.evo li{margin:3px 0}

ul{margin:0;padding-left:18px}

.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:20px}

.cat{font-size:11px;font-weight:700;padding:1px 5px;border-radius:5px;background:var(--panel2)}

.cat.Physical{color:#f08a5d}
.cat.Special{color:#7fb2ff}
.cat.Status{color:var(--mut)}

.chips{display:flex;gap:6px;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:3px 6px 3px 10px;font-size:13px}

.chip b{color:var(--mut);font-weight:600}

.chip button{background:none;border:0;color:var(--mut);font-size:16px;line-height:1;padding:0 4px}

.trn{font-weight:700;margin-bottom:6px}

.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:4px;vertical-align:middle}

details.split{margin:8px 0}

details.split>summary{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px;list-style:none}

details.split>summary::after{content:' ▸';color:var(--mut)}

details.split[open]>summary::after{content:' ▾'}

.sech{margin:14px 0 4px;font-weight:700;color:var(--acc);font-size:14px}

.num{color:var(--mut);font-variant-numeric:tabular-nums;font-size:12px;min-width:22px}

.calc input{width:52px;padding:5px 6px;font-size:14px;text-align:center}
.calc select{padding:5px 6px;font-size:14px}

.calc td,.calc th{padding:4px 4px;text-align:center}
.calc .res{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}

.lvrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lvrow span{background:var(--panel2);border-radius:8px;padding:4px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.lvrow span.cur{outline:2px solid var(--acc)}

.itbl td:first-child{font-weight:600;width:38%}
.itbl td{font-size:13px}
.warn{color:#e0a030;font-size:11px;font-weight:700;margin-left:4px}

.trk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.trk select{flex:1;min-width:150px}

.tk-x{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;font-size:18px;line-height:1;padding:4px 10px}

.tk-other{width:100%}
.tk-other input{width:100%}
.tk-opt{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid var(--line);cursor:pointer}

.btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.btn.danger{color:#e05252}

.tag.got{background:#2e5e3a;color:#d8f5de}

tr.dupe td,span.dupe{opacity:.45}
span.dupe a,tr.dupe a{text-decoration:line-through}

.stop{border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:14px 0}
.stoph{font-weight:700;font-size:15px}

.wsign{margin:10px 0;padding:4px 0 4px 10px;border-left:3px solid var(--line);font-weight:700;font-size:14px;line-height:1.25;color:var(--mut)}

.encl{font-size:13px;margin:3px 0;line-height:1.5}
.itbl.wt{margin:6px 0;background:var(--panel);border-radius:10px}

details.split>summary .tag{margin-left:6px}

.trnote{font-size:12px;color:var(--mut);margin:-2px 0 6px;line-height:1.45}
.trnote b{color:var(--acc)}

details.stopd{margin:10px 0}
details.stopd>summary{list-style:none;cursor:pointer;border-left:3px solid var(--acc);padding:4px 0 4px 10px}
details.stopd>summary::after{content:' ▾';color:var(--mut);font-size:13px}
details.stopd:not([open])>summary::after{content:' ▸'}

/* A stop's grey rail is drawn short of the stop's end, so its last pixels never peek out under the pinned yellow
   header as that header slides off */
details.stopd>.stop{margin-top:0;border-left:0;padding-left:13px;position:relative}

details.stopd>.stop::before{content:'';position:absolute;left:0;top:0;bottom:12px;width:3px;background:var(--line)}


.card.conf{border-color:#e0a030}
.card.conf h3{color:#e0a030}

.wstep{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.wstep input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--acc)}
.wstep.done>span{opacity:.5;text-decoration:line-through}

.cfx{font-size:11px;color:#e0a030;margin-top:4px;line-height:1.35}

.tag.warnb{background:#5e2e2e;color:#f5d8d8}

.tag.aura{background:#4a3d12;color:#f3e3a6}

.trd{margin:2px 0}
.trd>summary{cursor:pointer;padding:5px 4px;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:1px 4px;line-height:1.25;font-size:14px;border-bottom:1px solid var(--line)}

.trd>summary::-webkit-details-marker{display:none}
.trd[open]>summary{color:var(--acc)}

/* A closed trainer row's team: 24 px sprites, six to a line at most, beside the name when it leaves room, else under it
   at the right. An open card shows the team, so the row's goes. */
.trmini{display:flex;flex-wrap:wrap;gap:2px;margin-left:auto;justify-content:flex-end;max-width:calc(6*24px + 10px)}

details.trd[open]>summary .trmini{display:none}

.spr.s24{width:24px;height:24px}
.spr.s24 img{width:24px;height:24px}

.trc .trn a{color:var(--fg)}
.capin{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}

/* Section rail: icons down the left edge, the page beside it */
body{padding-left:44px}

#rail{position:fixed;left:0;top:0;bottom:0;width:44px;z-index:6;display:flex;flex-direction:column;background:var(--rail);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}

#rail::-webkit-scrollbar{display:none}

#rail a{flex:none;height:35px;display:flex;align-items:center;justify-content:center;color:var(--mut);-webkit-tap-highlight-color:transparent}

#rail a.on{color:var(--acc);background:var(--railon);box-shadow:inset 3px 0 0 var(--acc)}

#rail svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

body[data-v=calc] header{display:none}

/* Pokemon, move, ability and trainer pages hide the search bar but keep the query: the list pages still show it. */
body:is([data-v=p],[data-v=m],[data-v=a],[data-v=tr]) header{display:none}

/* Pokemon rows: types drop under the name when the row is narrow */
.row .rt{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px}

.row .rt .nm{flex:1 1 auto}

/* Trainer cards (template/README.md, Page design). An opened card in a trainer row starts at its team (the row says the rest). */
.card.trc{padding:6px 8px}

.trc .trnote,.trc .capd{font-size:12px}

.trn2{font-size:12px;margin-bottom:3px}

.trtg{margin:-2px 0 6px}
.trtg:empty{display:none}

/* Teams: every Pokemon, three across at most (160 px each at least: 2 across from 500 to about 560 px wide) */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,max(160px,calc((100% - 8px)/3))),1fr));gap:4px}

/* A Pokemon: sprite beside name and level, types and speed; ability · item · nature; moves two across; EVs */
.mon{background:var(--panel2);border-radius:8px;padding:4px 6px;font-size:12px;line-height:1.25;min-width:0}

.mon .mh{display:flex;gap:6px;align-items:center}

.mon .mh .spr{width:30px;height:30px;flex:none}

.mon .mt{min-width:0;flex:1}

/* name and level on one line: a long name truncates, the level never does */
.mon .l1{display:flex;gap:4px;white-space:nowrap;font-size:13px}

.mon .l1 .mn{min-width:0;overflow:hidden;text-overflow:ellipsis}

.mon .l1 b{flex:none}

.mon .l2{margin-top:1px}

.mon .l2 .ty{font-size:10px;padding:0 4px;margin:0 2px 0 0}

.mon .l2 .tag{font-size:10px}

.mon .spd{font-size:12px}
.mon .spd b{color:var(--acc);font-size:12px}

.mon .nw{white-space:nowrap}

.mon .ab{margin-top:2px;color:var(--mut)}
.mon .ab a{color:var(--fg)}

.mon .mv{display:grid;grid-template-columns:1fr 1fr;gap:0 6px;margin-top:2px;font-size:11.5px}

.mon .mv a{line-height:1.2}

.mon .mv.guess a{font-style:italic}
.mon .mv.guess a::after{content:' ?';color:var(--mut)}

.mon .ex{margin-top:1px;font-size:11px}

.mon .dot{width:7px;height:7px;margin-right:3px}

/* Under 500 px wide: a strip of up to six sprite buttons (28 px, level under each) over one Pokemon */
.tpick{display:none}

@media (max-width:499px){
 .tpick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin:0 0 4px}

 .tpick button{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;padding:2px 0 1px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--mut);font:600 10px/1.1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

 .tpick button .spr{width:min(28px,100%);height:auto;aspect-ratio:1;background-size:auto 100%}

 .tpick button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc);background:var(--bg)}

 .team.tB{display:block}

 .team.tB>.mon:not(.sel){display:none}

}

.spr.s28{width:28px;height:28px}

.spr.s32{width:32px;height:32px}

/* Tags wrap as a unit after long names (an inline tag glued to "Crabominable" made the page 271px wide at 260) */
.tag{display:inline-block}

/* Sort and availability share one row, shrinking rather than wrapping */
.chips:empty{display:none}
#filters .chips{flex:1 1 100%}

.sorts{display:flex;gap:8px;min-width:0;max-width:100%}
.sorts select{flex:0 1 auto;min-width:0}

.trmini{flex-wrap:wrap;justify-content:flex-end;max-width:100%}

.hero>div{min-width:0}
.calc select{max-width:100%;min-width:0}

@media (max-width:420px){.card{padding:8px}

 .hero .s112{width:72px;height:72px}
.hero{gap:10px}
.hero h2{font-size:18px}

 /* encounter rows restack: sprite and name on the left, rate over level on the right */
 table.enc,table.enc tbody{display:block}

 table.enc tr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;column-gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}

 table.enc td{border:0;padding:0}

 table.enc td:nth-child(-n+2){grid-row:span 2}

 table.enc td:nth-child(n+3){grid-column:3;text-align:right}

 table.enc td:first-child{width:auto!important}
table.enc .spr.s40{width:32px;height:32px}

 table.wh,table.wh tbody{display:block}
table.wh tr:first-child{display:none}

 table.wh tr{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}

 table.wh td{border:0;padding:0}
table.wh td:nth-child(2){grid-row:2;grid-column:1;color:var(--mut);font-size:13px}

 table.wh td:nth-child(3){grid-row:1;grid-column:2;text-align:right}
table.wh td:nth-child(4){grid-row:2;grid-column:2;text-align:right}
}

@media (max-height:260px){header{position:static}
}

/* In-page keyboard (Dex Viewer only; see IN-PAGE KEYBOARD in the script). The search box and number boxes are buttons
   there, and the keyboard is fixed to the bottom of the window, over the rail. */
.disp{flex:1;min-width:140px;display:flex;align-items:center;gap:4px;min-height:var(--sbh);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 0 0 8px;font:inherit;font-size:var(--sbf);text-align:left;cursor:text;touch-action:manipulation}

.disp .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.disp .tx:empty::before{content:attr(data-ph);color:var(--mut)}

.kq::after{content:'';display:inline-block;width:2px;height:18px;background:var(--acc);vertical-align:-3px;margin-left:1px;animation:kbblink 1s steps(1) infinite}

@keyframes kbblink{50%{opacity:0}
}

@media (prefers-reduced-motion:reduce){.kq::after{animation:none}
}

.disp .x{flex:none;width:var(--sbh);height:var(--sbh);display:none;align-items:center;justify-content:center;border-radius:6px;color:var(--mut);font-size:18px}

.disp.has .x{display:flex}

.nv{min-width:44px;min-height:40px;padding:0 6px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;cursor:text;touch-action:manipulation}

.nv.open{color:var(--acc);border-color:var(--acc)}

.calc .nv{min-width:40px;padding:0 4px}

.num{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;vertical-align:middle}

.num:has(.nv.open){border-color:var(--acc)}

.num .st{flex:none;width:40px;min-height:40px;border:0;background:var(--panel2);color:var(--fg);font-size:20px;cursor:pointer;touch-action:manipulation}

.num .st:active{background:var(--key)}

.num .nv{border:0;border-radius:0;min-width:52px}

.kb{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--rail);border-top:1px solid var(--line);padding:6px 4px;box-shadow:0 -6px 18px rgba(0,0,0,.35)}

.kb .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:4px}

.kb .r{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}

/* Done is last and widest: the window's resize handle covers the bottom-right corner, and Done is pressed once */
.kb .r.b{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,2fr)}
.kb .r.nb{grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,2fr)}

.kb .k{font:600 var(--kf,17px) system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:var(--kh,40px);min-width:0;padding:0;border:0;border-radius:6px;background:var(--key);color:var(--fg);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}

.kb .k:active{background:var(--acc);color:#111}

.kb .k.fn{background:var(--panel2);color:var(--mut);font-size:14px}

.kb .k.done{background:var(--acc);color:#111}

.kb .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mut);padding:0 4px;min-height:20px}

.kb .lbl b{color:var(--acc);font-size:15px;font-variant-numeric:tabular-nums}

.kbs{display:flex;align-items:center;gap:6px;height:40px}

.kq{flex:none;max-width:40%;min-width:56px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600;padding:0 4px}

.kq:empty::before{content:attr(data-ph);color:var(--mut);font-weight:400}

.kb .k[data-a=up],.kb .k[data-a=dn]{font-size:22px}

.kres{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;align-items:center}

.kres::-webkit-scrollbar{display:none}

.kpick{flex:none;display:flex;align-items:center;gap:4px;height:38px;padding:0 8px 0 2px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;cursor:pointer;touch-action:manipulation}

body.kbopen main{padding-bottom:calc(var(--kbh,0px) + 16px)}

body.kbopen #filters{display:none}

.kb .r.r9{grid-template-columns:repeat(9,minmax(0,1fr));padding:0 5%}

.kb .r.r3{grid-template-columns:minmax(0,1.5fr) repeat(7,minmax(0,1fr)) minmax(0,1.5fr)}

.kb .r.rb{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}

/* full-window search: above the rail, under the keyboard */
body.sopen{overflow:hidden}

.srch{position:fixed;inset:0;z-index:19;background:var(--bg);display:flex;flex-direction:column}

.sst{flex:none;height:44px;display:flex;align-items:center;gap:2px;padding:0 4px;background:var(--rail);border-bottom:1px solid var(--line)}

.srch .ib{flex:none;width:38px;height:38px;border:0;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:22px;padding:0;cursor:pointer;touch-action:manipulation}

.srch .ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.srch.nokb .hk svg{transform:rotate(180deg)}

.srch.empty .sx{visibility:hidden}

.sq{flex:1;min-width:0;height:36px;display:flex;align-items:center;padding:0 8px;background:var(--panel);color:var(--fg);border:1px solid var(--acc);border-radius:8px;font:600 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:left;cursor:text;touch-action:manipulation}

.srch.nokb .sq{border-color:var(--line)}

input.sq{font-weight:600;outline:none;-webkit-appearance:none;appearance:none}

input.sq::placeholder{color:var(--mut);font-weight:400}

input.sq::-webkit-search-cancel-button{display:none}

.sq .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sq .tx:empty::before{content:attr(data-ph);color:var(--mut);font-weight:400}

.srch:not(.nokb) .sq .tx::after{content:'';display:inline-block;width:2px;height:18px;background:var(--acc);vertical-align:-3px;margin-left:1px;animation:kbblink 1s steps(1) infinite}

.sres{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}

body.kbopen .sres{padding-bottom:calc(var(--kbh,0px) + 8px)}

.ssh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 10px 3px;font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}

.ssh span{color:var(--mut)}

.sr{width:100%;min-height:44px;display:flex;align-items:center;gap:10px;padding:4px 10px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer;touch-action:manipulation}

.sr:active{background:var(--panel2)}

/* a result: the row (tap = its first action), then its actions as buttons under the name */
.sri{border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 74px}

.sri .sr{border-bottom:0}

.sac{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 8px;margin-top:-2px}

.sc{min-height:28px;padding:0 9px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--fg);font:inherit;font-size:13px;font-weight:600;cursor:pointer;touch-action:manipulation}

.sc.on{border-color:var(--acc);color:var(--acc)}

.sc:active{background:var(--panel2)}

.shere .sl{color:var(--acc)}

.sr .ic{flex:none;width:32px;height:32px;border-radius:8px;background:var(--panel2);color:var(--mut);display:flex;align-items:center;justify-content:center}

.sr .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.sr .st{flex:1;min-width:0;display:flex;flex-direction:column}

.sr .sl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sr .ss{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.smore{width:100%;min-height:40px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--link);font:inherit;font-size:14px;text-align:left;padding:4px 10px 4px 52px;cursor:pointer}

.shint{padding:14px 12px;color:var(--mut);font-size:14px}

.doc{line-height:1.45;overflow-wrap:anywhere}
.doc p{margin:6px 0}

/* long single-word item names (Blastoisinite, Weakness Policy) wrap instead of widening the page at 260 */
.itbl td{overflow-wrap:anywhere}

.dpre{font:12px/1.4 ui-monospace,Consolas,monospace;white-space:pre;overflow-x:auto;max-width:100%;background:var(--panel2);border-radius:8px;padding:6px 8px;margin:6px 0;tab-size:8}

/* ===== Collapsible pages (template/README.md, Page design) */
/* Rail jump buttons: the rail's spare height under the icons (about 26px each at 316 tall, 44px from about 350) */
.rjump{margin-top:auto;flex:1 0 52px;max-height:89px;display:flex;flex-direction:column;border-top:1px solid var(--line)}

.rjump[hidden]{display:none}

.rjump button{flex:1 1 0;min-height:25px;border:0;background:none;color:var(--fg);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.rjump button+button{border-top:1px solid var(--line)}

.rjump button:active{background:var(--railon);color:var(--acc)}

.rjump button:disabled{opacity:.3}

/* Expand all / Collapse all */
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}

.seg button{flex:1 1 0;min-width:0;min-height:28px;border:0;background:none;color:var(--fg);font:600 12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;touch-action:manipulation}

.seg button+button{border-left:1px solid var(--line)}

.seg button:active{background:var(--acc);color:#111}

.body>.seg{margin:8px 0 2px}
.body>.seg button{min-height:26px;color:var(--mut)}

/* Sticky headers: an open stop's header under the search bar (--hh), an open section's under its stop's (--sh) */
details.stopd[open]>summary{position:sticky;top:var(--hh,0px);z-index:3;background:var(--bg)}

/* 1px under the stop header (it sits above): rounding can't open a gap between the two */
details.stopd[open] details.sec[open]>summary{position:sticky;top:calc(var(--hh,0px) + var(--sh,34px) - 1px);z-index:2;background:var(--bg)}

/* Items: a box's sections have no stop above them and pin under the search bar */
details.split>.body>details.sec[open]>summary{position:sticky;top:var(--hh,0px);z-index:2;background:var(--bg)}

/* Sections inside a stop */
details.sec{margin:4px 0 2px}

details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;flex-wrap:wrap;gap:3px 6px;min-height:32px;padding:4px 18px 4px 0;position:relative;border-bottom:1px solid var(--line);-webkit-tap-highlight-color:transparent}

details.sec>summary::-webkit-details-marker{display:none}

details.sec>summary::after{content:'▸';position:absolute;right:2px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px}

details.sec[open]>summary::after{content:'▾'}

details.sec>summary .sn{font-weight:700;color:var(--acc);font-size:14px}

details.sec>summary .tag{margin-left:0}

.tag.miss{background:#5e2e2e;color:#ffb4b4;letter-spacing:.03em}

.secb{padding:2px 0 4px}

.chkb .wstep:last-child{border-bottom:0}

/* A mission in a checklist: a bordered card; its header (name, progress) opens its unlock, reward and steps */
details.wmis{margin:6px 0;border:1px solid var(--line);border-radius:6px;background:var(--panel)}

details.wmis>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:44px;padding:6px 24px 6px 8px;position:relative;font-size:14px;-webkit-tap-highlight-color:transparent}

details.wmis>summary::-webkit-details-marker{display:none}

details.wmis>summary::after{content:'▸';position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px}

details.wmis[open]>summary::after{content:'▾'}

details.wmis[open]>summary{border-bottom:1px solid var(--line)}

.wmis .mn{flex:1 1 auto;min-width:0;font-weight:600;overflow-wrap:anywhere}

.wmis>summary .tag{flex:none;margin-left:0}

.misb{padding:0 8px}

.mmeta{font-size:12px;color:var(--mut);margin:6px 0;overflow-wrap:anywhere}
.mmeta b{color:var(--fg)}

.misb .wstep{min-height:44px;padding:10px 0}
.misb .wstep>span{min-width:0;overflow-wrap:anywhere}

.wmis>.endbar.sb{margin-right:4px}

.secb>.itbl.wt{margin:6px 0 2px}

/* Encounter areas: one box each; a short place tag where a stop has several */
.area{padding:4px 0}
.area+.area{border-top:1px dashed var(--line)}
.area .trk{margin:4px 0}

.atag{flex:none;font-size:11px;font-weight:700;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.area>.atag{display:inline-block;margin:4px 0 2px}

/* Collapse bars at the bottom (only on blocks taller than the window) */
.endbar{display:flex;align-items:center;gap:4px;width:100%;min-height:32px;border:0;background:none;color:var(--mut);font:600 12px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:left;padding:4px 0;cursor:pointer;touch-action:manipulation}

.endbar[hidden]{display:none}

.endbar svg{flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.endbar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.endbar.st{border-top:1px dashed var(--line);margin-top:8px}

.endbar.sb{justify-content:flex-end;min-height:28px;width:auto;margin-left:auto;padding:2px 6px;color:var(--acc);font-size:11px;opacity:.85}

.endbar.sp{justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin:12px 0 4px;font-size:13px;color:var(--fg)}

/* The header you land on flashes (inset, so nothing that clips the block can cut the ring) */
.flash{animation:flash .9s ease-out}

@keyframes flash{from{box-shadow:inset 0 0 0 2px var(--acc)}
to{box-shadow:inset 0 0 0 2px transparent}
}

@media (prefers-reduced-motion:reduce){.flash{animation:none}
}

/* Walkthrough top: Guide info, Next step, Starter, Expand / Collapse all */
.wtool{display:flex;flex-direction:column;gap:var(--g)}

.wtool>details.split{margin:0}

.wtool>details.split>summary .mut{font-weight:400;margin-left:4px}

.pbody{padding:0 2px 6px}

.psec{margin:12px 0 4px;font-weight:700;color:var(--acc);font-size:13px}

/* Export / Import / Reset all side by side, even at 260; the walkthrough's Reset checklist gets its own line */
.pbar{gap:4px;margin:6px 0 0}
.pbar .wk-reset{flex-basis:100%}

.tkbar>.bar:last-child{flex-wrap:nowrap;gap:4px}

.pbar .btn,.tkbar>.bar:last-child .btn{flex:1 1 0;min-width:0;padding:5px 2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pbody>details.stopd{margin:8px 0}

.strow{display:flex;align-items:center;gap:8px;margin:0;padding:6px 8px}
.strow select{flex:1;min-width:0}

.resume{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-height:40px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font:13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:left;cursor:pointer}

.resume b{font-size:11px;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}

.resume span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Trainer rows (not sticky: the user found a pinned team preview too busy) */
.trd>.trb>.card.trc{margin:6px 0}

/* The level box inside a trainer card: closed, it shows the level the team's levels use */
details.capd{margin:2px 0 6px}

details.capd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;flex-wrap:wrap;gap:2px 5px;min-height:28px;font-size:12px;color:var(--mut);-webkit-tap-highlight-color:transparent}

details.capd>summary::-webkit-details-marker{display:none}

details.capd>summary::before{content:'▸';font-size:11px}
details.capd[open]>summary::before{content:'▾'}

details.capd>summary b{color:var(--fg)}

details.capd>.trk{margin:2px 0 4px}

/* Locations: the box's tracker above its places */
.body>.trk{margin:8px 0 4px}

/* Item tables (Items page, walkthrough items): rows straight on the page, no box */
.itbl.ix{background:none;border-radius:0;margin:2px 0 4px}

/* A trainer card's bottom line: Collapse on the left (cards in a trainer row), anything else (Pokepaste) on the right */
.trf{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:28px}

.trf .trpp{margin-left:auto;text-align:right;white-space:nowrap}

.trfold{display:flex;align-items:center;gap:3px;min-height:28px;border:0;background:none;color:inherit;font:inherit;padding:0 8px 0 0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.trfold svg{flex:none;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.trfold:active{color:var(--acc)}

/* Encounter sections (AR[i].es): sun / moon / bubbling icons, a rate per line, group labels, SOS drop-downs, maps */
.dn{width:12px;height:12px;vertical-align:-2px;margin-right:2px;flex:none}

.dn.s{color:#d9980b}
.dn.m{color:#7f9cff}
.dn.b{color:#2fa9cc}

table.lt td.n{vertical-align:top}
table.lt .rt{display:block;white-space:nowrap}

.ltsub{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;margin:10px 0 2px;font-size:12px;color:var(--mut)}

.ltsub b{color:var(--fg);font-size:13px}

.ltkey{margin:4px 0 6px}

.sosd{margin-top:3px}

.sosd>summary{list-style:none;cursor:pointer;font-size:12px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 0;min-height:22px}

.sosd>summary::-webkit-details-marker{display:none}

.sosd>summary::before{content:'▸ '}
.sosd[open]>summary::before{content:'▾ '}

.sosk{font-weight:700;color:var(--acc)}

.sosl{display:grid;gap:5px;margin:2px 0 4px;padding-left:7px;border-left:2px solid var(--line)}

.sosa{display:flex;gap:6px;align-items:center;font-size:13px;min-width:0}
.sosa .ty{font-size:10px;padding:0 4px}

.sosa.dupe{opacity:.45}
.sosa.dupe a{text-decoration:line-through}

.mapd{margin:4px 0 6px}
.mapd>summary{cursor:pointer;font-size:13px;color:var(--acc);font-weight:600;padding:4px 0}

.mapd img{display:block;max-width:100%;height:auto;border-radius:6px;margin:4px 0}

/* Move page stats: four boxes, two by two when narrow */
.mvst{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-top:8px}

.mvst>div{background:var(--panel2);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column}

.mvst span{font-size:11px;color:var(--mut);font-weight:600}
.mvst b{font-variant-numeric:tabular-nums}

/* Learned by / Pokémon with it: a long name may break rather than widen the page at 260 (a few move pages were 261) */
table.lrn td:nth-child(2){overflow-wrap:anywhere}

/* The starter picker shrinks instead of running out of the tracker bar at 260 */
.tkbar select{min-width:0;max-width:100%}
.trk .st-pick{min-width:0}

/* Trainers: battle format and version tags, partner drop-down, count/cap button in the sticky place header,
   cap line under it with who and how many battles before it, per-place expand / collapse */
.tag.fmt{background:#24435e;color:#d4e8fb}

.tag.moon{background:var(--panel2);color:var(--mut);font-style:italic;font-weight:500}

.capl{font-size:12px;color:var(--mut);margin:2px 0 6px;padding:3px 8px;border-radius:6px;background:var(--panel2)}

.capl b{color:var(--acc)}

.stop>.seg{margin:4px 0 6px}
.stop>.seg button{min-height:26px;color:var(--mut)}

.ptd{margin:6px 0 8px;border:1px dashed var(--line);border-radius:8px;padding:2px 6px}

.ptd>summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px 0;font-size:13px;list-style:none}

.ptd>summary::-webkit-details-marker{display:none}

.ptk{font-size:11px;font-weight:700;color:#d4e8fb;background:#24435e;border-radius:6px;padding:1px 6px}

.ptd[open]>summary{border-bottom:1px solid var(--line);margin-bottom:4px}

.normal-team{margin-top:8px;border-top:1px solid var(--line);min-width:0}

.normal-team>summary{min-height:44px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--mut);list-style:none}

.normal-team>summary::before{content:'▸'}

.normal-team[open]>summary::before{content:'▾'}

.normal-team>summary::-webkit-details-marker{display:none}

.normal-team>.trnote{margin:4px 0 6px}

.vs{text-align:center;font-size:11px;color:var(--mut);margin:-2px 0}

.moond{margin:8px 0 2px}
.moond>summary{cursor:pointer;font-size:13px;color:var(--mut);padding:6px 4px;border-bottom:1px dashed var(--line)}

.capsd{margin-top:4px}
.capsd>summary{cursor:pointer}

.card.trh{padding:6px 8px}

.trh .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.trh .r1 select{flex:1 1 0;min-width:0}

.mgm{display:flex;align-items:center;gap:5px;font-weight:700;font-size:13px}

.tkchoices{display:flex;flex-wrap:wrap;gap:6px 10px}

.tkchoices label{display:flex;align-items:center;gap:5px;flex:1 1 150px;min-width:0}

.tkchoices select{flex:1;min-width:0}


/* Trainers page (template/README.md, Page design): the Show row pinned under the search bar, the place header under it (--sw
   is the row's measured height, set on the box). The place header paints the page background a few px above itself, so
   no rounding can show content between the two (the Show row, painted above it, covers that band) */
.trsw{position:sticky;top:calc(var(--hh,0px) - 1px);z-index:4;display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;color:var(--mut);background:var(--bg)}

.trsw .o{display:flex;flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}

.trsw button{flex:1 1 0;min-width:0;min-height:26px;border:0;background:none;color:var(--fg);font:600 12.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;touch-action:manipulation}

.trsw button+button{border-left:1px solid var(--line)}

.trsw button.on{background:var(--acc);color:#1b1608}

.trsw button.part{box-shadow:inset 0 0 0 2px var(--acc);color:var(--acc)}

.trsw .mx{font-size:11px;white-space:nowrap}
.trsw .mx[hidden]{display:none}

/* narrow: three names need the room, so "mixed" takes the place of "Show" */
@media (max-width:359px){.trsw button{font-size:12px;padding:0 1px}
.trsw.m>span:first-child{display:none}
.trsw .mx{order:-1}
}

body[data-v=trainers] details.stopd[open]>summary{top:calc(var(--hh,0px) + var(--sw,36px) - 2px);box-shadow:0 -5px 0 var(--bg)}

/* The walkthrough's Show switch (.wksw) pins the same way: its stop headers under it, their sections under those */
body[data-v=walk] .body[data-si] details.stopd[open]>summary{top:calc(var(--hh,0px) + var(--sw,36px) - 2px);box-shadow:0 -5px 0 var(--bg)}

body[data-v=walk] .body[data-si] details.stopd[open] details.sec[open]>summary{top:calc(var(--hh,0px) + var(--sw,36px) + var(--sh,34px) - 3px)}

/* Stop and place headers on one line: the name truncates, tags and the "n/N | cap" button (a place's or walkthrough
   stop's trainers: open cards / trainers, level cap) keep their size, then the arrow */
.stoph{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}

.stoph .pn{flex:1 1 auto;min-width:3em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stoph .tag{flex:0 1 auto;min-width:0;margin-left:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.stoph::after{order:2;flex:none;margin-left:-2px}

details.stopd>summary.stoph{padding-top:2px;padding-bottom:2px}

.pt{order:1;flex:none;margin:0;min-height:24px;padding:0 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--mut);font:600 10.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;white-space:nowrap;cursor:pointer;touch-action:manipulation}

.pt[hidden]{display:none}

.pt.part{background:none;border-color:var(--acc);color:var(--acc)}

.pt.on{background:var(--acc);border-color:var(--acc);color:#1b1608}

.calc-use,.calc-versus{display:block;min-height:40px;margin-top:6px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--acc);font:600 12px system-ui;cursor:pointer}

/* ===== Pokémon page (template/README.md → Pokémon page) */
#pbar svg.i,.pnav svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Name bar: fixed beside the rail, slides in once the top card is off screen. ‹ [sprite name types] ↑ › */
:root{--pbh:40px}

#pbar{position:fixed;top:0;left:44px;right:0;z-index:4;background:var(--bg);box-shadow:0 1px 0 var(--line);transition:transform .12s ease-out}

#pbar.off{transform:translateY(-110%);box-shadow:none}

#pbar[hidden]{display:none}

#pbar .in{max-width:960px;margin:0 auto;height:var(--pbh);display:flex;align-items:stretch;container-type:inline-size}

#pbar button{background:none;border:0;padding:0;color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent;font:inherit}

#pbar .ar{flex:none;width:26px;display:flex;align-items:center;justify-content:center;color:var(--acc)}

#pbar .ar:disabled{color:var(--line);cursor:default}

#pbar .up{flex:none;width:32px;display:flex;align-items:center;justify-content:center;color:var(--acc);border-left:1px solid var(--line)}

#pbar .who{flex:1;min-width:0;display:flex;align-items:center;gap:4px;text-align:left;border-left:1px solid var(--line);padding-left:3px}

#pbar .sp{position:relative;flex:none;display:flex}
#pbar .spr{width:34px;height:34px}

#pbar .nm{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

#pbar .nm .fc{color:var(--mut);font-size:11px}

#pbar .tys{flex:none;display:flex;gap:3px;align-items:center;padding-right:4px}

#pbar .tys .ty{margin:0;font-size:11px;padding:1px 6px}

/* narrow: the types as letters down the sprite's right edge, the name a fixed 13 px */
#pbar .bdg{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);flex-direction:column;gap:2px}

#pbar .bdg .tyc{width:13px;height:13px;font-size:8.5px;box-shadow:0 0 0 1.5px var(--bg)}

@container (max-width:300px){#pbar .nm{font-size:13px}
#pbar .tys{display:none}
#pbar .bdg{display:flex}
#pbar .sp{width:38px}
#pbar .sp .spr{width:30px;height:30px}
}

/* Previous / next at the top of the page */
body[data-v=p] #app{container:app/inline-size}

.pnav{display:flex;gap:var(--g)}

.pnav a{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:4px;min-height:44px;color:var(--fg);-webkit-tap-highlight-color:transparent}

.pnav a.nx{flex-direction:row-reverse;text-align:right}

.pnav a .ch{flex:none;color:var(--acc);display:flex}

.pnav a .ch svg{width:18px;height:18px}

.pnav a .t{min-width:0;display:flex;flex-direction:column;line-height:1.2}

.pnav a .t b{font-size:13px;color:var(--link);line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.pnav a .t .r{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pnav a .r .rel{color:var(--acc)}

.pnav .gap{flex:1 1 0}

/* narrow: 12 px names (the widest word, ~6.7 em, fits half of 260) */
@container app (max-width:360px){.pnav a .t b{font-size:12px}
.pnav a .ch svg{width:16px;height:16px}
}

/* Top card: tap it (2+ forms) for the forms menu */
.card.hero{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"s n" "s m";column-gap:14px;row-gap:4px;align-items:center}

.hero>.spr{grid-area:s}
.hero>h2{grid-area:n;align-self:end;margin:0}
.hero>.hm{grid-area:m;align-self:start;min-width:0}

@container app (max-width:340px){.card.hero{grid-template-areas:"n n" "s m";column-gap:10px;padding:8px 10px}
.hero>h2{font-size:20px}
.hero>.hm{align-self:center}
.hero .s112{width:88px;height:88px}
}

.hero.hasf{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero .car{color:var(--acc);font-weight:600}

.hero .calc-use{min-height:28px;padding:3px 8px}

@container app (max-width:340px){.hero .calc-use{white-space:nowrap;font-size:11px;padding:4px 5px}
}

.fmask{position:fixed;inset:0;z-index:7}

.fmenu{position:fixed;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45);padding:4px;max-height:70vh;overflow:auto}

.fmenu button{display:flex;align-items:center;gap:6px;width:100%;min-height:44px;background:none;border:0;border-radius:8px;color:var(--fg);font:600 14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:left;padding:2px 6px;cursor:pointer}

.fmenu .n{flex:1;min-width:0}

/* Type and category as letters */
.tyc{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);flex:none;vertical-align:middle}

.tyc.bt{color:#000;text-shadow:none}

.catc{display:inline-block;font-size:11px;font-weight:800;padding:1px 4px;border-radius:5px;background:var(--panel2);line-height:1.3}

.catc.Physical{color:#f0605a}
.catc.Special{color:#7fb2ff}
.catc.Status{color:var(--mut)}

/* Sections: a card whose title row opens and closes it */
details.psec{padding:0}

details.psec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 26px 6px 12px;position:relative;-webkit-tap-highlight-color:transparent}

details.psec>summary::-webkit-details-marker{display:none}

details.psec>summary::after{content:'▸';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px}

details.psec[open]>summary::after{content:'▾'}

details.psec>summary h3{margin:0;flex:none}

details.psec>.pb{padding:0 12px 12px}

details.psec>.endbar{margin:-6px 8px 4px auto}

.hero+.seg{margin-top:var(--g)}

/* Moves: full words while they fit, letters when the table is narrow */
.mvw{container-type:inline-size;overflow-x:auto}

.mvw .tyc,.mvw .catc,.mvw .pc0{display:none}

@container (max-width:380px){
 .mvw .ty,.mvw .cat,.mvw .pc,.mvw .hw{display:none}

 .mvw .tyc,.mvw .catc{display:inline-flex}

 .mvw .pc0{display:inline}

 .mvw td,.mvw th{padding:4px 2px}

 .mvw td:first-child,.mvw th:first-child{padding-left:0}

 .mvw td:last-child,.mvw th:last-child{padding-right:0}

 .mvw td.tc,.mvw th.tc{padding-left:1px;padding-right:1px}

 .mvw table{font-size:12.5px}

 .mvw .tyc{width:16px;height:16px;font-size:10px}

 .mvw .catc{padding:1px 3px;font-size:10.5px}

 .mvw td.lv{font-size:11px}

}

.mvw td.n,.mvw th.n{text-align:right}

/* a one-word move name longer than the room breaks rather than pushing the row sideways */
.mvw td:nth-last-child(5){overflow-wrap:anywhere}

.mvw td.lv{color:var(--mut)}

.mvw th.tc,.mvw td.tc{text-align:center}

.psec .warn{cursor:help}
.psec .warn.q{color:#ef5350;font-size:12px}

/* Evolution: the whole family, base stage first, forms under their Pokémon */
.fam{display:flex;flex-direction:column}

.fam .fr{display:flex;align-items:center;gap:6px;min-height:40px;padding:2px 4px 2px calc(4px + var(--d,0)*16px);border-radius:8px;color:var(--fg)}

.fam .fr .spr{width:32px;height:32px}

.fam .fr .t{min-width:0;display:flex;flex-direction:column;line-height:1.2}

.fam .fr .t b{font-size:14px;color:var(--link);font-weight:600}

.fam .fr .t .h{font-size:12px;color:var(--mut)}

.fam .fr.cur{background:var(--railon)}

.fam .fr.cur .t b{color:var(--acc);font-weight:700}

.fam .fr .tag{margin-left:0}

/* Stat calculator, stats down the side */
.cvh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}

.cvh select{flex:1;min-width:110px}

table.cv{width:auto;max-width:100%}

.calc table.cv th,.calc table.cv td{text-align:right;padding:3px 4px}

.calc table.cv th:first-child{text-align:left;color:var(--fg);font-size:13px;white-space:nowrap}

.calc table.cv input{width:44px;padding:4px 4px;font-size:14px;text-align:center}

.calc table.cv .nv{min-width:38px;min-height:36px}

table.cv td.res{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;min-width:34px}

table.cv td.b{color:var(--mut);font-variant-numeric:tabular-nums}

table.cv th.up{color:#f0605a}
table.cv th.up::after{content:'↑'}

table.cv th.dn{color:#7fb2ff}
table.cv th.dn::after{content:'↓'}

table.cv tr.tot td,table.cv tr.tot th{border-bottom:0;color:var(--mut);font-size:12px}

@media (max-width:340px){details.psec>summary{padding-left:8px}
details.psec>.pb{padding:0 6px 8px}
details.psec[data-s=mv]>.pb{padding:0 4px 6px}
.calc table.cv th,.calc table.cv td{padding:3px 2px}
}

<script>

let options={layout:'compact3',hack:'ps',stress:'plain',cards:'three',changes:'summary'};
const original={};
for(const name of ['ei','ps'])original[name]=document.querySelector('#sample-'+name).innerHTML;
function visibleRows(){return [...document.querySelectorAll('#app .dres .mr')];}
function layoutRows(){
 for(const row of visibleRows()){
  row.style.minHeight='';
  row.classList.remove('hide-ko','more-odds','layout-third','layout-adaptive','layout-compact3','layout-contrast2');
  row.classList.add('layout-'+options.layout);
  row.querySelector('.odds-more')?.remove();
  if(options.layout!=='adaptive'||!row.querySelector('.dodds'))continue;
  const line=row.querySelector('.r2');
  const ko=line?.querySelector('.ko');
  const odds=line?.querySelector('.dodds');
  if(!odds||!line||!line.getBoundingClientRect().width)continue;
  if(odds.scrollWidth>odds.clientWidth+1||ko&&ko.scrollWidth>ko.clientWidth+1)row.classList.add('hide-ko');
  if(odds.scrollWidth>odds.clientWidth+1){
   row.classList.add('more-odds');
   const more=document.createElement('button');more.className='odds-more';more.textContent=options.stress==='triple'?'3 effects':'Effects';more.dataset.mock='open';line.append(more);
  }
 }
 alignRows();
}
function alignRows(){
 const lists=[...document.querySelectorAll('.dres')].filter(list=>list.getBoundingClientRect().width>0);
 if(innerWidth<480||lists.length!==2)return;
 const paired=lists.map(list=>[...list.querySelectorAll('.mr')]);
 for(let index=0;index<Math.max(...paired.map(rows=>rows.length));index++){
  const rows=paired.map(list=>list[index]).filter(Boolean);rows.forEach(row=>row.style.minHeight='');
  const height=Math.max(...rows.map(row=>row.getBoundingClientRect().height));rows.forEach(row=>row.style.minHeight=height+'px');
 }
}
function showFight(card){
 document.querySelector('#layout-sheet')?.remove();
 const sheet=document.createElement('section');sheet.id='layout-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','Fight changes');
 const heading=document.createElement('div');heading.className='sheet-head';heading.innerHTML='<b>Fight changes</b><button data-mock-close>Done</button>';sheet.append(heading);
 for(const text of ['Added type: Ghost','Ability: Neutralizing Gas','Item: Toxic Orb']){
  const entry=document.createElement('div');entry.className='fight-value';
  const label=document.createElement('span');label.textContent=text;entry.append(label);
  const clear=document.createElement('button');clear.textContent='Clear';clear.onclick=()=>{entry.remove();const remaining=sheet.querySelectorAll('.fight-value').length;const summary=card.querySelector('.dfsummary');if(summary)summary.textContent='Δ'+remaining;if(!remaining)summary?.remove()};entry.append(clear);sheet.append(entry);
 }
 document.body.append(sheet);
}
function render(){
 document.querySelector('#layout-sheet')?.remove();
 document.body.classList.toggle('layout-dense',['compact3','contrast2'].includes(options.layout));
 const fragment=document.createElement('template');fragment.innerHTML=original[options.hack];
 document.querySelector('#app')?.remove();document.body.append(fragment.content);
 document.querySelectorAll('[title]').forEach(element=>element.removeAttribute('title'));
 const rows=visibleRows();
 for(const row of rows){
  const odds=row.querySelector('.dodds');
  const ko=row.querySelector('.ko');
  if(odds&&ko){ko.textContent='2HKO 43.2%';ko.classList.remove('k1');ko.classList.add('k2');row.dataset.ko='43.2% chance to 2HKO';}
  const range=row.querySelector('.pc')||row.querySelector('.r2>span:first-child');if(range&&odds)range.textContent='43.5-51.6%';
  row.dataset.odds=odds?.textContent||'';
  if(row.classList.contains('st')){const hp=row.querySelector('.hp');if(hp)hp.innerHTML='<span class="notmodelled">Not modelled</span>';}
  if(options.stress==='triple'&&odds){odds.textContent='10% paralysis · 10% burn · 10% freeze';row.dataset.odds=odds.textContent;}
  if(options.stress==='long'){const name=row.querySelector('.mv');if(name&&!row.classList.contains('st'))name.textContent='Light That Burns the Sky';}
  if(['immune','fainted','protected'].includes(options.stress)&&!row.classList.contains('st')){
   const name={immune:'Immune',fainted:'Fainted',protected:'Protected'}[options.stress];
   if(ko)ko.textContent=name;if(range)range.textContent='0%';if(odds)odds.remove();row.dataset.ko=name;row.dataset.odds='';
  }
  if(options.stress==='z')row.querySelector('.rz')?.setAttribute('aria-pressed','true');
  if(options.stress==='multi'&&!row.classList.contains('st')){
   row.querySelector('.mv').textContent='Triple Axel';
   const hit=document.createElement('button');hit.className='rh';hit.setAttribute('aria-pressed','false');hit.setAttribute('aria-label','Hit count');hit.textContent='H1';row.querySelector('.dmovecontrols')?.prepend(hit);
  }
  if(options.layout==='compact3'){
   const third=document.createElement('div');third.className='r3';if(odds&&odds.isConnected)third.append(odds);row.querySelector('.mm')?.append(third);
  }
 }
 for(const card of document.querySelectorAll('.cc')){
  if(document.body.classList.contains('layout-dense')){
   const edit=card.querySelector('.stb');if(edit)card.querySelector('.cl')?.append(edit);
   if(options.cards==='three'){
    const status=document.createElement('span');status.className='layout-status';status.textContent='Tox';card.querySelector('.l1 .sp')?.before(status);
    const state=document.createElement('div');state.className='layout-state-row';state.innerHTML='<span class="dvol">Fly</span><button data-mock-toxic aria-label="Toxic turn">T1</button><button class="dturn" aria-label="Apply end of turn HP">-41</button>';card.append(state);
   }
  }
  if(options.changes==='summary'){
   const summary=document.createElement('button');summary.className='dfsummary';summary.setAttribute('aria-label','3 fight changes');summary.textContent='Δ3';summary.onclick=()=>showFight(card);
   (card.querySelector('.layout-state-row')||card.querySelector('.cl')).append(summary);
  }else if(options.changes==='inline'){
   const group=document.createElement('div');group.className='dfch';group.innerHTML='<button class="dfc">+Ghost</button><button class="dfc">Ability: Neutralizing Gas</button><button class="dfc">Item: Toxic Orb</button>';card.append(group);
  }
 }
 requestAnimationFrame(()=>{layoutRows();const bar=document.querySelector('.fbar');scrollTo(0,innerWidth<480&&bar?bar.getBoundingClientRect().top+scrollY-2:0)});
}
function setOption(key,value){options[key]=value;render();}
window.setOption=setOption;
document.addEventListener('click',event=>{
 const target=event.target;
 if(target.closest('[data-mock-close]')){document.querySelector('#layout-sheet')?.remove();return;}
 if(target.closest('.dfc')){target.closest('.dfc').remove();return;}
 const row=target.closest('.mr');if(!row)return;
 if(target.closest('.rc,.rh,.rz')){const control=target.closest('button');control.setAttribute('aria-pressed',control.getAttribute('aria-pressed')==='true'?'false':'true');if(control.classList.contains('rh'))control.textContent=control.textContent==='H1'?'×3':'H1';return;}
 if(target.closest('.dd'))return;
 const details=row.querySelector('.dd');
 if(details){details.remove();row.classList.remove('open');requestAnimationFrame(layoutRows);return;}
 row.classList.add('open');
 const panel=document.createElement('div');panel.className='dd';
 const heading=document.createElement('div');heading.className='dkof';heading.textContent=row.dataset.ko||'No KO in 4 hits';panel.append(heading);
 const odds=document.createElement('div');odds.className='dodds2';odds.textContent=row.dataset.odds||'No added effect odds';panel.append(odds);
 const description=document.createElement('div');description.textContent='Damage rolls and existing move controls stay here.';panel.append(description);row.append(panel);requestAnimationFrame(layoutRows);
});
addEventListener('resize',()=>{requestAnimationFrame(layoutRows)});
render();

</script>
