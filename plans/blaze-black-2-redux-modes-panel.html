<fieldset><legend>Trainer modes</legend><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button type="button" data-choice="A" aria-pressed="true" style="min-height:44px" onclick="chooseModes('A')">A. Line on the card</button><button type="button" data-choice="B" aria-pressed="false" style="min-height:44px" onclick="chooseModes('B')">B. Mode toggle</button></div></fieldset>
<script>function chooseModes(value){thorFrame().setOption(value);document.querySelectorAll('[data-choice]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.choice===value)));}document.getElementById('fr').addEventListener('load',()=>{const selected=document.querySelector('[data-choice][aria-pressed="true"]');if(selected)thorFrame().setOption(selected.dataset.choice);});</script>
