<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calc state controls</title>
<style>
:root{--bg:#121417;--panel:#1b1e23;--panel2:#23272e;--line:#2e333b;--fg:#e8eaed;--mut:#9aa0a8;--acc:#f0b429}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:4px;box-sizing:border-box}
button{font:inherit;color:inherit}
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px;height:24px;margin-bottom:4px;font-size:12px}
.bar .arr{width:24px;height:22px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 6px;margin-bottom:4px}
.card .l1{font-weight:700;font-size:13px;line-height:1.25}
.card .l2{font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:center;line-height:1.3}
.mark{color:var(--acc);font-weight:700}
.mr{display:flex;align-items:stretch;gap:2px;margin-bottom:2px}
.mr .mm{flex:1;min-width:0;padding:1px 6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.mr .r1,.mr .r2{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mr .r1{line-height:1.2}
.mr .mv{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mr .hp{font-weight:700;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mr .r2{font-size:10.5px;color:var(--mut);line-height:1.1}
.mr .ko{font-weight:700;white-space:nowrap}
.mr .td{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#8ab4f8}
.mr .dd{display:none;margin-top:2px;padding-top:2px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.mr.open .dd{display:block}
.mr .dd b{color:var(--fg)}
.rcol{flex:none;width:26px;display:flex;flex-direction:column;gap:1px;align-self:flex-start;height:31px}
.rcol button{display:block;width:100%;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font:700 10px/1 system-ui;cursor:pointer;touch-action:manipulation}
.rcol.two button{height:14.5px}
.rcol.two button:first-child{border-radius:6px 6px 0 0}
.rcol.two button:last-child{border-radius:0 0 6px 6px}
.rcol .rc{color:var(--mut)}
.rcol button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#111}
.rcol .rs{color:var(--fg)}
.rcol .rs[aria-pressed=false]{color:var(--mut)}
.rcol .rs.cnt[aria-pressed=false]{color:var(--fg)}
.rcol .rs.cnt[aria-pressed=true]{background:var(--panel2);color:var(--acc);border-color:var(--acc)}
.rcol .rs.cnt[data-n="0"]{color:var(--mut)}
.rcol .rs.cnt[data-n="0"][aria-pressed=true]{background:var(--panel2);color:var(--mut);border-color:var(--line)}
.rcol .rs.cnt{color:var(--fg)}
.note{font-size:10.5px;color:var(--mut);margin:6px 2px 0}
</style></head>
<body>
<div class="bar"><button class="arr" aria-label="Previous trainer">‹</button><span>Rival Brendan · 1 / 4</span><button class="arr" aria-label="Next trainer">›</button></div>
<div class="card" id="mine"><div class="l1"><span>Garchomp</span><span>Lv 50</span></div><div class="l2"><span>HP 150/150</span></div></div>
<div id="moves"></div>
<div class="card" id="foe"><div class="l1"><span>Snorlax</span><span>Lv 50</span></div><div class="l2"><span>HP 300/300</span><span class="mark" id="fmark"></span></div></div>
<div class="note">Mockup: sample numbers, not the engine's.</div>
<script>
// Sampled moves: one row of each control kind, plus the foe's state (set from the panel).
const ROWS=[
  {mv:'Earthquake',t:'Ground',pow:100,kind:'plain',note:'Foe underground: ×2'},
  {mv:'Assurance',t:'Dark',pow:60,kind:'toggle',label:'Hit',on:false,note:'Hit: target was hurt this turn, ×2'},
  {mv:'Fury Cutter',t:'Bug',pow:10,kind:'counter',n:0,max:5,note:'Uses in a row: 10 × 2^(n−1), cap 160'},
  {mv:'Triple Kick',t:'Fighting',pow:10,kind:'multi',hits:3,note:'Hits, as now'},
];
let foe='';                              // '', dig, fly, dive, min, switch
const FOE_NAME={dig:'Underground',fly:'In the air',dive:'Underwater',min:'Minimized',switch:'Switching out'};
const FOE_MARK={dig:'Dig',fly:'Fly',dive:'Dive',min:'Min',switch:'Switch'};
const OPEN=new Set();
const power=r=>{
  if(r.kind==='plain')return r.mv==='Earthquake'&&foe==='dig'?r.pow*2:r.pow;
  if(r.kind==='toggle')return r.on?r.pow*2:r.pow;
  if(r.kind==='counter')return r.n===0?r.pow:Math.min(160,r.pow*2**(r.n-1));
  return r.pow;
};
const pct=p=>Math.round(p*0.4)+'–'+Math.round(p*0.5)+'%';
function render(){
  document.getElementById('fmark').textContent=FOE_MARK[foe]||'';
  document.getElementById('foe').querySelector('.l2').lastChild.title=FOE_NAME[foe]||'';
  document.getElementById('moves').innerHTML=ROWS.map((r,i)=>{
    const p=power(r),two=r.kind!=='plain';
    let top='';
    if(r.kind==='toggle')top=`<button class="rs" data-i="${i}" aria-pressed="${r.on}">${r.label}</button>`;
    if(r.kind==='counter')top=`<button class="rs cnt" data-i="${i}" data-n="${r.n}" aria-pressed="${r.n>0}">${r.n}</button>`;
    if(r.kind==='multi')top=`<button class="rs" data-i="${i}" aria-pressed="true">×${r.hits}</button>`;
    const crit=`<button class="rc" data-i="${i}" aria-pressed="false">C</button>`;
    return `<div class="mr ${OPEN.has(i)?'open':''}"><div class="mm" data-i="${i}">
      <div class="r1"><span class="mv"><i class="td"></i>${r.mv}</span><span class="hp">${p}</span></div>
      <div class="r2"><span>${kindLabel(r,p)}${pct(p)}</span><span class="ko">2HKO</span></div>
      <div class="dd">Power <b>${p}</b> · listed ${r.pow} · ${r.note}</div></div>
      <div class="rcol ${two?'two':''}">${top}${crit}</div></div>`;
  }).join('');
}
const kindLabel=(r,p)=>r.kind==='multi'?'×'+r.hits+' · ':'';
document.addEventListener('click',e=>{
  const b=e.target.closest('button'),m=e.target.closest('.mm');
  if(b&&b.classList.contains('rs')){
    const r=ROWS[+b.dataset.i];
    if(r.kind==='toggle')r.on=!r.on;
    if(r.kind==='counter')r.n=(r.n+1)%(r.max+1);
    render();return;
  }
  if(b&&b.classList.contains('rc')){const pressed=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',!pressed);return;}
  if(m){const i=+m.dataset.i;OPEN.has(i)?OPEN.delete(i):OPEN.add(i);render();}
});
window.setOption=(k,v)=>{
  if(k==='foe'){foe=v;render();}
  if(k==='reset'){ROWS.forEach(r=>{if(r.kind==='toggle')r.on=false;if(r.kind==='counter')r.n=0;});foe='';render();}
};
render();
</script>
</body></html>
