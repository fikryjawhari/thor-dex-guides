<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Calc Edit and layout proposal</title>
<style>
:root{--bg:#121417;--panel:#1b1e23;--panel2:#23272e;--line:#343941;--fg:#e8eaed;--mut:#9aa0a8;--acc:#f0b429;--green:#6fcf97;--red:#ff7b6b}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--panel2:#edf0f4;--line:#ccd1d8;--fg:#20252b;--mut:#59626e;--acc:#a36a00;--green:#237d45;--red:#ae3024}}
*{box-sizing:border-box}html,body{margin:0;min-width:0;background:var(--bg);color:var(--fg);font:12px/1.2 system-ui,sans-serif}button,select{font:inherit;color:inherit;min-width:0}button{cursor:pointer;touch-action:manipulation}button,select{border:1px solid var(--line);border-radius:6px;background:var(--panel2)}button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}[hidden]{display:none!important}
#rail{position:fixed;inset:0 auto 0 0;width:44px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;z-index:4}#rail button{height:44px;border:0;border-radius:0;background:none;color:var(--mut);font-size:20px}#rail button.active{color:var(--acc);background:#f0b42919;border-left:3px solid var(--acc)}#rail .spacer{flex:1}
main{margin-left:44px;padding:4px;min-width:0}.pools{display:grid;gap:4px;min-width:0}.inventory{display:none}.team{border:1px solid var(--line);border-radius:10px;padding:2px;min-width:0;align-self:start}.trainer-bar{height:24px;display:flex;align-items:center;gap:4px}.trainer-bar button{width:23px;height:22px;padding:0;font-size:20px;line-height:16px}.trainer-bar strong{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sprite-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin-top:2px}.sprite-cell{height:26px;padding:0;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center}.sprite-cell img{width:16px;height:16px;object-fit:contain;image-rendering:pixelated}.selected{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc)}.team-list{display:none}.trainer-mon{height:30px;width:100%;display:flex;align-items:center;gap:4px;padding:0 3px;text-align:left}.trainer-mon img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated}.trainer-mon .text{flex:1;min-width:0}.trainer-mon .line{display:flex;align-items:baseline;gap:4px;min-width:0}.trainer-mon b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}.trainer-mon small{font-size:9px;color:var(--mut);white-space:nowrap}.trainer-mon em{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal;font-size:9px;color:var(--mut)}.trainer-mon .moves{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px;color:var(--mut)}
.cards{display:grid;gap:2px;margin-top:3px;align-items:start}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:1px 4px;min-width:0}.card.attacker{border-color:var(--acc)}.card-heading{display:flex;align-items:center;gap:3px;height:21px}.card-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}.edit-button{flex:none;height:19px;padding:0 5px;font-size:10px;color:var(--mut)}.edit-button[aria-expanded=true]{border-color:var(--acc);color:var(--acc)}.speed{flex:none;white-space:nowrap;font-size:10px;color:var(--mut)}.speed b{font-size:12px;color:var(--fg)}.speed b.fast{color:var(--acc)}.inline-state{display:flex;align-items:center;flex:none}.inline-state input{width:12px;height:12px;margin:0;accent-color:var(--acc)}.hp-line{display:flex;align-items:center;gap:3px;height:21px;white-space:nowrap;font-size:11px;color:var(--mut)}.value{height:19px;min-width:28px;padding:0 3px;font-weight:600;color:var(--fg);font-size:12px}.hp-line .delta{margin-left:auto;padding:0 3px;border:0;background:none;font-size:12px;font-weight:700;color:var(--green);height:20px}.hp-line .delta.loss{color:var(--red)}.state-mark{display:none;color:var(--acc);font-size:9px;overflow:hidden;text-overflow:ellipsis}.editor{border-top:1px solid var(--line);margin-top:2px;padding:5px 0 3px}.full-name{font-size:12px;font-weight:700;overflow-wrap:anywhere;margin-bottom:5px}.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px}.editor-grid label{min-width:0;color:var(--mut);font-size:10px}.editor-grid select{display:block;width:100%;height:30px;font-size:11px;margin-top:2px;padding:0 3px}.editor-grid .span{grid-column:1/-1}.check-row{display:flex;align-items:center;gap:4px;min-height:30px;font-size:11px}.check-row input{accent-color:var(--acc);margin:0}.stat-grid{display:grid;grid-template-columns:22px repeat(6,minmax(0,1fr));gap:2px;margin-top:7px;align-items:center;text-align:center;font-size:9px;color:var(--mut)}.stat-grid button{height:24px;padding:0;font-size:10px}.stat-grid strong{font-size:10px;color:var(--fg)}.parts{margin-top:6px;border-top:1px solid var(--line);padding-top:4px;font-size:11px}.parts>div{display:flex;align-items:center;justify-content:space-between;min-height:24px;gap:4px}.parts b{color:var(--green)}.parts button{height:22px;font-size:11px}.reset{width:100%;height:28px;margin-top:6px;font-weight:600}.movesets{display:grid;gap:3px;margin-top:3px;align-items:start}.moveset{display:grid;gap:2px;min-width:0}.moveset.foe{display:none}.move-row{display:flex;align-items:flex-start;gap:2px;min-width:0}.move-main{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden}.move-summary{width:100%;height:34px;border:0;border-radius:0;background:none;text-align:left;padding:1px 5px;display:grid;grid-template-columns:9px minmax(0,1fr) auto;grid-template-rows:17px 13px;column-gap:4px;align-items:center}.move-summary .dot{width:8px;height:8px;border-radius:50%;background:var(--type)}.move-name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700}.damage{font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}.move-summary .z{width:10px;height:11px;padding:0;border-radius:3px;color:var(--mut);font-size:9px;line-height:9px}.percent{font-size:10px;color:var(--mut)}.ko{font-size:10px;color:var(--mut);font-weight:600;white-space:nowrap}.rcol{width:25px;flex:none;display:flex;flex-direction:column;gap:1px}.rcol button{height:36px;padding:0;font-size:9px;font-weight:700;color:var(--mut)}.rcol.two button{height:17.5px}.rcol button.on,.move-summary .z.on{background:var(--acc);color:#151515;border-color:var(--acc)}.move-details{border-top:1px solid var(--line);padding:6px 5px;font-size:11px;color:var(--mut)}.move-details p{margin:0 0 6px;overflow-wrap:anywhere;line-height:1.4}.move-details b{color:var(--fg)}.move-details .powers{display:grid;grid-template-columns:1fr 1fr;gap:4px}.move-details .powers button{height:28px;font-size:11px}.status{opacity:.55}.status .move-summary{grid-template-rows:1fr}.status .rcol{display:none}.field{margin-top:6px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.field>summary{display:flex;align-items:center;gap:5px;list-style:none;min-height:30px;padding:0 7px;font-weight:700}.field>summary::-webkit-details-marker{display:none}.field>summary::after{content:'▸';margin-left:auto;color:var(--mut)}.field[open]>summary::after{content:'▾'}.field .brief{color:var(--mut);font-size:10px;font-weight:400}.field-body{padding:4px 6px 7px}.field-shared{display:grid;grid-template-columns:1fr 1fr;gap:4px}.field-shared label{font-size:10px;color:var(--mut)}.field-shared select{width:100%;height:30px;font-size:11px;margin-top:2px}.field-sides{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}.field-sides strong{display:block;text-align:center;font-size:11px;margin-bottom:3px}.field-sides button{width:100%;min-height:28px;padding:3px;font-size:10px;margin-bottom:3px}.field-sides button.on{border-color:var(--acc);color:var(--acc)}
@media(min-width:480px){.pools{grid-template-columns:1fr 1fr;height:var(--pool-height,228px);align-items:start}.inventory{display:block;align-self:stretch;border:1px solid var(--line);border-radius:10px;padding:3px;overflow:hidden}.inventory-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:4px}.inventory-tools button{height:26px;padding:0;font-size:11px}.inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:3px;height:calc(100% - 30px);overflow:auto;align-content:start}.inventory-grid .sprite-cell{height:28px}.team-list{display:grid;gap:2px;margin-top:2px}.team.has-list .sprite-strip{display:none}.team:not(.has-list) .team-list{display:none}.cards{grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.movesets{grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.moveset.foe{display:grid}.move-summary{height:30px;grid-template-rows:16px 12px}.rcol button{height:32px}.rcol.two button{height:15.5px}.state-mark{display:inline}.editor-grid select{height:32px}.card-heading{height:22px}.card-name{font-size:13px}}
@media(max-width:479.98px){.trainer-bar{height:23px}.sprite-strip .sprite-cell{height:24px}}
.download-cycle{display:block;width:100%;height:32px;margin-top:2px;text-align:left;padding:0 6px}.game-type{display:grid;grid-template-columns:1fr 1fr;margin-bottom:6px}.game-type button{height:32px;border-radius:6px 0 0 6px}.game-type button+button{border-radius:0 6px 6px 0}.game-type button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:700}
</style></head><body>
<nav id="rail" aria-label="Guide"><button aria-label="Search">⌕</button><button aria-label="Pokemon">◉</button><button aria-label="Locations">♧</button><button aria-label="Trainers">♙</button><button aria-label="Items">♧</button><button aria-label="Walkthrough">▱</button><button class="active" aria-label="Calculator">▦</button><span class="spacer"></span><button aria-label="Top" data-action="top">↑</button><button aria-label="Moves" data-action="moves">↓</button></nav>
<main id="mock"></main>
<script id="sample" type="application/json">__SAMPLE__</script>
<script>
const sample=JSON.parse(document.getElementById('sample').textContent);
const defaults=()=>({edit:[false,false],abilities:['Torrent','Flame Body'],target:['',''],download:['auto','auto'],entryOff:[false,false],abilityOn:[false,false],residual:true,hp:[148,289],opened:[],tags:{},crit:{},hits:{},gameType:'Singles',weather:'',terrain:'',fields:{},preset:'base'});
let state=defaults();
const escapeText=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
const wide=()=>innerWidth>=480;
const identity=side=>side===0?{name:state.preset==='form'?'Zoroark Hisuian':sample.player.name,level:50,speed:174,maxHp:148}: {name:sample.team[3].name,level:93,speed:305,maxHp:289};
const selectOptions=(values,current)=>values.map(([value,label])=>`<option value="${value}" ${value===current?'selected':''}>${label}</option>`).join('');
const actionButton=(label,action,extra='')=>`<button data-action="${action}" ${extra}>${label}</button>`;
function spriteCell(mon,index,inventory=false){return `<button class="sprite-cell ${index===(inventory?1:3)?'selected':''}" aria-label="${escapeText(mon.name)}"><img src="${mon.sprite}" alt=""><span>${inventory?50:mon.level}</span></button>`;}
function pools(){const team=sample.team;return `<section class="pools"><div class="inventory"><div class="inventory-tools"><button>↻ Import</button><button>+ New</button><button>⌕ Find</button></div><div class="inventory-grid">${Array.from({length:60},(_,index)=>spriteCell(sample.inventory[index%sample.inventory.length],index,true)).join('')}</div></div><div class="team ${innerHeight>=414?'has-list':''}"><div class="trainer-bar"><button aria-label="Previous trainer">‹</button><strong>${escapeText(sample.trainer)}</strong><button aria-label="Next trainer">›</button></div><div class="sprite-strip">${team.map((mon,index)=>spriteCell(mon,index)).join('')}</div><div class="team-list">${team.map((mon,index)=>`<button class="trainer-mon ${index===3?'selected':''}"><img src="${mon.sprite}" alt=""><span class="text"><span class="line"><b>${escapeText(mon.name)}</b><small>${mon.level}</small><em>${escapeText(mon.item)}</em></span><span class="moves">${escapeText(mon.moves.join(' · '))}</span></span></button>`).join('')}</div></div></section>`;}
function statsGrid(){const headers=['','HP','Atk','Def','SpA','SpD','Spe'];return `<div class="stat-grid">${headers.map(label=>`<span>${label}</span>`).join('')}<span>IV</span>${Array.from({length:6},()=>'<button data-action="stat">31</button>').join('')}<span>EV</span>${[0,0,0,252,0,252].map(value=>`<button data-action="stat">${value}</button>`).join('')}<span>Stat</span>${[148,103,136,174,130,174].map(value=>`<strong>${value}</strong>`).join('')}<span>Stage</span>${Array.from({length:6},()=>'<button data-action="stage">0</button>').join('')}</div>`;}
function editor(side){const mon=identity(side),ability=state.abilities[side];const abilityOptions=['Torrent','Flame Body','Download','Intrepid Sword','Dauntless Shield','Bull Rush','Quill Rush','Illusion'];const entry=['Intrepid Sword','Dauntless Shield'].includes(ability);return `<div class="editor" ${state.edit[side]?'':'hidden'}><div class="full-name">${escapeText(mon.name)}</div><div class="editor-grid"><label>Nature<select>${selectOptions([['Timid','Timid'],['Modest','Modest']],side?'Modest':'Timid')}</select></label><label>Ability<select data-key="ability" data-side="${side}">${selectOptions(abilityOptions.map(value=>[value,value]),ability)}</select></label><label>Item<select><option>${side?'Leftovers':'No item'}</option><option>Loaded Dice</option><option>Metronome</option></select></label><label>Status<select><option>Healthy</option><option>Burned</option><option>Badly poisoned</option></select></label><label class="span">Battle state<select data-key="target" data-side="${side}">${selectOptions([['','None'],['dig','Dig'],['fly','Fly / Bounce'],['dive','Dive'],['min','Minimized'],['switch','Switching out']],state.target[side])}</select></label>${ability==='Download'?`<label class="span">Download<button class="download-cycle" data-action="download" data-key="download" data-side="${side}">${({auto:"Auto (→ SpA)",atk:"Atk",spa:"Sp. Atk",off:"None"})[state.download[side]]}</button></label>`:''}${entry?`<label class="check-row span"><input type="checkbox" data-key="entryOff" data-side="${side}" ${state.entryOff[side]?'checked':''}>${ability} off</label>`:''}</div>${statsGrid()}${state.residual?`<section class="parts"><div><strong>Turn end</strong><b>${side?'+18':'−5'} HP</b></div><div><span>${side?'Leftovers':'Sandstorm'}</span><span>${side?'+18':'−5'}</span></div>${state.preset==='toxic'&&side?'<div><span>Toxic turn</span><button data-action="toxic">1</button></div>':''}<button class="reset" data-action="apply-turn" data-side="${side}">Apply one turn</button></section>`:''}<button class="reset" data-action="reset-card" data-side="${side}">Reset Pokemon</button></div>`;}
function card(side){const mon=identity(side),ability=state.abilities[side];const label=ability==='Illusion'?'Disguised':'First turn out';const compact=['Bull Rush','Quill Rush','Illusion'].includes(ability);return `<section class="card ${side===0?'attacker':''}" data-card="${side}"><div class="card-heading"><strong class="card-name">${escapeText(mon.name)}</strong>${compact?`<label class="inline-state" title="${label}"><input type="checkbox" aria-label="${label}" data-key="abilityOn" data-side="${side}" ${state.abilityOn[side]?'checked':''}></label>`:''}<button class="edit-button" data-action="edit" data-side="${side}" aria-expanded="${state.edit[side]}">Edit ${state.edit[side]?'▴':'▾'}</button><span class="speed">Spe <b class="${side?'fast':''}">${mon.speed}</b></span></div><div class="hp-line"><span>Lv</span><button class="value">${mon.level}</button><span>HP</span><button class="value" data-hp="${side}">${state.hp[side]}</button><span>/${mon.maxHp}</span>${state.target[side]?`<span class="state-mark">${selectOptions([],'')}${escapeText(state.target[side])}</span>`:''}${state.residual?`<button class="delta ${side?'':'loss'}" data-action="apply-turn" data-side="${side}" title="Apply one turn" aria-label="Apply one turn to ${mon.name}">${side?'+18':'−5'}</button>`:''}</div>${editor(side)}</section>`;}
function moveData(side){if(state.preset==='multihit'&&side===0)return [{name:'Icicle Spear',damage:'165–198',percent:'57.1–68.5%',tag:'×3',color:'#6acace',ko:'2HKO'},{name:'Power-Up Punch',damage:'200–238',percent:'69.2–82.4%',tag:'×2',color:'#c67638',ko:'2HKO'},{name:'Draco Barrage',damage:'73–87',percent:'25.3–30.1%',tag:'P·A',color:'#7452c3',ko:'4HKO'},{name:'Pursuit',damage:'24–28',percent:'8.3–9.7%',color:'#65544e',ko:'5+ hits'}];return side?[{name:'Fiery Dance',damage:'125–147',percent:'84.5–99.3%',color:'#f04435',ko:'2HKO'},{name:'Bug Buzz',damage:'560–662',percent:'378.4–447.3%',color:'#91a91a',ko:'OHKO'},{name:'Quiver Dance',status:true,color:'#8f9c2f'},{name:'Roost',status:true,color:'#6b91b3'}]:[{name:'Earthquake',damage:state.target[1]==='dig'?'62–74':'31–37',percent:'10.7–12.8%',color:'#d9b259',ko:'5+ hits'},{name:'Assurance',damage:'22–27',percent:'7.6–9.3%',tag:'Hit',color:'#66514d',ko:'5+ hits'},{name:'Fury Cutter',damage:'12–15',percent:'4.2–5.2%',tag:'0',color:'#91a91a',ko:'5+ hits'},{name:'Triple Kick',damage:'72–85',percent:'24.9–29.4%',tag:'×3',color:'#b94d32',ko:'5+ hits'}];}
function moveRow(move,side,index){const key=side+':'+index,open=state.opened.includes(key),tag=state.tags[key]??move.tag;const detail=move.name==='Power-Up Punch'?'Hit 1: 146–174 HP<br>Hit 2: 54–64 HP<br>Before hit 2: Attack +1 (Power-Up Punch)':move.name==='Icicle Spear'?'Total: 165–198 HP<br>Hit 1: 55–66 HP<br>Hit 2: 55–66 HP<br>Hit 3: 55–66 HP':'Physical · target state from Pokemon Edit<br>Crit 1/24, stage 0';return `<div class="move-row ${move.status?'status':''}" data-row="${key}"><div class="move-main"><div class="move-summary" role="button" tabindex="0" data-action="move" data-key="${key}" style="--type:${move.color}"><span class="dot"></span><strong class="move-name">${move.name}</strong><span class="damage">${move.status?'—':move.damage}</span>${move.status?'':`<button class="z ${state.fields['z:'+key]?'on':''}" data-action="z" data-key="${key}" aria-label="Z-move for ${move.name}">Z</button><span class="percent">${move.percent}</span><span class="ko">${move.ko}</span>`}</div>${open?`<div class="move-details"><p><b>${state.fields['z:'+key]?'Tectonic Rage':move.name}</b><br>${detail}</p><div class="powers"><button>Power ${move.name==='Assurance'&&state.tags[key]?'120':'60'}</button><button>Type</button></div><p>Turn end: +18 Leftovers</p><div class="powers"><button>HP −${move.damage.split('–')[0]}</button><button>HP −${move.damage.split('–')[1]}</button></div><button class="reset">Change move</button><button class="reset">Reset power / type</button></div>`:''}</div>${move.status?'':`<div class="rcol ${tag!==undefined?'two':''}">${tag!==undefined?`<button data-action="tag" data-key="${key}" aria-label="State for ${move.name}" class="${state.tags[key]?'on':''}">${tag}</button>`:''}<button data-action="crit" data-key="${key}" aria-label="Crit for ${move.name}" class="${state.crit[key]?'on':''}">C</button></div>`}</div>`;}
function field(){return `<details class="field"><summary>Field <span class="brief">${state.weather||'none'}</span></summary><div class="field-body"><div class="game-type" role="group" aria-label="Battle format">${["Singles","Doubles"].map(value=>`<button data-action="game-type" data-value="${value}" aria-pressed="${state.gameType===value}">${value}</button>`).join('')}</div><div class="field-shared"><label>Weather<select data-key="weather">${selectOptions([['','None'],['Sand','Sandstorm'],['Sun','Sun'],['Rain','Rain'],['Snow','Snow']],state.weather)}</select></label><label>Terrain<select data-key="terrain">${selectOptions([['','None'],['Grassy','Grassy'],['Electric','Electric'],['Misty','Misty'],['Psychic','Psychic']],state.terrain)}</select></label></div><div class="field-sides">${['Player','Foe'].map((name,side)=>`<div><strong>${name}</strong>${['Reflect','Light Screen','Tailwind','Focus Energy'].map(label=>`<button data-action="field" data-key="${side+label}" class="${state.fields[side+label]?'on':''}">${label}</button>`).join('')}</div>`).join('')}</div></div></details>`;}
function render(){document.documentElement.style.setProperty('--pool-height',Math.max(76,innerHeight-196)+'px');document.getElementById('mock').innerHTML=pools()+`<div class="cards">${card(0)}${card(1)}</div><div class="movesets" id="moves"><section class="moveset">${moveData(0).map((move,index)=>moveRow(move,0,index)).join('')}</section><section class="moveset foe">${moveData(1).map((move,index)=>moveRow(move,1,index)).join('')}</section></div>`+field();}
function changeEditor(side){const value=!state.edit[side];if(wide())state.edit=[value,value];else state.edit[side]=value;}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action,side=Number(button.dataset.side||0),key=button.dataset.key;if(action==='download'){const values=['auto','atk','spa','off'];state.download[side]=values[(values.indexOf(state.download[side])+1)%4];}else if(action==='game-type')state.gameType=button.dataset.value;else if(action==='edit')changeEditor(side);else if(action==='residual'){state.edit[side]=true;if(wide())state.edit=[true,true];}else if(action==='apply-turn')state.hp[side]=Math.max(0,Math.min(identity(side).maxHp,state.hp[side]+(side?18:-5)));else if(action==='move'){if(button.closest('.status'))return;state.opened=state.opened.includes(key)?state.opened.filter(value=>value!==key):[...state.opened,key];}else if(action==='crit')state.crit[key]=!state.crit[key];else if(action==='tag'){const original=moveData(Number(key[0]))[Number(key[2])].tag;if(original==='Hit')state.tags[key]=state.tags[key]==='Hit'?'Off':'Hit';else if(original==='P·A')state.tags[key]=state.tags[key]==='S·I'?'P·A':'S·I';else if(original==='×2')state.tags[key]=state.tags[key]==='H1'?'H2':state.tags[key]==='H2'?'×2':'H1';else if(original==='×3')state.tags[key]=state.tags[key]==='×1'?'×3':'×1';else state.tags[key]=String((Number(state.tags[key]||0)+1)%4);}else if(action==='field'||action==='z')state.fields[(action==='z'?'z:':'')+key]=!state.fields[(action==='z'?'z:':'')+key];else if(action==='reset-card'){state.target[side]='';state.download[side]='auto';state.entryOff[side]=false;state.abilityOn[side]=false;}else if(action==='stage'){button.textContent=String((Number(button.textContent)+1)%7);return;}else if(action==='stat'){button.textContent=button.textContent==='31'?'30':'31';return;}else if(action==='toxic'){button.textContent=String(Number(button.textContent)%15+1);return;}else if(action==='top'){scrollTo(0,0);return;}else if(action==='moves'){document.getElementById('moves').scrollIntoView();return;}else return;render();});
document.addEventListener('change',event=>{const input=event.target,key=input.dataset.key,side=Number(input.dataset.side||0);if(!key)return;const value=input.type==='checkbox'?input.checked:input.value;if(key==='ability'){state.abilities[side]=value;state.abilityOn[side]=false;}else if(['target','download','entryOff','abilityOn'].includes(key))state[key][side]=value;else state[key]=value;render();});
document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('[role=button]')){event.preventDefault();event.target.click();}});
window.setOption=(key,value)=>{if(key==='reset')state=defaults();else if(key==='residual')state.residual=value;else if(key==='preset'){state=defaults();state.preset=value;if(value==='download')state.abilities[0]='Download';if(value==='sword')state.abilities[0]='Intrepid Sword';if(value==='shield')state.abilities[1]='Dauntless Shield';if(value==='rush')state.abilities[0]='Bull Rush';if(value==='form'){state.abilities[0]='Illusion';}if(value==='toxic')state.residual=true;}render();scrollTo(0,0);};
window.mockMeasurements=()=>({width:innerWidth,height:innerHeight,overflow:document.documentElement.scrollWidth>innerWidth,teamTop:document.querySelector('.pools').getBoundingClientRect().top+scrollY,teamHeight:document.querySelector('.pools').offsetHeight,teamList:wide()&&innerHeight>=414,fourthMove:document.querySelector('[data-row="0:3"]').getBoundingClientRect().bottom+scrollY,fieldTop:document.querySelector('.field').getBoundingClientRect().top+scrollY,movesBottom:Math.max(...Array.from(document.querySelectorAll('.moveset')).map(element=>element.getBoundingClientRect().bottom+scrollY)),editors:Array.from(document.querySelectorAll('.editor')).filter(element=>!element.hidden).length});
addEventListener('resize',render);render();
</script></body></html>
