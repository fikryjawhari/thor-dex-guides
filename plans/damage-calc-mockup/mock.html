<script>
const D=/*DATA*/null;
const INV=(()=>{try{return localStorage.getItem('dvkb')==='1'}catch(e){return false}})();
const SPR=D.SPR,byId={},P=D.P,M=D.M,MV=D.MV,AB=D.AB;P.forEach(p=>byId[p.id]=p);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TCOL={normal:'#9fa19f',fire:'#e62829',water:'#2980ef',electric:'#d8b000',grass:'#3fa129',ice:'#3dcef3',fighting:'#ff8000',poison:'#9141cb',ground:'#915121',flying:'#81b9ef',psychic:'#ef4179',bug:'#91a119',rock:'#afa981',ghost:'#704170',dragon:'#5060e1',dark:'#624d4e',steel:'#60a1b8',fairy:'#ef70ef'};
const BT=new Set(['normal','electric','ice','fighting','flying','bug','rock','steel','fairy']);
const tcol=t=>TCOL[(t||'').toLowerCase()]||'#777';
const ty=t=>`<span class="ty${BT.has((t||'').toLowerCase())?' bt':''}" style="background:${tcol(t)}">${esc(t)}</span>`;
const SPRU={};const sprUrl=id=>{if(SPRU[id]!==undefined)return SPRU[id];const d=SPR[id];let u='';if(d){try{const i=d.indexOf(','),b=atob(d.slice(i+1)),a=new Uint8Array(b.length);for(let j=0;j<b.length;j++)a[j]=b.charCodeAt(j);u=URL.createObjectURL(new Blob([a],{type:'image/png'}));}catch(e){u=d;}}return SPRU[id]=u;};
const spr=(id,c)=>{const u=sprUrl(id);if(u)return `<div class="spr ${c}" style="background-image:url(${u})"></div>`;const p=byId[id],t=p?p.t[0]:'',l=p?(p.n.match(/[A-Za-z0-9]/)||['?'])[0].toUpperCase():'?';return `<div class="spr ${c} sprph${BT.has((t||'').toLowerCase())?' bt':''}" style="background:${tcol(t)}"><span>${esc(l)}</span></div>`;};
const SN=['HP','Atk','Def','SpA','SpD','Spe'];
const NAT={Lonely:[1,2],Brave:[1,5],Adamant:[1,3],Naughty:[1,4],Bold:[2,1],Relaxed:[2,5],Impish:[2,3],Lax:[2,4],Timid:[5,1],Hasty:[5,2],Jolly:[5,3],Naive:[5,4],Modest:[3,1],Mild:[3,2],Quiet:[3,5],Rash:[3,4],Calm:[4,1],Gentle:[4,2],Sassy:[4,5],Careful:[4,3]};
const NATS=['Hardy','Docile','Serious','Bashful','Quirky',...Object.keys(NAT)].sort();
function stat(b,i,iv,ev,lv,nat){if(i===0)return b===1?1:Math.floor((2*b+iv+Math.floor(ev/4))*lv/100)+lv+10;let v=Math.floor((2*b+iv+Math.floor(ev/4))*lv/100)+5;const n=NAT[nat];if(n){if(n[0]===i)v=Math.floor(v*1.1);else if(n[1]===i)v=Math.floor(v*0.9);}return v;}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const S=n=>P.find(p=>p.n===n).id,MI=n=>M.indexOf(n);
const $=(s,r)=>(r||document).querySelector(s);
const html=(el,h)=>{el.innerHTML=h;return el;};

/* ---------------- state ---------------- */
const KEY='dcmock1';
const mon=(n,l,na,it,mv,ev)=>{const id=S(n);return {id,l,na,a:byId[id].a[0],i:it,m:mv.map(MI),iv:[31,31,31,31,31,31],ev:ev||[0,0,0,0,0,0],pid:n+na}};
const FILES={
 'Emerald_Imperium.sav':{size:'128 KB',at:'24 Oct 14:02',party:[
  mon('Garchomp',34,'Jolly','Choice Band',['Earthquake','Dragon Claw','Rock Slide','Swords Dance'],[0,252,0,0,4,252]),
  mon('Swampert',34,'Relaxed','Leftovers',['Surf','Earthquake','Ice Beam','Waterfall'],[252,0,252,4,0,0]),
  mon('Gardevoir',33,'Modest','Choice Specs',['Psychic','Moonblast','Shadow Ball','Thunderbolt'],[0,0,0,252,4,252]),
  mon('Lucario',33,'Adamant','Life Orb',['Close Combat','Bullet Punch','Iron Head','Crunch'],[0,252,0,0,4,252]),
  mon('Salamence',34,'Naive','',['Outrage','Flamethrower','Brave Bird','Draco Meteor'],[0,252,0,4,0,252]),
  mon('Charizard',33,'Timid','Expert Belt',['Flare Blitz','Dragon Claw','Aura Sphere','Frost Breath'],[0,0,0,252,4,252])],
  boxes:[[mon('Blaziken',30,'Adamant','',['Flare Blitz','Close Combat','Rock Slide','Swords Dance']),mon('Glaceon',32,'Modest','',['Ice Beam','Blizzard','Shadow Ball','Ice Shard']),mon('Metagross',28,'Jolly','Assault Vest',['Iron Head','Earthquake','Rock Slide','Bullet Punch'])],
         [mon('Flygon',31,'Naive','',['Earthquake','Dragon Claw','Brave Bird','Rock Slide']),mon('Salamence',22,'Hasty','',['Outrage','Flamethrower','Brave Bird','Draco Meteor'])]]},
 'Emerald_Imperium_2.sav':{size:'128 KB',at:'24 Oct 16:40',party:null},
 'Platinum.sav':{size:'512 KB',err:['Wrong game','This is a Pokémon Platinum save (Nintendo DS), not Emerald Imperium (GBA).']},
 'Emerald_Imperium.ss1':{size:'403 KB',err:['Save state','This is an emulator save state, not a battery save. Pick the .sav file.']},
 'corrupt.sav':{size:'128 KB',err:['Unreadable','Both save slots fail their checksum. Save again in the game and retry.']},
 'new_game.sav':{size:'128 KB',err:['No Pokémon yet','This save has no party. Get your starter and save first.']}};
(()=>{const a=FILES['Emerald_Imperium.sav'],b=FILES['Emerald_Imperium_2.sav'];const q=a.party.map(m=>({...m}));q[0].l=35;q[5]=mon('Glaceon',33,'Modest','',['Ice Beam','Blizzard','Shadow Ball','Ice Shard']);b.party=q;b.boxes=[[a.party[5],...a.boxes[0].slice(0,2)],a.boxes[1]];})();
const WATT=D.TR.find(t=>t.n==='Wattson').k;
const REL=D.TR.find(t=>t.g.includes('Cap 34')&&t.p.some(x=>x.l==null)&&t.p.length>=4);
function defaults(){return {dir:'out',mine:{src:'party',b:0,i:0},foe:{k:(REL||{k:WATT}).k,i:0},field:{w:'',t:'',crit:0,ref:0,ls:0},cap:{},custom:[],imp:null,edits:{},recent:[],pk:{id:S('Garchomp'),l:50,na:'Jolly',iv:[31,31,31,31,31,31],ev:[0,252,0,0,4,252]},tab:'party'};}
let ST;try{ST=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
if(!ST){ST=defaults();ST.imp=importOf('Emerald_Imperium.sav');}
function importOf(f){const F=FILES[f];return {file:f,size:F.size,at:F.at,party:F.party,boxes:F.boxes};}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};

/* ---------------- trainers, sets, derived mons ---------------- */
const trByK={};D.TR.forEach(t=>trByK[t.k]=t);
const isRel=t=>t.p.some(x=>x.l==null);
const capDef=t=>t.cap||0;
const capOf=t=>+ST.cap[t.k]||capDef(t);
const monLv=(x,cap)=>x.l!=null?x.l:x.r!=null&&cap?cap+x.r:NaN;
function curMine(){const imp=ST.imp,m=ST.mine;if(m.src==='party'&&imp&&imp.party)return imp.party[m.i]||null;if(m.src==='box'&&imp&&imp.boxes&&imp.boxes[m.b])return imp.boxes[m.b][m.i]||null;if(m.src==='custom')return ST.custom[m.i]||null;return null;}
const mineKey=()=>{const m=ST.mine;return m.src==='custom'?null:'mine:'+(curMine()||{}).pid;};
function applyEdits(base,key){const e=key&&ST.edits[key];return e?{...base,...e,edited:true}:{...base};}
function mineMon(){const b=curMine();return b?applyEdits(b,mineKey()):null;}
function foeBase(t,i){const x=t.p[i];if(!x)return null;const p=byId[x.id];const cap=capOf(t),l=monLv(x,cap);
 return {id:x.id,l,na:x.na||'Hardy',a:x.a!=null?x.a:p.a[0],aGuess:x.a==null,i:x.i||'',m:(x.m||[]).slice(),iv:x.iv,ev:x.ev,foe:true};}
function foeMon(){const t=trByK[ST.foe.k];if(!t)return null;const b=foeBase(t,ST.foe.i);return b?applyEdits(b,'foe:'+t.k+':'+ST.foe.i):null;}
function resolve(m){const p=byId[m.id],l=isNaN(m.l)?null:m.l;const st=l==null?null:SN.map((n,i)=>stat(p.s[i],i,m.iv[i],m.ev[i],l,m.na));
 return {...m,p,name:p.n,types:p.t,lv:l,stats:st,abil:AB[m.a]||'',stg:m.stg||[0,0,0,0,0],status:m.status||'',hpp:m.hpp==null?100:m.hpp};}

/* ---------------- damage (rough stand-in) ---------------- */
const stageMul=s=>s>=0?(2+s)/2:2/(2-s);
const IMM={Levitate:'Ground','Flash Fire':'Fire','Water Absorb':'Water','Volt Absorb':'Electric','Storm Drain':'Water'};
function typeEff(mt,defTypes){let e=1;for(const t of defTypes){const v=D.TC[mt]?.[t];e*=(v==null?10:v)/10;}return e;}
function damage(A,B,mi,F){const mv=MV[mi];if(!mv||!mv.bp)return null;if(A.lv==null||B.lv==null)return {unk:1};
 const phys=mv.c==='Physical',ai=phys?1:3,di=phys?2:4;
 let at=A.stats[ai]*stageMul(A.stg[phys?0:2]),df=B.stats[di]*stageMul(B.stg[phys?1:3]);
 if(F.crit){if(A.stg[phys?0:2]<0)at=A.stats[ai];if(B.stg[phys?1:3]>0)df=B.stats[di];}
 const notes=[];let e=typeEff(mv.t,B.types);const im=IMM[B.abil];if(im&&im===mv.t){e=0;notes.push(B.abil);}
 const hpMax=B.stats[0];
 if(e===0)return {rolls:new Array(16).fill(0),hp:hpMax,min:0,max:0,e,notes};
 let base=Math.floor(Math.floor(Math.floor(2*A.lv/5+2)*mv.bp*at/df)/50)+2;
 if(F.w==='Sun'||F.w==='Rain'){const up=(F.w==='Sun')===(mv.t==='Fire')&&(mv.t==='Fire'||mv.t==='Water'),dn=(F.w==='Sun'&&mv.t==='Water')||(F.w==='Rain'&&mv.t==='Fire');if(up){base=Math.floor(base*1.5);notes.push(F.w);}else if(dn){base=Math.floor(base*.5);notes.push(F.w);}}

  if(!F.crit&&((phys&&F.ref)||(!phys&&F.ls)))x=Math.floor(x/2);x=Math.floor(x*ib);rolls.push(Math.max(1,x));}
 if(A.status==='Burn'&&phys)notes.push('Burn');if(!F.crit&&((phys&&F.ref)||(!phys&&F.ls)))notes.push(phys?'Reflect':'Light Screen');

function koOf(rolls,hp){let dist=new Map([[0,1]]);for(let n=1;n<=4;n++){const nd=new Map();for(const [s,c] of dist)for(const r of rolls)nd.set(s+r,(nd.get(s+r)||0)+c);dist=nd;

  if(!this.el){this.el=document.createElement('div');this.el.className='kb';document.body.appendChild(this.el);this.el.addEventListener('click',e=>{const b=e.target.closest('.k');if(b)this.key(b.dataset.c,b.dataset.a);});}

  if(F.err){BAN={ok:0,h:F.err[0],t:F.err[1]};}
  else{const had=!!ST.imp;ST.imp=importOf(f);ST.tab='party';const n=F.boxes.reduce((a,b)=>a+b.length,0);
   if(ST.mine.src!=='custom'||!had){ST.mine={src:'party',b:0,i:Math.min(ST.mine.i||0,F.party.length-1)};}
   BAN={ok:1,h:'Imported',t:`${F.party.length} in the party, ${n} in boxes.`};save();}
  if(SHEETS.length===0){SHEETS.push(mineSheet());}
  SH.redraw();refreshMainOnly();});}});}
/* -- New Pokémon -- */
function defMoves(p,l){const m=(p.lv||[]).filter(x=>x[0]<=l).map(x=>x[1]);return [...new Set(m)].slice(-4);}
function newMon(){picker({title:'New Pokémon',items:P.map(p=>({label:p.n,sub:p.t.join(' / '),id:p.id,v:p.id})),onPick:id=>{const p=byId[id];let l=50;try{l=capOf(trByK[ST.foe.k])||50}catch(e){}
  const m={id,l,na:'Hardy',a:p.a[0],i:'',m:defMoves(p,l),iv:[31,31,31,31,31,31],ev:[0,0,0,0,0,0],pid:'c'+Date.now()};ST.custom.push(m);ST.mine={src:'custom',b:0,i:ST.custom.length-1};ST.tab='custom';save();
  SHEETS.length=0;KB.close();SH.redraw();refreshMainOnly();SH.edit('mine');}});}
/* -- Foe sheet -- */
const trCap=t=>t.cap?'Cap '+t.cap:'';
function trRow(t,sel){return `<button class="mrow ${sel?'sel':''}" data-s="pickfoe" data-k="${t.k}"><span class="tx"><b>${esc(t.n)}</b><small>${esc([t.loc,trCap(t)].filter(Boolean).join(' · '))}</small><span class="mini">${t.p.map(x=>spr(x.id,'s24')).join('')}</span></span></button>`;}
function foeSheet(){return {title:()=>'Foe',
 body(){const groups=[];D.TR.forEach(t=>{let g=groups[groups.length-1];if(!g||g.n!==t.g){g={n:t.g,t:[]};groups.push(g);}g.t.push(t);});
  const rec=ST.recent.map(k=>trByK[k]).filter(Boolean);
  return `<button class="fbtn" data-s="findtr"><span>Find trainer…</span></button>`+(rec.length?`<div class="sec2">Recent</div>`+rec.map(t=>trRow(t,t.k===ST.foe.k)).join(''):'')+`<div class="sec2">All trainers</div>`+
   groups.map(g=>`<details class="grp" ${g.t.some(t=>t.k===ST.foe.k)?'open':''}><summary>${esc(g.n)} <span class="mut small">${g.t.length}</span></summary><div class="gb">${g.t.map(t=>trRow(t,t.k===ST.foe.k)).join('')}</div></details>`).join('');},
 bind(d){d.querySelectorAll('[data-s="pickfoe"]').forEach(x=>x.onclick=()=>pickFoe(x.dataset.k));
  const f=$('[data-s="findtr"]',d);if(f)f.onclick=()=>picker({title:'Find trainer',items:D.TR.map(t=>({label:t.n,sub:[t.loc,trCap(t),t.g.replace(/ Split.*/,'')].filter(Boolean).join(' · '),id:t.p[0].id,v:t.k})),onPick:pickFoe});}};}
function pickFoe(k){ST.foe={k,i:0};recent(k);save();SHEETS.length=0;KB.close();SH.redraw();refreshMainOnly();}
/* -- generic picker (species, move, item, trainer) with search -- */
function picker({title,items,onPick,none}){let q='';
 const s={title:()=>title,
  body(){return `<div class="fl"></div>`;},
  bind(d){const body=$('.shb',d),hd=$('.shh',d);
   const box=document.createElement('div');box.className='kbsh';
   box.innerHTML=INV?`<div class="disp2"><span class="q" data-ph="Search"></span><button class="x" aria-label="Clear">×</button></div>`:`<input type="search" placeholder="Search" autocomplete="off">`;
   hd.insertBefore(box,$('.tt',hd));$('.tt',hd).style.display='none';
   const paint=()=>{const n=norm(q);let L=items;if(n){L=items.filter(it=>norm(it.label).includes(n)).sort((a,b)=>(norm(b.label).startsWith(n)-norm(a.label).startsWith(n))||a.label.length-b.label.length);}
    const tot=L.length;L=L.slice(0,60);body.innerHTML=(none?`<button class="mrow" data-n="1"><span class="tx"><b>${esc(none)}</b></span></button>`:'')+L.map((it,i)=>`<button class="mrow" data-i="${i}">${it.id?spr(it.id,'s32'):''}<span class="tx"><b>${esc(it.label)}</b>${it.sub?`<small>${esc(it.sub)}</small>`:''}</span></button>`).join('')+(tot>60?`<div class="dnote">${tot-60} more · keep typing</div>`:'')+(!tot?'<div class="dnote">No match</div>':'');
    body.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{const it=L[+x.dataset.i];KB.close();SHEETS.pop();SH.redraw();onPick(it.v);});
    const nn=$('[data-n]',body);if(nn)nn.onclick=()=>{KB.close();SHEETS.pop();SH.redraw();onPick(null);};};
   const upd=()=>{const e=$('.q',box);if(e)e.textContent=q;paint();};
   if(INV){KB.open({mode:'text',value:'',input:v=>{q=v;upd();},done:()=>{}});$('.x',box).onclick=()=>{q='';KB.buf='';KB.show();upd();};}
   else{const inp=$('input',box);inp.oninput=()=>{q=inp.value;paint();};setTimeout(()=>inp.focus(),30);}
   paint();}};
 pushSheet(s);}

/* -- Edit sheet -- */
function editSheet(side){const isM=side==='mine';
 const key=()=>isM?mineKey():'foe:'+ST.foe.k+':'+ST.foe.i;
 const base=()=>isM?curMine():foeBase(trByK[ST.foe.k],ST.foe.i);
 const cur=()=>{const b=base();if(!b)return null;if(isM&&ST.mine.src==='custom')return b;return applyEdits(b,key());};
 const setF=(f,v)=>{if(isM&&ST.mine.src==='custom'){curMine()[f]=v;}else{const k=key();(ST.edits[k]=ST.edits[k]||{})[f]=v;}save();};
 return {title:()=>{const m=cur();return m?byId[m.id].n+(m.edited?' *':''):'Edit';},
 actions(){const m=cur();if(isM&&ST.mine.src==='custom')return `<button class="ac" data-e="del">Delete</button>`;if(m&&m.edited)return `<button class="ac" data-e="reset">Reset</button>`;if(isM&&ST.mine.src!=='custom')return `<button class="ac" data-e="fork">Save copy</button>`;return '';},
 body(){const m=cur();if(!m)return '';const p=byId[m.id],r=resolve(m);const lvKnown=!isNaN(m.l);
  const abils=[...new Set([...p.a,...(p.ha!=null?[p.ha]:[])])];
  const mv=[0,1,2,3].map(i=>{const x=m.m[i];return `<button class="fbtn ${x==null?'empty':''}" data-e="mv" data-i="${i}">${x==null?'<span>Move '+(i+1)+'</span>':`<span>${ty(MV[x].t)}</span><span>${esc(M[x])}</span><span class="mut small" style="margin-left:auto">${MV[x].bp||'—'}</span>`}</button>`}).join('');
  const nbx=(a,v,o)=>nb(a,v,o);
  return `<button class="fbtn" data-e="sp">${spr(m.id,'s28')}<span>${esc(p.n)}</span><span class="ar">▾</span></button>
  <div class="frow"><span>Level</span>${nbx('data-e="lv"',lvKnown?m.l:'',{min:1,max:100,steppers:true,label:'Level',ph:'?'})}
   <select class="grow" data-e="na" style="height:42px">${NATS.map(n=>`<option ${n===m.na?'selected':''}>${n}</option>`).join('')}</select></div>
  <div class="frow"><span>Ability</span><select class="grow" data-e="ab" style="height:42px">${abils.map(a=>`<option value="${a}" ${a===m.a?'selected':''}>${esc(AB[a])}${m.aGuess&&a===m.a?' ?':''}</option>`).join('')}</select></div>
  <div class="frow"><span>Item</span><button class="fbtn grow ${m.i?'':'empty'}" data-e="it"><span>${esc(m.i||'None')}</span><span class="ar">▾</span></button></div>
  <div class="sec2">Moves</div>${mv}
  <div class="sec2">Stats</div><table class="stt"><tr><th class="l"></th>${SN.map(n=>`<th>${n}</th>`).join('')}</tr>
   <tr><td class="l">IV</td>${SN.map((n,i)=>`<td>${nbx(`data-e="iv" data-x="${i}"`,m.iv[i],{min:0,max:31,label:'IV '+n})}</td>`).join('')}</tr>
   <tr><td class="l">EV</td>${SN.map((n,i)=>`<td>${nbx(`data-e="ev" data-x="${i}"`,m.ev[i],{min:0,max:252,step:4,label:'EV '+n})}</td>`).join('')}</tr>
   <tr><td class="l">Stat</td>${SN.map((n,i)=>`<td><b>${r.stats?r.stats[i]:'?'}</b></td>`).join('')}</tr>
   <tr><td class="l">Stage</td><td></td>${[0,1,2,3,4].map(i=>`<td>${nbx(`data-e="stg" data-x="${i}"`,(m.stg||[0,0,0,0,0])[i],{min:-6,max:6,label:'Stage '+SN[i+1]})}</td>`).join('')}</tr></table>
  <div class="frow"><span>Status</span><select class="grow" data-e="status" style="height:42px">${['','Burn','Paralysis','Poison','Sleep'].map(x=>`<option value="${x}" ${(m.status||'')===x?'selected':''}>${x||'None'}</option>`).join('')}</select><span style="width:auto">HP %</span>${nbx('data-e="hpp"',m.hpp==null?100:m.hpp,{min:1,max:100,label:'HP %'})}</div>`;},
 bind(d){const m=cur();if(!m)return;const rp=()=>{repaintKeep();refreshMainOnly();};
  const num=(sel,fn)=>d.querySelectorAll(sel).forEach(i=>i.onchange=()=>fn(i,parseInt(i.value)));
  num('[data-e=lv]',(i,v)=>{if(v>0)setF('l',Math.min(100,v));rp();});
  num('[data-e=iv]',(i,v)=>{const a=cur().iv.slice();a[+i.dataset.x]=Math.max(0,Math.min(31,v||0));setF('iv',a);rp();});
  num('[data-e=ev]',(i,v)=>{const a=cur().ev.slice();a[+i.dataset.x]=Math.max(0,Math.min(252,v||0));setF('ev',a);rp();});
  num('[data-e=stg]',(i,v)=>{const a=(cur().stg||[0,0,0,0,0]).slice();a[+i.dataset.x]=Math.max(-6,Math.min(6,v||0));setF('stg',a);rp();});
  num('[data-e=hpp]',(i,v)=>{setF('hpp',Math.max(1,Math.min(100,v||100)));rp();});
  const sel=(s,f,cv)=>{const e=$(s,d);if(e)e.onchange=()=>{setF(f,cv?cv(e.value):e.value);rp();};};
  sel('[data-e=na]','na');sel('[data-e=ab]','a',v=>+v);sel('[data-e=status]','status');
  d.querySelectorAll('[data-e=mv]').forEach(b=>b.onclick=()=>picker({title:'Move '+(+b.dataset.i+1),none:'(empty)',items:M.map((n,i)=>({label:n,sub:MV[i].t+' · '+MV[i].c+' · '+(MV[i].bp||'—'),v:i})),onPick:v=>{const a=cur().m.slice();if(v==null)a.splice(+b.dataset.i,1);else a[+b.dataset.i]=v;setF('m',a.filter(x=>x!=null));rp();}}));
  const it=$('[data-e=it]',d);if(it)it.onclick=()=>picker({title:'Item',none:'None',items:D.IT.map(n=>({label:n,v:n})),onPick:v=>{setF('i',v||'');rp();}});
  const sp=$('[data-e=sp]',d);if(sp)sp.onclick=()=>picker({title:'Species',items:P.map(p=>({label:p.n,sub:p.t.join(' / '),id:p.id,v:p.id})),onPick:v=>{setF('id',v);setF('a',byId[v].a[0]);rp();}});
  const del=$('[data-e=del]',d),rs=$('[data-e=reset]',d),fk=$('[data-e=fork]',d);
  if(del)del.onclick=()=>{ST.custom.splice(ST.mine.i,1);ST.mine={src:'party',b:0,i:0};save();SHEETS.length=0;KB.close();SH.redraw();refreshMainOnly();};
  if(rs)rs.onclick=()=>{delete ST.edits[key()];save();rp();};
  if(fk)fk.onclick=()=>{const c={...cur(),pid:'c'+Date.now()};delete c.edited;ST.custom.push(c);save();BAN={ok:1,h:'Saved',t:'Copy added to Custom.'};rp();};}};}
function repaintKeep(){repaint();}

/* ---------------- entry points: trainer card, Pokémon page ---------------- */
let TK=null,TI=0;
function trainerPage(){const t=trByK[TK]||trByK[ST.foe.k];TK=t.k;if(TI>=t.p.length)TI=0;const cap=capOf(t),own=+ST.cap[t.k]>0,rel=isRel(t);const x=foeBase(t,TI);const r=resolve(x);
 html($('#app'),`<div class="card trc" style="margin:0"><div class="trn"><b>${esc(t.n)}</b> <span class="mut small">${esc(t.loc)}</span></div>
  ${rel?`<div class="frow"><span class="mut" style="width:auto;font-size:12px">Level cap</span><span class="dcap ${own?'own':''} ${cap?'':'need'}">${nb(`data-cap="${t.k}"`,own?ST.cap[t.k]:'',{min:1,max:100,label:'Level cap',ph:capDef(t)||'?'})}</span></div>`:''}
  <div class="dstrip" style="margin:4px 0">${t.p.map((p,i)=>`<button data-a="tmon" data-i="${i}" class="${i===TI?'on':''}">${spr(p.id,'s28')}<span>${isNaN(monLv(p,cap))?'?':monLv(p,cap)}</span></button>`).join('')}</div>
  <div style="font-weight:700">${esc(r.name)} <span class="mut small">Lv ${r.lv??'?'}</span></div><div class="small mut">${esc([AB[x.a],x.i,x.na].filter(Boolean).join(' · '))}</div>
  <div class="small" style="margin-top:2px">${x.m.map(i=>esc(M[i])).join(' · ')||'<span class="mut">No moves listed</span>'}</div>
  <div style="margin-top:6px"><button class="dbtn pri" data-a="tcalc" style="width:100%">Calc vs ${esc(r.name)} ▸</button></div></div>`);bindCap();}
function pokePage(){const k=ST.pk,p=byId[k.id];const L=k.l;
 html($('#app'),`<div class="card" style="margin:0"><div class="pkh">${spr(p.id,'s56')}<div><h2>${esc(p.n)}</h2>${p.t.map(ty).join('')}</div></div></div>
 <div class="card calc" style="margin:0"><h3>Stat calculator</h3><div class="frow"><span style="width:auto">Level</span>${nb('data-pk="l"',L,{min:1,max:100,steppers:true,label:'Level'})}<select data-pk="na" class="grow" style="height:40px;min-width:0">${NATS.map(n=>`<option ${n===k.na?'selected':''}>${n}</option>`).join('')}</select></div>
 <div style="overflow-x:auto"><table class="stt"><tr><th class="l"></th>${SN.map(n=>`<th>${n}</th>`).join('')}</tr><tr><td class="l">Stat</td>${SN.map((n,i)=>`<td><b>${stat(p.s[i],i,k.iv[i],k.ev[i],L,k.na)}</b></td>`).join('')}</tr></table></div>
 <div style="margin-top:8px"><button class="dbtn pri" data-a="usecalc" style="width:100%">Use in calc ▸</button></div></div>`);
 document.querySelectorAll('[data-pk]').forEach(e=>e.onchange=()=>{ST.pk[e.dataset.pk]=e.dataset.pk==='l'?Math.max(1,Math.min(100,parseInt(e.value)||1)):e.value;save();pokePage();});}
function useInCalc(){const k=ST.pk,p=byId[k.id];ST.custom.push({id:k.id,l:k.l,na:k.na,a:p.a[0],i:'',m:defMoves(p,k.l),iv:k.iv.slice(),ev:k.ev.slice(),pid:'c'+Date.now()});ST.mine={src:'custom',b:0,i:ST.custom.length-1};ST.tab='custom';save();go('#/calc');}

/* ---------------- panel hooks (Thor frame) ---------------- */
window.setOption=(n,v)=>{
 if(n==='state'){if(v==='fresh'){ST.imp=null;ST.mine={src:'party',b:0,i:0};ST.custom=[];ST.edits={};}else{ST.imp=importOf('Emerald_Imperium.sav');ST.mine={src:'party',b:0,i:0};}BAN=null;}
 if(n==='foe'){const t=v==='fixed'?trByK[WATT]:v==='rel'?REL:v==='unknown'?trByK['x.1']:v==='hot'?D.TR.find(t=>t.g.startsWith('Hot House')&&t.p.length>=3):null;if(t)ST.foe={k:t.k,i:0};}
 if(n==='dir')ST.dir=v;
 if(n==='page'){go(v==='tr'?'#/tr':v==='p'?'#/p':'#/calc');return;}
 save();closeAll();route();};
if(!location.hash)history.replaceState(null,'','#/calc');
route();
</script></body></html>
