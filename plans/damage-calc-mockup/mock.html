<style>
/*CSS*/
/* ---- mockup-only: the calc page (class names dc*) ---- */
main#app{padding-bottom:70px}
.dside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px 4px 4px;display:flex;flex-direction:column;gap:2px}

.dempty{display:grid;grid-template-columns:1fr 1fr;gap:4px}

  <div class="dtg"><button data-f="ref" aria-pressed="${!!F.ref}">Reflect</button><button data-f="ls" aria-pressed="${!!F.ls}">Light Scr.</button></div></div></details>`);
 bindCap();bindMain();bindEd();}
function bindMain(){document.querySelectorAll('[data-lv],[data-hp]').forEach(i=>{if(i.dataset.b)return;i.dataset.b=1;i.onchange=()=>{const side=i.dataset.lv||i.dataset.hp,f=i.dataset.lv?'l':'hp';const v=parseInt(i.value);if(isNaN(v))return;
  setField(side,f,f==='l'?Math.max(1,Math.min(100,v)):Math.max(0,v));refresh();};});
 document.querySelectorAll('[data-mo]').forEach(i=>{if(i.dataset.b)return;i.dataset.b=1;i.onchange=()=>{const mi=+i.dataset.mi,k=i.dataset.mo;
  const ck=i.dataset.ck;if(k==='t'){(ST.mvo[ck]=ST.mvo[ck]||{}).t=i.value;}else if(k==='bp'){const v=parseInt(i.value);(ST.mvo[ck]=ST.mvo[ck]||{}).bp=isNaN(v)?undefined:v;}else if(k==='hits'){ST.hits[ck]=parseInt(i.value)||1;}
  save();refresh();};});}
function bindEd(){document.querySelectorAll('[data-e]').forEach(i=>{if(i.dataset.b)return;i.dataset.b=1;i.onchange=()=>{const side=i.dataset.s,k=i.dataset.e,m=getMon(side);
  if(k==='na')setField(side,'na',i.value);else if(k==='ab')setField(side,'a',+i.value);else if(k==='it')setField(side,'i',i.value);else if(k==='status')setField(side,'status',i.value);
  else if(k==='iv'||k==='ev'){const a=m[k].slice(),v=parseInt(i.value)||0;a[+i.dataset.x]=Math.max(0,Math.min(k==='iv'?31:252,v));setField(side,k,a);}
  refresh();};});}
function bindCap(root){(root||document).querySelectorAll('[data-cap]').forEach(i=>{if(i.dataset.b)return;i.dataset.b=1;i.onchange=()=>{const v=parseInt(i.value);const t=trByK[i.dataset.cap];if(v>0&&v<=100&&v!==t.cap)ST.cap[t.k]=v;else delete ST.cap[t.k];save();refresh();};});}
function setMove(side,slot,mi){const ck=sideInfo(side).key+':'+slot;delete ST.crit[ck];delete ST.hits[ck];delete ST.mvo[ck];const arr=getMon(side).m.slice();if(mi==null)arr.splice(slot,1);else arr[slot]=mi;setField(side,'m',arr.filter(x=>x!=null));}
function pickMove(side,slot){picker({title:'Move '+(slot+1),items:M.map((n,i)=>({label:n,sub:MV[i].t+' · '+MV[i].c+' · '+(MV[i].bp||'—'),v:i})),onPick:v=>{setMove(side,slot,v);refreshMainOnly();}});}
const refresh=()=>{const y=scrollY;route2();scrollTo(0,y);};
function route2(){const h=location.hash||'#/calc';if(h.startsWith('#/tr'))trainerPage();else if(h.startsWith('#/p'))pokePage();else calcPage();SH.redraw();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a],[data-f]');if(!el||!el.closest('#app'))return;
 const a=el.dataset.a;
 if(el.dataset.f&&el.tagName==='BUTTON'){const k=el.dataset.f;ST.field[k]=ST.field[k]?0:1;window.__fo=1;save();refresh();return;}
 if(a==='row'&&e.target.closest('.dd'))return;
 if(a==='mpick'){ST.mine={src:el.dataset.src,b:+el.dataset.b,i:+el.dataset.i};save();refresh();}
 else if(a==='fpick'){ST.foe.i=+el.dataset.i;save();refresh();}
 else if(a==='sel'){if(e.target.closest('input,select,.nv,.num,.ed,.stb,.mg,.hpl'))return;ST.dir=el.dataset.s==='mine'?'out':'in';save();refresh();}
 else if(a==='row'){const ck=el.dataset.ck;ROWOPEN.has(ck)?ROWOPEN.delete(ck):ROWOPEN.add(ck);el.closest('.mr').classList.toggle('open');}
 else if(a==='crit'){const ck=el.dataset.ck;ST.crit[ck]=ST.crit[ck]?0:1;save();refresh();}
 else if(a==='hits'){const mi=+el.dataset.mi,ck=el.dataset.ck,m=MH[mi],n=hitsOf(mi,ck);ST.hits[ck]=n>=m[1]?m[0]:n+1;save();refresh();}
 else if(a==='sub'){const side=ST.dir==='out'?'foe':'mine',r=resolve(getMon(side));setField(side,'hp',Math.max(0,r.hp-(+el.dataset.v)));refresh();}
 else if(a==='hpfull'){setField(el.dataset.s,'hp',undefined);refresh();}
 else if(a==='eopen'){EDITOPEN[el.dataset.s]=!EDITOPEN[el.dataset.s];refresh();}
 else if(a==='mega'){megaToggle(el.dataset.s);refresh();}
 else if(a==='esave'){const k=sideInfo(el.dataset.s).key;ST.saved=ST.saved||{};ST.saved[k]={...ST.saved[k],...ST.edits[k]};delete ST.edits[k];save();refresh();}
 else if(a==='ereset'){const k=sideInfo(el.dataset.s).key;if(ST.edits[k]&&Object.keys(ST.edits[k]).length)delete ST.edits[k];else if(ST.saved&&ST.saved[k])delete ST.saved[k];save();refresh();}
 else if(a==='edel'){ST.custom.splice(ST.mine.i,1);ST.mine={src:'party',b:0,i:0};EDITOPEN.mine=false;save();refresh();}
 else if(a==='smode'){SMODE=SMODE==='+'?'-':'+';refresh();}
 else if(a==='sstep'){const side=el.dataset.s,x=+el.dataset.x,arr=resolve(getMon(side)).stg.slice();arr[x]=Math.max(-6,Math.min(6,arr[x]+(SMODE==='+'?1:-1)));setField(side,'stg',arr);refresh();}
 else if(a==='sreset'){setField(el.dataset.s,'stg',undefined);refresh();}
 else if(a==='chmv'||a==='addmv'){pickMove(el.dataset.side,+el.dataset.slot);}
 else if(a==='mvreset'){delete ST.mvo[el.dataset.ck];save();refresh();}
 else if(a==='tprev'||a==='tnext'){const ti=D.TR.findIndex(x=>x.k===ST.foe.k)+(a==='tnext'?1:-1);if(D.TR[ti]){ST.foe={k:D.TR[ti].k,i:0};recent(D.TR[ti].k);save();refresh();}}
 else if(a==='bandis'){BAN=null;refresh();}
 else if(a==='foesheet'){SH.foe();}
 else if(a==='import'){startImport();}else if(a==='newmon'){newMon();}
 else if(a==='findmine'){findMine();}
 else if(a==='tmon'){TI=+el.dataset.i;trainerPage();}
 else if(a==='tcalc'){ST.foe={k:TK,i:TI};ST.dir='out';recent(TK);save();go('#/calc');}
 else if(a==='usecalc'){useInCalc();}
});
function findMine(){const L=mineList();picker({title:'Find yours',items:L.map(x=>({label:byId[x.m.id].n,sub:(x.src==='party'?'Party':x.src==='box'?'Box '+(x.b+1):'Custom')+' · Lv '+x.m.l,id:x.m.id,v:x})),onPick:x=>{ST.mine={src:x.src,b:x.b,i:x.i};save();refreshMainOnly();}});}
document.addEventListener('change',e=>{const s=e.target.closest('select[data-f]');if(s){ST.field[s.dataset.f]=s.value;window.__fo=1;save();refresh();}});
document.addEventListener('toggle',e=>{if(e.target.matches('details.dfield'))window.__fo=e.target.open;},true);
const recent=k=>{ST.recent=[k,...ST.recent.filter(x=>x!==k)].slice(0,6);};

/* ---------------- sheets ---------------- */
const SHEETS=[];
function closeAll(){SHEETS.length=0;KB.close();html($('#sheets'),'');}
function pushSheet(s){SHEETS.push(s);SH.redraw();}
function popSheet(){KB.close();SHEETS.pop();SH.redraw();}
const SH={redraw(){const host=$('#sheets');if(!SHEETS.length){host.innerHTML='';return;}
  host.innerHTML='';SHEETS.forEach((s,i)=>{const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div class="shh"><button class="bk" data-s="back">‹ ${i?'Back':'Done'}</button><div class="tt">${esc(s.title())}</div>${s.actions?s.actions():''}</div><div class="shb">${s.body()}</div>`;host.appendChild(d);if(s.bind)s.bind(d);});
  host.querySelectorAll('[data-s="back"]').forEach(b=>b.onclick=()=>{popSheet();refreshMainOnly();});},
 foe(){pushSheet(foeSheet());}};
function refreshMainOnly(){const h=location.hash||'#/calc';if(h.startsWith('#/tr'))trainerPage();else if(h.startsWith('#/p'))pokePage();else calcPage();}
/* a sheet's body repaint without losing scroll */
function repaint(){const b=$('#sheets .sheet:last-child .shb');const y=b?b.scrollTop:0;SH.redraw();const b2=$('#sheets .sheet:last-child .shb');if(b2)b2.scrollTop=y;}

/* -- rows -- */
function monRow(m,sel,attrs){const p=byId[m.id];return `<div role="button" tabindex="0" class="mrow ${sel?'sel':''}" ${attrs}>${spr(m.id,'s32')}<span class="tx"><b>${esc(p.n)}</b><small>${esc([m.na,m.i,AB[m.a]].filter(Boolean).join(' · '))}</small></span><span class="lv">Lv ${m.l}</span></div>`;}
/* -- Import (fake system picker) -- */
function startImport(){pushSheet({title:()=>'Choose a file',body(){return `<div class="dfake"><div class="mut small" style="padding:2px 4px 6px;font-size:11px">Android file picker (stand-in)</div>${Object.entries(FILES).map(([f,F])=>`<div role="button" tabindex="0" class="mrow" data-file="${esc(f)}"><span class="tx"><b>${esc(f)}</b><small>${F.size}</small></span></div>`).join('')}</div>`;},
 bind(d){d.querySelectorAll('[data-file]').forEach(x=>x.onclick=()=>{const f=x.dataset.file,F=FILES[f];SHEETS.length=0;KB.close();
  if(F.err){BAN={ok:0,h:F.err[0],t:F.err[1]};}
  else{const ed=Object.keys(ST.edits).concat(Object.keys(ST.saved||{})).filter(k=>k.startsWith('mine:'));ed.forEach(k=>{delete ST.edits[k];delete (ST.saved||{})[k];});ST.imp=importOf(f);if(ST.mine.src!=='custom')ST.mine={src:'party',b:0,i:0};
   BAN={ok:1,h:'Imported '+f,t:`${F.party.length} in the party, ${F.boxes.reduce((a,b)=>a+b.length,0)} in boxes.`+(ed.length?` ${ed.length} edited reset to the save.`:'')};save();}
  SH.redraw();refreshMainOnly();});}});}
/* -- New Pokémon -- */
function defMoves(p,l){const m=(p.lv||[]).filter(x=>x[0]<=l).map(x=>x[1]);return [...new Set(m)].slice(-4);}
function newMon(){picker({title:'New Pokémon',items:P.map(p=>({label:p.n,sub:p.t.join(' / '),id:p.id,v:p.id})),onPick:id=>{const p=byId[id];let l=50;try{l=capOf(trByK[ST.foe.k])||50}catch(e){}
  const m={id,l,na:'Hardy',a:p.a[0],i:'',m:defMoves(p,l),iv:[31,31,31,31,31,31],ev:[0,0,0,0,0,0],pid:'c'+Date.now()};ST.custom.push(m);ST.mine={src:'custom',b:0,i:ST.custom.length-1};save();
  SHEETS.length=0;KB.close();SH.redraw();EDITOPEN.mine=true;refreshMainOnly();}});}
/* -- Foe sheet -- */
const trCap=t=>t.cap?'Cap '+t.cap:'';
function trRow(t,sel){return `<div role="button" tabindex="0" class="mrow ${sel?'sel':''}" data-s="pickfoe" data-k="${t.k}"><span class="tx"><b>${esc(t.n)}</b><small>${esc([t.loc,trCap(t)].filter(Boolean).join(' · '))}</small><span class="mini">${t.p.map(x=>spr(x.id,'s24')).join('')}</span></span></div>`;}
function foeSheet(){return {title:()=>'Foe',
 body(){const groups=[];D.TR.forEach(t=>{let g=groups[groups.length-1];if(!g||g.n!==t.g){g={n:t.g,t:[]};groups.push(g);}g.t.push(t);});
  const rec=ST.recent.map(k=>trByK[k]).filter(Boolean);
  return `<div role="button" tabindex="0" class="fbtn" data-s="findtr"><span>Find trainer…</span></div>`+(trByK[ST.foe.k]?trRow(trByK[ST.foe.k],true):'')+(rec.length?`<div class="sec2">Recent</div>`+rec.map(t=>trRow(t,t.k===ST.foe.k)).join(''):'')+`<div class="sec2">All trainers</div>`+
   groups.map(g=>`<details class="grp" ${g.t.some(t=>t.k===ST.foe.k)?'open':''}><summary>${esc(g.n)} <span class="mut small">${g.t.length}</span></summary><div class="gb">${g.t.map(t=>trRow(t,t.k===ST.foe.k)).join('')}</div></details>`).join('');},
 bind(d){d.querySelectorAll('[data-s="pickfoe"]').forEach(x=>x.onclick=()=>pickFoe(x.dataset.k));
  const f=$('[data-s="findtr"]',d);if(f)f.onclick=()=>picker({title:'Find trainer',items:D.TR.map(t=>({label:t.n,sub:[t.loc,trCap(t),t.g.replace(/ Split.*/,'')].filter(Boolean).join(' · '),id:t.p[0].id,v:t.k})),onPick:pickFoe});}};}
function pickFoe(k){ST.foe={k,i:0};recent(k);save();SHEETS.length=0;KB.close();SH.redraw();refreshMainOnly();}
/* -- generic picker (species, move, item, trainer) with search -- */
function picker({title,items,onPick,none}){let q='';
 const s={title:()=>title,
  body(){return `<div class="fl"></div>`;},
  bind(d){const body=$('.shb',d),hd=$('.shh',d);
   const box=document.createElement('div');box.className='kbsh';
   box.innerHTML=INV?`<div class="disp2"><span class="q" data-ph="Search"></span><button class="x" aria-label="Clear">×</button></div>`:`<input type="search" placeholder="Search" autocomplete="off">`;
   hd.insertBefore(box,$('.tt',hd));$('.tt',hd).style.display='none';
   const paint=()=>{const n=norm(q);let L=items;if(n){L=items.filter(it=>norm(it.label).includes(n)).sort((a,b)=>(norm(b.label).startsWith(n)-norm(a.label).startsWith(n))||a.label.length-b.label.length);}
    const tot=L.length;L=L.slice(0,60);body.innerHTML=(none?`<div role="button" tabindex="0" class="mrow" data-n="1"><span class="tx"><b>${esc(none)}</b></span></div>`:'')+L.map((it,i)=>`<div role="button" tabindex="0" class="mrow" data-i="${i}">${it.id?spr(it.id,'s32'):''}<span class="tx"><b>${esc(it.label)}</b>${it.sub?`<small>${esc(it.sub)}</small>`:''}</span></div>`).join('')+(tot>60?`<div class="dnote">${tot-60} more · keep typing</div>`:'')+(!tot?'<div class="dnote">No match</div>':'');
    body.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{const it=L[+x.dataset.i];KB.close();SHEETS.pop();SH.redraw();onPick(it.v);});
    const nn=$('[data-n]',body);if(nn)nn.onclick=()=>{KB.close();SHEETS.pop();SH.redraw();onPick(null);};};
   const upd=()=>{const e=$('.q',box);if(e)e.textContent=q;paint();};
   if(INV){KB.open({mode:'text',value:'',input:v=>{q=v;upd();},done:()=>{}});$('.x',box).onclick=()=>{q='';KB.buf='';KB.show();upd();};}
   else{const inp=$('input',box);inp.oninput=()=>{q=inp.value;paint();};setTimeout(()=>inp.focus(),30);}
   paint();}};
 pushSheet(s);}

/* ---------------- entry points: trainer card, Pokémon page ---------------- */
let TK=null,TI=0;
function trainerPage(){const t=trByK[TK]||trByK[ST.foe.k];TK=t.k;if(TI>=t.p.length)TI=0;const cap=capOf(t),own=+ST.cap[t.k]>0,rel=isRel(t);const x=foeBase(t,TI);const r=resolve(x);
 html($('#app'),`<div class="card trc" style="margin:0"><div class="trn"><b>${esc(t.n)}</b> <span class="mut small">${esc(t.loc)}</span></div>
  ${rel?`<div class="frow"><span class="mut" style="width:auto;font-size:12px">Level cap</span><span class="dcap ${own?'own':''} ${cap?'':'need'}">${nb(`data-cap="${t.k}" data-clr="1"`,cap||'',{min:1,max:100,label:'Level cap'})}</span></div>`:''}
  <div class="dstrip" style="margin:4px 0">${t.p.map((p,i)=>`<button data-a="tmon" data-i="${i}" class="${i===TI?'on':''}">${spr(p.id,'s28')}<span>${isNaN(monLv(p,cap))?'?':monLv(p,cap)}</span></button>`).join('')}</div>
  <div style="font-weight:700">${esc(r.name)} <span class="mut small">Lv ${r.lv??'?'}</span></div><div class="small mut">${esc([AB[x.a],x.i,x.na].filter(Boolean).join(' · '))}</div>
  <div class="small" style="margin-top:2px">${x.m.map(i=>esc(M[i])).join(' · ')||'<span class="mut">No moves listed</span>'}</div>
  <div style="margin-top:6px"><button class="dbtn pri" data-a="tcalc" style="width:100%">Calc vs ${esc(r.name)} ▸</button></div></div>`);bindCap();}
function pokePage(){const k=ST.pk,p=byId[k.id];const L=k.l;
 html($('#app'),`<div class="card" style="margin:0"><div class="pkh">${spr(p.id,'s56')}<div><h2>${esc(p.n)}</h2>${p.t.map(ty).join('')}</div></div></div>
 <div class="card calc" style="margin:0"><h3>Stat calculator</h3><div class="frow"><span style="width:auto">Level</span>${nb('data-pk="l"',L,{min:1,max:100,steppers:true,label:'Level'})}<select data-pk="na" class="grow" style="height:40px;min-width:0">${NATS.map(n=>`<option ${n===k.na?'selected':''}>${n}</option>`).join('')}</select></div>
 <div style="overflow-x:auto"><table class="stt"><tr><th class="l"></th>${SN.map(n=>`<th>${n}</th>`).join('')}</tr><tr><td class="l">Stat</td>${SN.map((n,i)=>`<td><b>${stat(p.s[i],i,k.iv[i],k.ev[i],L,k.na)}</b></td>`).join('')}</tr></table></div>
 <div style="margin-top:8px"><button class="dbtn pri" data-a="usecalc" style="width:100%">Use in calc ▸</button></div></div>`);
 document.querySelectorAll('[data-pk]').forEach(e=>e.onchange=()=>{ST.pk[e.dataset.pk]=e.dataset.pk==='l'?Math.max(1,Math.min(100,parseInt(e.value)||1)):e.value;save();pokePage();});}
function useInCalc(){const k=ST.pk,p=byId[k.id];ST.custom.push({id:k.id,l:k.l,na:k.na,a:p.a[0],i:'',m:defMoves(p,k.l),iv:k.iv.slice(),ev:k.ev.slice(),pid:'c'+Date.now()});ST.mine={src:'custom',b:0,i:ST.custom.length-1};ST.tab='custom';save();go('#/calc');}

/* ---------------- panel hooks (Thor frame) ---------------- */
window.setOption=(n,v)=>{
 if(n==='state'){if(v==='fresh'){ST.imp=null;ST.mine={src:'party',b:0,i:0};ST.custom=[];ST.edits={};}else{ST.imp=importOf('Emerald_Imperium.sav');ST.mine={src:'party',b:0,i:0};}BAN=null;}
 if(n==='foe'){const t=v==='fixed'?trByK[WATT]:v==='rel'?REL:v==='unknown'?trByK['x.1']:v==='hot'?D.TR.find(t=>t.g.startsWith('Hot House')&&t.p.length>=3):null;if(t)ST.foe={k:t.k,i:0};}
 if(n==='dir')ST.dir=v;
 if(n==='page'){go(v==='tr'?'#/tr':v==='p'?'#/p':'#/calc');return;}
 save();closeAll();route();};
if(!location.hash)history.replaceState(null,'','#/calc');
route();
</script></body></html>
